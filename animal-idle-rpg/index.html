<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E1119" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>모닥불 무리 — 방치형 동물 RPG</title>
<meta name="description" content="밤의 야영지에서 동물 무리를 키워 무한히 이어지는 야생을 정복하는 방치형 RPG." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" />
<style>
/* ── ui.css ── */
/* ══════════════════════════════════════════════════════════════════════════
   모닥불 무리 — 디자인 시스템 (모바일 퍼스트)
   빛이 닿는 만큼만 존재한다. 단일 세계관(밤)에 커밋한다.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* 지면 */
  --night:#0B0E15; --soot:#141A26; --ash:#1E2635; --slate:#2A3446;
  /* 빛 */
  --ember:#FF9333; --ember-core:#FFE2A6; --ember-deep:#C1391A;
  --moon:#9EB6D6; --firefly:#C7DE7A; --soulfire:#5FD9C4;
  /* 잉크 */
  --ink:#EDE4D6; --ink-2:rgba(237,228,214,.72);
  --label:rgba(158,182,214,.58); --dim:rgba(158,182,214,.34);
  --line:rgba(158,182,214,.10); --line-2:rgba(158,182,214,.18);
  --warm-line:rgba(255,147,51,.26);
  --glass:rgba(11,14,21,.72);
  --wl-fire:1;
  /* 타이포 */
  --disp:"Hahmlet",'Apple SD Gothic Neo','Malgun Gothic',serif;
  --body:"IBM Plex Sans KR",'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:"IBM Plex Mono","IBM Plex Sans KR",'Malgun Gothic',ui-monospace,monospace;
  /* 치수 */
  --gut:14px; --bar:calc(56px + env(safe-area-inset-bottom));
  --r:12px; --r-sm:8px;
  --spring:cubic-bezier(.2,.9,.28,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--night); color:var(--ink);
  font-family:var(--body); font-weight:400; font-size:13px; line-height:1.5;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  font-feature-settings:"tnum" 0;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;
  touch-action:manipulation;transition:transform .16s var(--spring),opacity .16s ease}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:1.5px solid var(--ember);outline-offset:2px;border-radius:4px}
svg{display:block}
.lbl{font-size:9.5px;font-weight:300;letter-spacing:.1em;color:var(--label);text-transform:none}
.num,.v,.c{font-family:var(--num);font-variant-numeric:tabular-nums}
.soul{color:var(--soulfire)} .warm{color:var(--ember)}

.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(var(--bar) + 6px)}

/* ══ 상단 재화 : 유리 위에 얹힌 한 줄 ══════════════════════════════════ */
.strip{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:0;
  padding:calc(env(safe-area-inset-top) + 9px) var(--gut) 9px;
  background:linear-gradient(180deg,rgba(11,14,21,.94),rgba(11,14,21,.78));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.res{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-right:8px}
.res .v{font-weight:600;font-size:14px;line-height:1.15;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.gold .v{color:var(--ember);text-shadow:0 0 calc(10px * var(--wl-fire)) rgba(255,147,51,.28)}
.res.snack .v{color:var(--firefly)}
.res.soul .v{color:var(--soulfire)}

/* ══ 레이아웃 ══════════════════════════════════════════════════════════ */
.grid{flex:1;display:flex;flex-direction:column;min-width:0}
.col-stage{min-width:0}

/* ══ 무대 ══════════════════════════════════════════════════════════════ */
.stage{
  position:relative;overflow:hidden;background:var(--night);
  aspect-ratio:4/3;min-height:230px;max-height:52vh;
  border-bottom:1px solid var(--line);
  contain:layout paint;
}
.stage.boss{box-shadow:inset 0 0 0 1px rgba(193,57,26,.42)}
/* 절약 모드에서 전면 캔버스를 끄는 대신 비네트는 CSS 가 한 번만 그린다 */
.stage.wl-lite::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(118% 84% at 30% 76%, transparent 32%, rgba(11,14,21,.42) 78%, rgba(11,14,21,.72) 100%)}
.field{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl-scene-mob{pointer-events:none}
.actor{position:absolute;left:0;top:0;will-change:transform}
.actor svg{display:block;overflow:visible}
.tapcatch{position:absolute;inset:0;z-index:3;cursor:crosshair}

.ov{position:absolute;pointer-events:none;z-index:6}
.ov-zone{left:var(--gut);top:10px;display:flex;align-items:baseline;flex-wrap:wrap}
.ov-zone > *{padding:0 8px;border-left:1px solid var(--line-2)}
.ov-zone > *:first-child{padding-left:0;border-left:none}
.zname{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.85)}
.bname,.grade,.tierbadge{font-size:10px;letter-spacing:.02em;color:var(--label)}
.grade{color:var(--moon)}

.ov-enemy{left:50%;top:34px;transform:translateX(-50%);width:min(320px,72%);text-align:center}
.ename{font-family:var(--disp);font-weight:500;font-size:12.5px;letter-spacing:.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ename .rank{color:var(--moon);font-weight:500;opacity:.85}
.etag{display:inline-block;font-size:8px;letter-spacing:.16em;padding-left:6px;vertical-align:1.5px}
.etag.el{color:var(--firefly)} .etag.bs{color:var(--ember-deep)} .etag.ov{color:var(--soulfire)}
.hp{position:relative;height:4px;margin-top:6px;border-radius:2px;overflow:hidden;
  background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px var(--line)}
.hp i{position:absolute;inset:0;transform-origin:left;border-radius:2px;
  background:linear-gradient(90deg,var(--ember-deep),var(--ember))}
.hp b{position:absolute;top:0;bottom:0;width:2px;background:var(--ember-core);
  box-shadow:0 0 8px var(--ember-core)}
.hptxt{margin-top:4px;font-family:var(--num);font-size:9px;font-weight:500;color:var(--dim);
  font-variant-numeric:tabular-nums;letter-spacing:.02em}

.fuse{position:absolute;left:0;top:0;height:2px;z-index:7;
  background:linear-gradient(90deg,var(--ember-core),var(--ember));box-shadow:0 0 12px var(--ember)}
.fuse.warn{animation:fuse .5s steps(2) infinite}
@keyframes fuse{50%{opacity:.3}}

.ov-waves{left:var(--gut);bottom:11px;display:flex;gap:3px;align-items:flex-end}
.wv{width:8px;height:2px;border-radius:1px;background:var(--slate);transition:background .2s}
.wv.done{background:var(--ember);opacity:.75}
.wv.cur{background:var(--ember-core);height:4px;box-shadow:0 0 8px var(--ember-core)}
.wv.el{height:4px}
.wv.bs{width:12px;height:5px}
.wv.bs.done{background:var(--ember-deep)}

.ov-ctl{right:var(--gut);bottom:9px;display:flex;gap:6px;pointer-events:auto}
.ghost{font-size:10px;letter-spacing:.02em;color:var(--ink-2);padding:6px 10px;min-height:30px;
  border:1px solid var(--line-2);border-radius:999px;background:rgba(11,14,21,.62);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ghost.on{color:var(--ember-core);border-color:var(--warm-line);background:rgba(255,147,51,.1)}

.ribbons{position:absolute;left:0;right:0;top:86px;z-index:7;display:flex;flex-direction:column;
  align-items:center;gap:4px;pointer-events:none}
.rib{font-family:var(--disp);font-weight:500;font-size:11.5px;padding:5px 12px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line-2);
  animation:ribIn .32s var(--spring), ribOut .4s ease-in 3.2s forwards}
.rib.gold{color:var(--ember-core);border-color:var(--warm-line)}
.rib.good{color:var(--firefly)} .rib.zone{color:var(--moon)}
.rib.bad{color:#FF9F8C;border-color:rgba(193,57,26,.4)} .rib.soul{color:var(--soulfire)}
@keyframes ribIn{from{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes ribOut{to{opacity:0}}

/* ══ 스킬 레일 : 엄지로 훑는 한 줄 ═════════════════════════════════════ */
.skills{display:flex;gap:6px;padding:10px var(--gut);overflow-x:auto;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(20,26,38,.5),transparent)}
.skills::-webkit-scrollbar{display:none}
.sk{position:relative;flex:0 0 auto;min-width:78px;min-height:46px;padding:8px 11px;scroll-snap-align:start;
  text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(30,38,53,.42);overflow:hidden}
.sk .n{font-family:var(--disp);font-weight:500;font-size:11.5px;white-space:nowrap}
.sk .c{font-size:9px;color:var(--dim);margin-top:2px;font-family:var(--num)}
.sk .f{position:absolute;left:0;bottom:0;height:2px;background:var(--ember);opacity:.4}
.sk.rdy{border-color:var(--warm-line)} .sk.rdy .n{color:var(--ink)}
.sk.on{border-color:var(--ember);background:rgba(255,147,51,.1)}
.sk:disabled{opacity:.35}

/* ══ 장부 ══════════════════════════════════════════════════════════════ */
.ledger{flex:1;min-width:0}
.body{padding:12px var(--gut) 18px}

.qbar{display:flex;gap:4px;align-items:center;padding:0 0 10px;margin-bottom:6px;
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.qbar::-webkit-scrollbar{display:none}
.qbar .lbl{margin-right:auto;white-space:nowrap}
.qb{flex:0 0 auto;font-family:var(--num);font-size:10.5px;padding:7px 11px;min-height:32px;
  color:var(--label);border:1px solid transparent;border-radius:999px;white-space:nowrap}
.qb.on{color:var(--ember-core);border-color:var(--warm-line);background:rgba(255,147,51,.08)}

.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);
  content-visibility:auto;contain-intrinsic-size:auto 66px}
.row:last-child{border-bottom:none}
.row.locked{opacity:.4}
.por{flex:none;width:50px;height:44px;display:flex;align-items:flex-end;justify-content:center}
.por.emoji{align-items:center;font-size:20px;color:var(--dim)}
.info{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:7px;font-family:var(--disp);font-weight:700;font-size:14px;
  letter-spacing:-.01em;min-width:0}
.nm .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{font-family:var(--num);font-size:9px;font-weight:600;color:var(--dim);letter-spacing:.03em;flex:none}
.x2{font-family:var(--num);font-size:9px;font-weight:600;color:var(--ember);flex:none}
.sub{font-size:10.5px;color:var(--label);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .pv{color:var(--ink-2)}
.mst{height:1px;background:rgba(158,182,214,.09);margin-top:7px;border-radius:1px;overflow:hidden}
.mst i{display:block;height:100%;background:var(--ember);opacity:.55}
.buy{flex:none;min-width:92px;min-height:46px;padding:6px 0 6px 10px;text-align:right;
  border-radius:var(--r-sm)}
.buy .c{font-size:12.5px;font-weight:600;color:var(--dim)}
.buy .q{font-size:9px;color:var(--label);margin-top:2px;letter-spacing:.03em}
.buy.ok .c{color:var(--ember)}
.buy:disabled{cursor:not-allowed}

.care{display:none;gap:8px;padding:0 0 12px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.row.open + .care{display:flex}
.bond{flex:1 1 130px;min-width:120px}
.bond .bar{height:3px;background:rgba(158,182,214,.1);border-radius:2px;overflow:hidden;margin-top:4px}
.bond .bar i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--ember),var(--firefly))}
.care .act{flex:0 0 auto;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line-2);
  padding:9px 13px;min-height:38px;border-radius:999px}
.care .act:disabled{opacity:.35}
.say{flex-basis:100%;font-size:11px;color:var(--moon);opacity:.9}

.note{font-size:11.5px;color:var(--ink-2);line-height:1.75;padding:11px 13px;margin-bottom:12px;
  border-radius:var(--r-sm);background:rgba(30,38,53,.4);border:1px solid var(--line)}
.note b{color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv span{color:var(--label)}
.kv b{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.big{display:block;width:100%;padding:14px;margin-top:10px;min-height:48px;
  font-family:var(--disp);font-weight:700;font-size:13.5px;border-radius:var(--r-sm);
  border:1px solid var(--warm-line);color:var(--ember-core);background:rgba(255,147,51,.09)}
.big:disabled{opacity:.35;cursor:not-allowed}
.big.soulb{border-color:rgba(95,217,196,.3);color:var(--soulfire);background:rgba(95,217,196,.07)}
.big.danger{border-color:rgba(193,57,26,.35);color:#FF9F8C;background:rgba(193,57,26,.08)}

.tier{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.tier .ic{flex:none;width:2px;height:38px;border-radius:1px;background:currentColor;opacity:.7;font-size:0}
.tier .tn{font-family:var(--disp);font-weight:700;font-size:13.5px}
.tier .td{font-size:10.5px;color:var(--label);margin-top:2px;line-height:1.6}
.tier .tr{font-family:var(--num);font-size:9.5px;color:var(--moon);opacity:.75;margin-top:5px;line-height:1.6}
.tier.sel .ic{width:3px;opacity:1}
.tier.sel .tn::after{content:'선택됨';margin-left:8px;font-family:var(--body);font-size:9px;
  font-weight:400;letter-spacing:.08em;color:var(--label)}
.tier.off{opacity:.4}
.affix{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.affix .an{font-family:var(--disp);font-weight:500;font-size:12px;white-space:nowrap}
.affix .ad{font-size:10.5px;color:var(--label);line-height:1.6}
.affix.trial .an{color:var(--ember-deep)} .affix.bless .an{color:var(--firefly)}

.mapband{display:flex;gap:2px;margin:10px 0 14px}
.mapband i{flex:1;height:16px;border-radius:2px;position:relative;opacity:.85}
.mapband i.cur{outline:1.5px solid var(--ember-core);outline-offset:1px;opacity:1}
.mapband i span{position:absolute;left:50%;top:100%;transform:translateX(-50%);
  font-family:var(--num);font-size:8px;color:var(--dim);margin-top:3px}

/* ══ 하단 탭바 ═════════════════════════════════════════════════════════ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
  background:linear-gradient(180deg,rgba(11,14,21,.82),rgba(11,14,21,.97));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
.tab{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:4px 2px;color:var(--label);border-radius:var(--r-sm);
  transition:color .18s ease}
.tab svg{width:19px;height:19px;fill:currentColor;stroke:currentColor;stroke-width:0}
.tab svg [fill="none"]{fill:none}
.tab span{font-size:9.5px;letter-spacing:.02em;font-weight:500}
.tab.on{color:var(--ember-core)}
.tab.on svg{filter:drop-shadow(0 0 8px rgba(255,147,51,.45))}
.tab .dot{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--firefly)}

/* ══ 모달 : 바텀시트 ═══════════════════════════════════════════════════ */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(4,6,10,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  animation:fade .2s ease-out}
.modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.mbox{width:100%;max-width:460px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
  border-radius:18px 18px 0 0;border:1px solid var(--line-2);border-bottom:none;
  background:linear-gradient(180deg,#1A2130,#0B0E15);
  box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sheet .34s var(--spring)}
@keyframes sheet{from{transform:translateY(14%)}}
.mbox::before{content:'';display:block;width:34px;height:3px;border-radius:2px;
  background:var(--line-2);margin:-6px auto 14px}
.mbox h3{margin:0 0 10px;font-family:var(--disp);font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.mbox p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2);line-height:1.85}
.mbox p .num{color:var(--ember)}
.mrow{display:flex;gap:8px}
.mrow .big{margin-top:0}
textarea{width:100%;height:110px;background:#0B0E15;color:var(--ink);border:1px solid var(--line-2);
  font-family:var(--num);font-size:10px;padding:10px;border-radius:var(--r-sm);resize:none}

/* ══ 데스크톱 : 같은 부품으로 두 단 ════════════════════════════════════ */
@media (min-width:860px){
  :root{--gut:20px;--bar:0px}
  .ov-enemy{top:9px}
  .ribbons{top:58px}
  .app{
    max-width:1180px;margin:0 auto;padding:0 20px 40px;
    display:grid;align-content:start;
    grid-template-columns:minmax(0,1.34fr) minmax(0,.86fr);
    grid-template-rows:auto auto 1fr;
    grid-template-areas:'strip strip' 'stage tabs' 'stage ledger';
    column-gap:18px;
  }
  .strip{grid-area:strip;position:sticky;padding:16px 0 12px;
    background:linear-gradient(180deg,var(--night) 62%,rgba(11,14,21,.86));border-bottom:1px solid var(--line)}
  .res{flex:0 0 auto;min-width:104px}
  .res .v{font-size:15px}
  .grid{display:contents}
  .col-stage{grid-area:stage;margin-top:16px}
  .stage{aspect-ratio:16/9;max-height:none;border:1px solid var(--line);border-radius:var(--r)}
  .skills{padding:10px 0 0;border-bottom:none;background:none;overflow:visible}
  .tabs{grid-area:tabs;position:sticky;top:74px;z-index:20;margin-top:16px;
    background:rgba(20,26,38,.7);backdrop-filter:none;-webkit-backdrop-filter:none;
    border:1px solid var(--line);border-bottom:none;border-radius:var(--r) var(--r) 0 0;padding:2px 4px 0}
  .tab{flex-direction:row;gap:6px;min-height:40px;border-radius:0;
    border-bottom:1.5px solid transparent;margin-bottom:-1px}
  .tab svg{width:14px;height:14px}
  .tab span{font-size:11px}
  .tab.on{border-bottom-color:var(--ember)}
  .ledger{grid-area:ledger;border:1px solid var(--line);border-top:none;
    border-radius:0 0 var(--r) var(--r);background:rgba(20,26,38,.4);
    position:sticky;top:114px;align-self:start}
  .body{padding:8px 16px 16px;max-height:min(66vh,660px);overflow-y:auto;scrollbar-width:thin}
  .modal{align-items:center}
  .mbox{border-radius:var(--r);border-bottom:1px solid var(--line-2);padding-bottom:20px}
  .mbox::before{display:none}
}

/* 모듈(스킬/이펙트) 스타일 위에 얹는 최소 보정 */
.skills .wl-sk-bar{display:flex;gap:6px;padding:0;background:none;border:none;grid-template-columns:none}
.skills .wl-sk{flex:0 0 auto;min-width:82px;min-height:46px;padding:13px 11px 8px;border-radius:var(--r-sm);
  border-color:var(--line);background:rgba(30,38,53,.42);scroll-snap-align:start}
.skills .wl-sk.rdy,.skills .wl-sk.t-leaf.rdy,.skills .wl-sk.t-soul.rdy,.skills .wl-sk.t-deep.rdy{
  border-color:var(--warm-line);background:rgba(30,38,53,.6)}
.skills .wl-sk .n{font-size:11.5px;font-weight:500}
.skills .wl-sk.rdy .n,.skills .wl-sk.t-leaf.rdy .n,.skills .wl-sk.t-soul.rdy .n,
.skills .wl-sk.t-deep.rdy .n{color:var(--ink)}
.skills .wl-sk .c{font-size:9px;color:var(--dim)}
.skills .wl-sk.rdy .c,.skills .wl-sk.t-leaf.rdy .c,.skills .wl-sk.t-soul.rdy .c,
.skills .wl-sk.t-deep.rdy .c{color:var(--label)}

  .skills .wl-sk-bar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

  *{animation-duration:.01ms !important;transition-duration:.01ms !important}

@media (min-width:860px){ .wl-fx-ribs{top:12.5% !important} }

<body>
<div class="app">

  <header class="strip">
    <div class="res gold"><span class="lbl">발자국</span><span class="v" id="r-gold">0</span></div>
    <div class="res snack"><span class="lbl">간식</span><span class="v" id="r-snack">0</span></div>
    <div class="res"><span class="lbl">초당 피해</span><span class="v" id="r-dps">0</span></div>
    <div class="res soul"><span class="lbl">야생혼</span><span class="v" id="r-soul">0</span></div>
    <div class="res"><span class="lbl">최고</span><span class="v" id="r-best">1</span></div>
  </header>

  <main class="grid">
    <section class="col-stage">
      <div class="stage" id="stage">
        <div class="field" id="field"></div>
        <div class="tapcatch" id="tap"></div>
        <div class="fuse" id="fuse" style="width:0"></div>
        <div class="ribbons" id="ribbons"></div>

        <div class="ov ov-zone">
          <span class="zname" id="o-zone">존 1</span>
          <span class="bname" id="o-biome">이끼 낀 숲</span>
          <span class="grade" id="o-grade">무풍</span>
          <span class="tierbadge" id="o-tier">산책</span>
        </div>

        <div class="ov ov-enemy">
          <div class="ename" id="o-ename">숲개미</div>
          <div class="hp"><i id="o-hpfill"></i><b id="o-hpedge" hidden></b></div>
          <div class="hptxt" id="o-hptxt"></div>
        </div>

        <div class="ov ov-waves" id="o-waves"></div>
        <div class="ov ov-ctl">
          <button class="ghost on" id="b-auto">자동 진행</button>
          <button class="ghost" id="b-quality">연출 강</button>
        </div>
      </div>
      <div class="skills" id="skillbar"></div>
    </section>

    <section class="ledger">
      <div class="body" id="tabbody"></div>
    </section>
  </main>

  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button class="tab on" data-t="pets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="7.5" r="2.4"/><circle cx="15.5" cy="7.5" r="2.4"/><circle cx="5" cy="13" r="1.9"/><circle cx="19" cy="13" r="1.9"/><path d="M12 12.6c3 0 5.2 2.3 5.2 4.6 0 1.7-1.4 2.6-3 2.6-1 0-1.6-.4-2.2-.4s-1.2.4-2.2.4c-1.6 0-3-.9-3-2.6 0-2.3 2.2-4.6 5.2-4.6Z"/></svg>
      <span>무리</span>
    </button>
    <button class="tab" data-t="skill">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2.5 5 13.2h5.2L9.4 21.5 19 10.4h-5.4l-.1-7.9Z"/></svg>
      <span>스킬</span>
    </button>
    <button class="tab" data-t="up">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-6M10 20V9M16 20v-9M22 20V4" stroke-width="2.1" fill="none" stroke-linecap="round"/></svg>
      <span>강화</span>
    </button>
    <button class="tab" data-t="diff">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 18.5 9 8.5l4 5.2 3-4 5.5 8.8H2.5Z" /><circle cx="17.5" cy="5.5" r="2.2"/></svg>
      <span>시련</span>
    </button>
    <button class="tab" data-t="asc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4c3 3.7 4.6 6.4 4.6 8.8a4.6 4.6 0 1 1-9.2 0c0-2.4 1.6-5.1 4.6-8.8Z"/><path d="M12 20.6v-4" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span>환생</span>
    </button>
    <button class="tab" data-t="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h9.5L19 8v12.5H5V3.5Z" fill="none" stroke-width="1.9" stroke-linejoin="round"/><path d="M8.5 12h7M8.5 16h4.5" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span>기록</span>
    </button>
  </nav>
</div>

<script>
/* ══ roster.js ══ */
/*!
 * WL.Content — 동료 24종 + 적 135행 콘텐츠 데이터
 * 의존성 0. IIFE. window.WL 에 부착. import/export 없음. 최상위 DOM 조작 없음.
 *
 * ─────────────────────────────────────────────────────────────────────────
 * 이 모듈이 하는 일 / 하지 않는 일
 * ─────────────────────────────────────────────────────────────────────────
 * 한다  : 동료·적의 "정체성" 데이터(이름·플레이버·패시브·조형 파라미터)와
 *         결정론적 선택 함수, 패시브 합산 함수.
 * 안 한다: 체력/보상 배율(→ WL.Difficulty), 그리기(→ WL.Creatures), DOM(→ UI).
 *
 * ★ 중요 계약 ★ enemyFor() 는 HP·보상 배율을 일절 곱하지 않는다.
 *   웨이브 종류(kind)만 알려주고, 배율은 WL.Difficulty 가 단독으로 적용한다.
 *   여기서 배율을 한 번 더 곱하면 원장의 E ≤ 2.000 상한이 깨진다.
 *
 * ─────────────────────────────────────────────────────────────────────────
 * 공개 API
 * ─────────────────────────────────────────────────────────────────────────
 * WL.Content = {
 *   VERSION,                       // '1.0.0'
 *
 *   // ── 동료 ──
 *   PETS,                          // PetRow[24] (index 0~23, append-only)
 *   PET_COUNT,                     // 24
 *   PASSIVE,                       // {petIndex: {bucket: value}} — 원장 원본 표
 *   BUCKETS,                       // {bucketKey: BucketMeta} — 버킷 사전(캡·종류·이름)
 *   petPassive(pets, bucket),      // 단일 버킷 합계 (roster 특례 포함)
 *   petPassives(pets, opt),        // 전 버킷 합산 + 파생 배율 (상한 적용)
 *   ownedPets(pets),               // 1레벨 이상 보유 종 수
 *   petCost(i, lv),                // 10 * 8.8^i * 1.07^lv
 *   petBaseDps(i),                 // 0.8 * 9.2^i
 *
 *   // ── 적 ──
 *   BIOMES,                        // BiomeRow[10]
 *   OVERLORDS,                     // OverlordRow[5]
 *   RANK,                          // 접두사 14단계
 *   ARCHETYPES,                    // 렌더러 아키타입 id 10종 (검증용)
 *   enemyFor(zone, wave, tier),    // 결정론적 적 1체
 *   biomeFor(zone),                // 지역 1행
 *   waveKind(zone, wave),          // 'mob'|'elite'|'boss'|'overlord'
 *   rankOf(zone),                  // 0..13
 *   isElite(w), isBossWave(w), isOverlord(z,w),
 *   mobIdx(z,w), eliteIdx(z,w), bossIdx(z), overlordIdx(z),
 *
 *   // ── UI 최소 헬퍼 ──
 *   passiveLine(i),                // '🦷 산의 왕 — 보스 피해 +10%'
 *   enemyLabel(e),                 // '고대의 회색올빼미 〈파수꾼〉'
 *   creatureOpts(e, size)          // WL.Creatures.make() 에 그대로 넘길 opts
 * }
 *
 * ─────────────────────────────────────────────────────────────────────────
 * 데이터 형태
 * ─────────────────────────────────────────────────────────────────────────
 * PetRow = {
 *   i:0..23,            // 배열 인덱스 = 비용/피해 계단. 절대 재배치 금지
 *   id:'fox',           // 안정 키. 세이브·렌더러 종 id 와 공유
 *   ic:'🦊',            // 폴백 이모지 (크리처 렌더러 없을 때 / 로그 줄)
 *   n:'여우 루',         // 표시 이름
 *   d:'약점을 정확히 문다',      // 미영입 상태 플레이버
 *   lore:'...',         // 영입 후 한 줄 (도감/육성용)
 *   species:'fox',      // WL.Creatures SPECIES id
 *   personality:'sly',  // WL.Nurture 성격 키 (대사 톤 결정)
 *   biome:0,            // 출신 지역 인덱스 → 초상 틴트 힌트
 *   passive:{ type:'critMult', value:0.4, desc:'약점 간파 — 치명타 배수 +0.4',
 *             name:'약점 간파', extra:{...} },   // extra = 부가 버킷(있을 때만)
 *   art:{ ... }         // WL.Creatures def() 와 같은 스키마. 신규 12종만 제공
 * }
 *
 * BiomeRow = {
 *   i, n:'이끼 낀 숲', tint:'#5E6B52',
 *   mobs  : EnemyRow[8],
 *   elites: EnemyRow[3],   // 각 원소에 title('파수꾼' 등)
 *   bosses: EnemyRow[2]
 * }
 * EnemyRow = { ic, n, a:'insect', title?, unique?, palette:{base,belly,pat,patA} }
 *   unique  = true 면 RANK 접두사를 붙이지 않는다(고유명). 대군주 5종이 해당.
 *   a       = WL.Creatures 아키타입 id (ARCHETYPES 중 하나)
 *   palette = 아키타입 spec.coat 위에 얕게 덮어쓸 색. 신규 종 데이터 0행으로
 *             135종의 외형을 만드는 장치다.
 *
 * enemyFor() 반환 = {
 *   kind, boss, ic, name, baseName, title, rank, rankName,
 *   biome:{i,n,tint}, archetype, palette, sizeMul, glow,
 *   art:{species,tier,size,tint,glow,flip}   // creatureOpts() 로도 꺼낼 수 있음
 * }
 */
(function () {
  'use strict';

  var W = (window.WL = window.WL || {});
  var VERSION = '1.0.0';

  /* ══════════════════════════════════════════════════════════════════════
     0. 유틸
     ══════════════════════════════════════════════════════════════════════ */
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  /** 음수 존/웨이브에도 안전한 나머지 */
  function mod(a, n) { return ((a % n) + n) % n; }

  /* ══════════════════════════════════════════════════════════════════════
     1. 패시브 버킷 사전
     ──────────────────────────────────────────────────────────────────────
     원장 계약: 새 "곱항"을 만들지 않는다. 대부분의 버킷은 기존 업그레이드가
     이미 쓰는 가산 괄호 안에 얹힌다. kind 가 그 배선을 지시한다.
       'add'   → 기존 (1 + 0.08*lv) 괄호 안에 더한다
       'flat'  → 초 단위 등 절대값 가산
       'prob'  → 확률 (0..1 클램프)
       'cond'  → 조건부 피해 가산 (조건 만족 시에만)
       'flag'  → 0/1 구조 플래그 (배율 없음)
     cap: 이 모듈이 스스로 적용할 수 있는 상한. null 이면 호출부가 공유 상한을
          관리한다(luck·cdr 은 업그레이드/스킬과 상한을 공유하므로 여기서
          단독 클램프하지 않는다).
     ══════════════════════════════════════════════════════════════════════ */
  var BUCKETS = {
    /* 전투 — 가산 버킷 */
    bless:     { n: '동료 피해',   kind: 'add',  cap: null, note: "globalMult 의 (1+0.08*ups.bless) 괄호 안에 가산" },
    roster:    { n: '무리 규모',   kind: 'add',  cap: null, note: '보유 종 수를 곱한 뒤 bless 와 같은 괄호에 가산' },
    claw:      { n: '터치 피해',   kind: 'add',  cap: null, note: "clickDmg 의 (1+0.35*ups.claw) 괄호 안에 가산" },
    fang:      { n: '보스 피해',   kind: 'add',  cap: null, note: "bossMult 의 (1+0.18*ups.fang) 에 가산" },
    luck:      { n: '치명타 확률', kind: 'add',  cap: null, note: '업그레이드와 60% 상한 공유 → critChance() 에서 클램프' },
    critMult:  { n: '치명타 배수', kind: 'flat', cap: null, note: '기본 ×5 에 가산 (24종 만재 ×6.0)' },
    /* 자원 */
    gold:      { n: '발자국',      kind: 'add',  cap: null, note: "goldMult 의 (1+0.12*ups.gold) 괄호 안에 가산" },
    snack:     { n: '간식',        kind: 'add',  cap: null, note: 'snackReward 말미에 (1+snack)' },
    echo:      { n: '야생혼',      kind: 'add',  cap: null, note: "soulGain 의 (1+0.15*sls.echo) 괄호 안에 가산" },
    /* 시간 */
    hunt:      { n: '보스 제한시간', kind: 'flat', cap: null, note: '초 단위. 티어 배율 적용 "전"에 가산' },
    offline:   { n: '오프라인 효율', kind: 'add', cap: 2.00, note: '오프라인 획득에 (1+offline)' },
    cdr:       { n: '쿨다운 감소', kind: 'add',  cap: null, note: 'WL.Skills 와 −60% 상한 공유 → cdrMul() 에서 클램프' },
    /* 조건부 피해 */
    lowHp:     { n: '마무리',      kind: 'cond', cap: null, note: '적 HP ≤ 30% 일 때만' },
    grip:      { n: '고정',        kind: 'cond', cap: null, note: '같은 적 교전 3초 초과일 때만' },
    elite:     { n: '정예 특효',   kind: 'cond', cap: null, note: 'kind === "elite" 일 때만' },
    shift:     { n: '지역 전환',   kind: 'cond', cap: null, note: 'zone % 5 === 1 일 때만' },
    eliteGold: { n: '정예 발자국', kind: 'add',  cap: null, note: '정예 처치 골드에만' },
    pioneer:   { n: '개척 보상',   kind: 'add',  cap: null, note: '최고 존 갱신 보스에만' },
    recrit:    { n: '재타격 확률', kind: 'prob', cap: 1.00, note: '치명타 시 같은 피해 1회 추가' },
    /* 구조 */
    mercy:     { n: '보스 구제',   kind: 'flag', cap: null, note: '>0 이면 보스 실패 시 7웨이브로 복귀' }
  };

  /* 원장 원본표 — dataShapes 의 PASSIVE 와 1바이트도 다르지 않다 */
  var PASSIVE = {
    0: { snack: 0.15 },   1: { luck: 0.02 },     2: { critMult: 0.4 },
    3: { roster: 0.003 }, 4: { offline: 0.08 },  5: { claw: 0.20 },
    6: { fang: 0.10 },    7: { hunt: 2 },        8: { gold: 0.10 },
    9: { lowHp: 0.15 },  10: { echo: 0.05 },    11: { cdr: 0.08 },
    12: { hunt: 3 },     13: { grip: 0.25 },    14: { offline: 0.12 },
    15: { critMult: 0.6 }, 16: { bless: 0.06 }, 17: { elite: 0.25, eliteGold: 0.20 },
    18: { mercy: 1 },    19: { pioneer: 0.50 }, 20: { shift: 0.20 },
    21: { recrit: 0.12 }, 22: { echo: 0.08, snack: 0.20 }, 23: { roster: 0.006 }
  };

  /* ══════════════════════════════════════════════════════════════════════
     2. 동료 24종
     ──────────────────────────────────────────────────────────────────────
     index 0~11 은 원본 그대로(append only). ic/n/d 는 원본 문자열 유지.
     cost = 10 * 8.8^i , dps = 0.8 * 9.2^i  ← 기존 공식 그대로. 주석의 값은
     그 공식의 실제 산출값이며, 코드가 런타임에 다시 계산하므로 어긋날 수 없다.

     조형 원칙: 종마다 "식별 파츠" 정확히 1개. bulk(mass) 가 오를수록 장식을
     줄인다 — 큰 몸은 실루엣만으로 읽히고, 작은 몸은 파츠로 읽힌다.
     ══════════════════════════════════════════════════════════════════════ */

  /* 신규 12종의 art 파라미터.
     WL.Creatures 의 def({...}) 스키마와 동일하다 — 그대로 def() 에 넣으면 된다.
     신규 extras 는 fluke · halo · flame 3개뿐. sucker 는 coat.pattern 의
     기존 값이므로 새 파츠가 아니다. */
  var ART = {
    /* 12. 대왕오징어 — 식별 파츠: tentacle. 심해 3종 중 유일한 무척추 실루엣 */
    squid: {
      id: 'squid', name: '대왕오징어', h: .86, w: 1.30, mass: .55, gait: 'drift', float: 1,
      body: { len: .70, arch: .02, hip: .20, chest: .40 },
      rT: [.055, .105, .150, .175, .160, .095], rB: [.050, .098, .142, .166, .150, .088],
      neck: { len: .03, ang: -8, thick: .150 },
      head: { size: .26, snout: .10, taper: .80, jaw: .30, brow: .80, tilt: -2, chin: .25 },
      legs: { rows: [], len: 0, thick: 0, bend: 1, hock: 0, sprawl: 0, paw: 0, fwd: 0, spread: 0 },
      tail: { seg: 5, len: .52, r: .055, fluff: 0, up: 4, curl: 14, lag: .34 },
      ears: { type: 'fin', h: .17, w: .22, tilt: -26, x: -.24 },
      eyes: { shape: 'round', size: .085, x: .09, y: -.06 },
      coat: { base: '#7E3F5E', belly: '#D9A6B6', pattern: 'sucker', pat: '#42203A', patA: .50 },
      extras: ['tentacle', 'mantle', 'siphon']
    },
    /* 13. 바다악어 — 식별 파츠: lips(긴 턱선). 낮고 길게 깔린 유일한 실루엣 */
    crocodile: {

  /* 최종 PETS — cost/dps 는 여기서 공식으로 생성한다(원본 .map 체인과 동일) */
  var PETS = PET_ROWS.map(function (p, i) {
    var tbl = PASSIVE[i] || {};
    var keys = Object.keys(tbl);

    }

        all: tbl
      },
      art: ART[p.species] || null      /* 0~11 은 렌더러가 이미 보유 → null */

  });

  var petCost = function (i, lv) { return 10 * Math.pow(8.8, i) * Math.pow(1.07, lv || 0); };

  /* ══════════════════════════════════════════════════════════════════════
     3. 패시브 합산
     ══════════════════════════════════════════════════════════════════════ */

  /** 1레벨 이상 보유한 "종" 수 (레벨 합이 아니다) */
  function ownedPets(pets) {
    var c = 0, n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) if (pets[i] > 0) c++;
    return c;
  }

  /**
   * 단일 버킷 합계. 원본 스펙의 petPassive(b) 와 의미가 같다.
   * 'roster' 만 특례: 합계 × 보유 종 수.
   */
  function petPassive(pets, bucket) {
    var v = 0, n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) {
      if (!(pets[i] > 0)) continue;
      var p = PASSIVE[i];
      if (p && p[bucket] !== undefined) v += p[bucket];
    }
    if (bucket === 'roster') v *= ownedPets(pets);
    var meta = BUCKETS[bucket];
    if (meta && meta.cap != null) v = Math.min(v, meta.cap);
    return v;
  }

  /**
   * 전 버킷 합산 + 파생 배율.
   *
   * @param pets  number[] — S.pets (레벨 배열). 길이가 24 미만이어도 안전.
   * @param opt   {upsLuck, upsBless, upsClaw, upsGold, upsFang, slsEcho, skillCdr}
   *              기존 업그레이드 레벨. 공유 상한(치명타 60%, 쿨감 60%)을
   *              정확히 계산하려면 넘겨야 한다. 생략하면 0으로 본다.
   *
   * @return {
   *   owned, raw:{버킷:합계},
   *   // ── 기존 괄호에 "더할" 값 (곱항을 새로 만들지 말 것) ──
   *   blessAdd, clawAdd, goldAdd, fangAdd, luckAdd, echoAdd, snackAdd,
   *   offlineAdd, huntAdd, eliteGoldAdd, pioneerAdd,
   *   // ── 조건부 (조건 만족 시에만 곱한다) ──
   *   lowHpAdd, gripAdd, eliteAdd, shiftAdd, recritP, mercy,
   *   // ── 상한이 적용된 최종값 ──
   *   critChance, critMult, cdrMul,
   *   // ── 요약 배율 (UI 표시용. 업그레이드 레벨 포함) ──
   *   dpsMult, goldMult, bossMult, snackMult, soulMult, offlineMult
   * }
   */
  function petPassives(pets, opt) {
    opt = opt || {};
    var owned = ownedPets(pets);
    var raw = {};
    for (var b in BUCKETS) raw[b] = 0;

    var n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) {
      if (!(pets[i] > 0)) continue;
      var p = PASSIVE[i];
      if (!p) continue;
      for (var k in p) if (raw[k] !== undefined) raw[k] += p[k];
    }
    raw.roster *= owned;

    /* 이 모듈이 단독으로 책임지는 상한만 적용 */
    for (var b2 in BUCKETS) {
      var cap = BUCKETS[b2].cap;
      if (cap != null && raw[b2] > cap) raw[b2] = cap;
    }

    var upsLuck  = opt.upsLuck  || 0;
    var upsBless = opt.upsBless || 0;
    var upsClaw  = opt.upsClaw  || 0;
    var upsGold  = opt.upsGold  || 0;
    var upsFang  = opt.upsFang  || 0;
    var slsEcho  = opt.slsEcho  || 0;
    var skillCdr = opt.skillCdr || 0;

    /* 공유 상한 — 업그레이드/스킬과 같은 통에 넣고 한 번만 클램프 */
    var critChance = Math.min(0.60, 0.02 * upsLuck + raw.luck);
    var cdrTotal   = Math.min(0.60, raw.cdr + skillCdr);

    /* bless 와 roster 는 "같은 가산 버킷". 곱연산으로 분리하지 말 것. */
    var blessAdd = raw.bless + raw.roster;

    return {
      owned: owned,
      raw: raw,

      blessAdd: blessAdd,
      clawAdd: raw.claw,
      goldAdd: raw.gold,
      fangAdd: raw.fang,
      luckAdd: raw.luck,
      echoAdd: raw.echo,
      snackAdd: raw.snack,
      offlineAdd: raw.offline,
      huntAdd: raw.hunt,
      eliteGoldAdd: raw.eliteGold,
      pioneerAdd: raw.pioneer,

      lowHpAdd: raw.lowHp,
      gripAdd: raw.grip,
      eliteAdd: raw.elite,
      shiftAdd: raw.shift,
      recritP: clamp(raw.recrit, 0, 1),
      mercy: raw.mercy > 0 ? 1 : 0,

      critChance: critChance,
      critMult: 5 + raw.critMult,
      cdrMul: 1 - cdrTotal,

      /* 요약 — 상단 스트립/도감 표시용. 실제 전투식은 위의 *Add 를 쓴다. */
      dpsMult: 1 + 0.08 * upsBless + blessAdd,
      goldMult: 1 + 0.12 * upsGold + raw.gold,
      bossMult: 1 + 0.18 * upsFang + raw.fang,
      snackMult: 1 + raw.snack,
      soulMult: 1 + 0.15 * slsEcho + raw.echo,
      offlineMult: 1 + raw.offline,
      clickMult: 1 + 0.35 * upsClaw + raw.claw
    };
  }

  var OVERLORDS = [

  ];

  /* 접두사 14단계. r = min(13, floor((z-1)/18)) → 존 235에서 포화.
     원본 11단계는 존 180에서 포화되는데 로스터가 존 123, 반복 환생이 300까지 간다. */
  var RANK = ['', '거친 ', '굶주린 ', '사나운 ', '단단한 ', '고대의 ', '광폭한 ',
              '전설의 ', '심연의 ', '초월한 ', '신화의 ', '초신성의 ', '무형의 ', '태초의 '];

  /* ══════════════════════════════════════════════════════════════════════
     5. 결정론적 선택
     ──────────────────────────────────────────────────────────────────────
     NORD: 일반 웨이브(1,2,3,5,6,8,9)에 0..6 순번을 부여한다.
     원안의 (z*7 + w*3) % 8 은 w=1 과 w=9 가 8 차이라 mod 8 에서 반드시
     충돌한다 — 선형 사상으로는 불가능하다. 순번 룩업이 유일한 해법이다.
     ══════════════════════════════════════════════════════════════════════ */
  var NORD = [0, 0, 1, 2, 0, 3, 4, 0, 5, 6];   /* 인덱스 = w (1..9). w4·w7 미사용 */

  function isElite(w) { return w === 4 || w === 7; }
  function isBossWave(w) { return w === 10; }
  function isOverlord(z, w) { return w === 10 && z % 50 === 0; }
  function cycleOf(z) { return Math.floor((z - 1) / 50); }

  function mobIdx(z, w) { return mod(z * 3 + NORD[w], 8); }
  function eliteIdx(z, w) { return mod(z * 5 + (w === 4 ? 0 : 1), 3); }
  function bossIdx(z) { return mod(cycleOf(z), 2); }
  function overlordIdx(z) { return mod(Math.round(z / 50) - 1, OVERLORDS.length); }

  function biomeFor(z) { return BIOMES[mod(Math.floor((z - 1) / 5), BIOMES.length)]; }
  function rankOf(z) { return clamp(Math.floor((z - 1) / 18), 0, RANK.length - 1); }

  function waveKind(z, w) {
    if (isOverlord(z, w)) return 'overlord';
    if (isBossWave(w)) return 'boss';
    if (isElite(w)) return 'elite';
    return 'mob';
  }

  /* 종류별 렌더 크기 배수 — 전투력이 아니라 "눈에 보이는 위압" 전용 */
  var SIZE_MUL = { mob: 1.00, elite: 1.22, boss: 1.55, overlord: 1.90 };
  var GLOW = { mob: 0, elite: 0.18, boss: 0.45, overlord: 0.85 };

  /**
   * 결정론적으로 적 1체를 뽑는다. 같은 (zone, wave) → 항상 같은 적.
   * tier 는 이름/종을 바꾸지 않는다 — 높은 티어에서 발광만 약간 세진다.
   *
   * ★ HP·보상 배율은 여기서 곱하지 않는다. WL.Difficulty 단독 책임.
   */
  function enemyFor(zone, wave, tier) {
    var z = Math.max(1, Math.floor(zone || 1));
    var w = clamp(Math.floor(wave || 1), 1, 10);
    var t = clamp(Math.floor(tier || 0), 0, 4);

    var kind = waveKind(z, w);
    var b = biomeFor(z);
    var r = rankOf(z);
    var row, title = null;

    if (kind === 'overlord')   row = OVERLORDS[overlordIdx(z)];
    else if (kind === 'boss')  row = b.bosses[bossIdx(z)];
    else if (kind === 'elite') { row = b.elites[eliteIdx(z, w)]; title = row.title; }
    else                       row = b.mobs[mobIdx(z, w)];

    /* 고유명(대군주)은 접두사를 붙이지 않는다.
       RANK 는 "같은 종이 깊은 곳에서 더 사나워진다"를 말하는 장치인데,
       대군주는 애초에 한 번씩만 나타나는 고유 개체다. 게다가 r=13('태초의')
       + '최초의 짐승' 처럼 같은 형태소가 겹쳐 한국어가 무너지는 조합이 나온다. */
    var px = row.unique ? '' : RANK[r];
    var name = px + row.n + (title ? ' 〈' + title + '〉' : '');
    var glow = GLOW[kind] + 0.04 * t;

    return {
      kind: kind,
      boss: kind === 'boss' || kind === 'overlord',
      elite: kind === 'elite',
      ic: row.ic,
      name: name,
      baseName: row.n,
      title: title,
      rank: r,
      rankName: px.trim(),
      biome: { i: b.i, n: b.n, tint: b.tint },
      archetype: row.a,
      palette: row.palette,
      sizeMul: SIZE_MUL[kind],
      glow: glow,
      tier: t,
      /* WL.Creatures.make() 에 그대로 넘길 수 있는 형태.
         renderer 의 tier 는 0..10 이므로 RANK(0..13) 를 클램프한다. */
      art: {
        species: row.a,
        tier: Math.min(10, r),
        coat: row.palette,
        tint: b.tint,
        glow: glow,
        seed: z * 1000 + w
      }
    };
  }

  /* ══════════════════════════════════════════════════════════════════════
     6. UI 최소 헬퍼
     ══════════════════════════════════════════════════════════════════════ */

  /** '🦷 산의 왕 — 보스에게 주는 피해 +10%' */
  function passiveLine(i) {
    var p = PETS[i];
    return p ? p.ic + ' ' + p.passive.desc : '';
  }

  /** 로그 한 줄용 이름 (이모지 포함) */
  function enemyLabel(e) { return e ? e.ic + ' ' + e.name : ''; }

  /**
   * enemyFor() 결과 → WL.Creatures.make() opts.
   * 렌더러가 없으면 호출부가 ic 이모지로 폴백하면 된다.
   */
  function creatureOpts(e, size) {
    var s = size || 96;
    return {
      species: e.art.species,
      tier: e.art.tier,
      size: s * e.sizeMul,
      fit: 'scene',
      flip: true,
      tint: e.art.tint,
      glow: e.art.glow,
      seed: e.art.seed,
      coat: e.art.coat
    };
  }

const HP_CAP = 1e300;
const hpCache = [0, 10];
/** 존 기본 체력. zoneHP(1)=10, 이후 존당 ×(1.42 + min(0.26, z×0.0012)) */
function zoneHP(z){
  z = Math.max(1, Math.floor(z));
  if(hpCache[z] !== undefined) return hpCache[z];
  let hp = hpCache[hpCache.length - 1];
  for(let i = hpCache.length; i <= z; i++){
    hp = Math.min(HP_CAP, hp * (1.42 + Math.min(0.26, i * 0.0012)));
    hpCache[i] = hp;
  }
  return hpCache[z];
}

/* ══════════════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════════════ */

const WAVES_PER_ZONE = 10;
const BOSS_WAVE      = 10;
const ELITE_WAVES    = [4, 7];
const OVERLORD_EVERY = 50;
const OVERLORD_TIME  = 1.35;   // 대군주 제한시간 배수
const BASE_BOSS_TIME = 30;     // 원본과 동일

/** 웨이브 종류별 배율. hp=체력, gold=발자국, snack=간식 기본치 */
const WAVE = {
  mob:      {hp:1.0, gold:1,  snack:0.8, n:'일반'},
  elite:    {hp:2.2, gold:3,  snack:5,   n:'정예'},
  boss:     {hp:5.5, gold:9,  snack:14,  n:'보스'},
  overlord: {hp:8.8, gold:18, snack:40,  n:'대군주'},
};
const REGION_SNACK = 30;       // 지역 돌파(5존마다) 1회성 간식 계수

const waveHpFactor = w => 1 + (w - 1) * 0.12;

const isBossWave  = w => w === BOSS_WAVE;
const isOverlord  = (z, w) => w === BOSS_WAVE && z % OVERLORD_EVERY === 0;
const isElite     = (z, w) => w === 4 || w === 7;

function waveKind(z, w){
  if(w === BOSS_WAVE) return (z % OVERLORD_EVERY === 0) ? 'overlord' : 'boss';
  if(w === 4 || w === 7) return 'elite';
  return 'mob';
}

/* 적 테이블 인덱스 선택자.
   테이블(지역 10 × 일반8/정예3/보스2 + 대군주 5)은 로스터 모듈이 소유하고,
   '어느 행을 쓸지'만 여기서 결정론적으로 고른다.
   NORD: 일반 웨이브 7개의 순번(0..6). 선형식 (z*a+w*b)%8 로는
   w=1과 w=9가 항상 충돌하므로(차이 8) 순번 룩업이 필수다. */
const NORD = [0, 0, 1, 2, 0, 3, 4, 0, 5, 6];   // 첨자 = wave(1..9), w4·w7은 미사용
const pick = {
  mob:      (z, w) => (z * 3 + NORD[w]) % 8,
  elite:    (z, w) => (z * 5 + (w === 4 ? 0 : 1)) % 3,
  boss:     z => Math.floor((z - 1) / OVERLORD_EVERY) % 2,
  overlord: z => (Math.floor(z / OVERLORD_EVERY) - 1 + 1e9) % 5,
};

/* 존 1개의 단위 합 — 어픽스 시간계수 tf와 보상 중립성의 분모가 된다 */
const UNITS = (function(){
  const u = {hp:{mob:0, elite:0, boss:0}, gold:{mob:0, elite:0, boss:0},
             snack:{mob:0, elite:0, boss:0}, kills:{mob:0, elite:0, boss:0}};
  for(let w = 1; w <= WAVES_PER_ZONE; w++){
    const k = waveKind(1, w);                    // 1존 = 대군주 아님 = 표준 존
    u.hp[k]    += waveHpFactor(w) * WAVE[k].hp;  // 체력은 웨이브 보정을 받는다
    u.gold[k]  += WAVE[k].gold;                  // 발자국은 받지 않는다(원본 규칙)
    u.snack[k] += WAVE[k].snack;
    u.kills[k] += 1;
  }
  const sum = o => o.mob + o.elite + o.boss;
  u.hp.total = sum(u.hp); u.gold.total = sum(u.gold);
  u.snack.total = sum(u.snack); u.kills.total = sum(u.kills);
  return u;
})();

const SNACK_RULE_EXP = 1.3;   // 간식 = tf^1.3

function deriveAffix(src){
  const a = {
    id:src.id, kind:src.kind, ic:src.ic, n:src.n, d:src.d, tip:src.tip,
    dmg:     src.dmg     === undefined ? 1 : src.dmg,
    hpMob:   src.hpMob   === undefined ? 1 : src.hpMob,
    hpElite: src.hpElite === undefined ? 1 : src.hpElite,
    hpBoss:  src.hpBoss  === undefined ? 1 : src.hpBoss,
    dup:     src.dup     === undefined ? 1 : src.dup,

  const U = UNITS.hp;
  /* 존 전투시간 배율: 체력 총량이 늘어난 만큼 + 피해가 줄어든 만큼 */
  a.tf = (U.mob * a.hpMob * a.dup + U.elite * a.hpElite + U.boss * a.hpBoss)
         / U.total / a.dmg;
  /* 보스 제한시간 배율 — 보스 체력비 ÷ 피해비. 이 정의가 '실패율 불변'을 만든다 */
  a.bt = a.hpBoss / a.dmg;

  /* ── 발자국 ── */
  const G = UNITS.gold, K = UNITS.kills;
  if(src.g !== undefined){
    a.gold = {mob:src.g, elite:src.g, boss:src.g};
  } else if(a.kind === 'trial'){
    if(a.dup === 1){
      a.gold = {mob:a.tf, elite:a.tf, boss:a.tf};          // 균일 = tf
    } else {
      /* 처치 수가 늘어난 채널(일반)만 조정해 존 총량을 정확히 tf로 맞춘다 */
      const m = (G.total * a.tf - G.elite - G.boss) / (G.mob * a.dup);
      a.gold = {mob:m, elite:1, boss:1};
    }
  } else {
    a.gold = {mob:1, elite:1, boss:1};
  }

  /* ── 간식 ── */
  if(src.sn !== undefined){
    a.snack = {mob:src.sn, elite:src.sn, boss:src.sn};
  } else if(a.kind === 'trial'){
    const target = Math.pow(a.tf, SNACK_RULE_EXP);
    if(a.dup === 1){
      a.snack = {mob:target, elite:target, boss:target};
    } else {
      const S = UNITS.snack;
      const m = (S.total * target - S.elite - S.boss) / (S.mob * a.dup);
      a.snack = {mob:m, elite:1, boss:1};
    }
  } else {
    a.snack = {mob:1, elite:1, boss:1};
  }

  /* 존 총량 배율 (검증·UI용) */
  const zone = (per, unit) =>
    (unit.mob * a.dup * per.mob + unit.elite * per.elite + unit.boss * per.boss) / unit.total;
  a.zoneGold  = zone(a.gold,  G);
  a.zoneSnack = zone(a.snack, UNITS.snack);
  a.snackFloor = Math.pow(a.tf, SNACK_RULE_EXP);
  return a;
}

   순수 함수이므로 '아직 가 보지 않은 존'의 어픽스도 미리 계산된다.        */
const AFFIX_BLOCK = 5;
const DEFAULT_SEED = 1;

function hash32(a, b){
  let h = (Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663)) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

function affixesFor(zone, tier, seed){
  const T = tierOf(tier);
  if(!T.affix) return [];
  const blk = Math.floor((Math.max(1, Math.floor(zone)) - 1) / AFFIX_BLOCK);
  const sd  = (seed === undefined || seed === null || !isFinite(seed)) ? DEFAULT_SEED : (seed | 0);
  return [
    TRIALS [hash32(blk, sd) % TRIALS.length],
    BLESSES[hash32(blk, sd + 7) % BLESSES.length],
  ];
}

/** 어픽스 배열을 어떤 형태로 받아도(객체/아이디/미지정) 정규화한다 */
function normAffixes(ctx){
  if(ctx && ctx.affixes){
    const out = [];
    for(const x of ctx.affixes){
      const a = (typeof x === 'string') ? AFFIX_BY_ID[x] : x;
      if(a && a.id) out.push(a);
    }
    return out;
  }
  return affixesFor(ctx && ctx.zone !== undefined ? ctx.zone : 1,
                    ctx && ctx.tier, ctx && ctx.seed);
}
const affixMul = (list, field) => list.reduce((m, a) => m * (a[field] === undefined ? 1 : a[field]), 1);
const affixMulK = (list, field, kind) =>
  list.reduce((m, a) => m * ((a[field] && a[field][kind] !== undefined) ? a[field][kind] : 1), 1);

/* ══════════════════════════════════════════════════════════════════════════
   4. 유효 난이도 E — 존 하나를 비우는 데 걸리는 시간의 배율. 상한 2.000
   ══════════════════════════════════════════════════════════════════════════ */

function E(zone, tier, seed){
  return tierOf(tier).hp * affixMul(affixesFor(zone, tier, seed), 'tf');
}

/** 이 티어에서 나올 수 있는 최악의 E */
function worstE(tier){
  let worst = 1;
  const T = tierOf(tier);
  if(!T.affix) return T.hp;
  for(const tr of TRIALS) for(const bl of BLESSES)
    worst = Math.max(worst, tr.tf * bl.tf);
  return T.hp * worst;
}

/* ══════════════════════════════════════════════════════════════════════════
   5. 적 보정
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * @param {number|null} baseHP  웨이브 보정까지 끝난 순수 기본 체력
 *                              = zoneHP(z) × (1 + (w-1)×0.12).
 *                              null이면 zone/wave로 직접 계산한다.
 *                              (종류 배율 ×2.2/×5.5/×8.8은 이 함수가 붙인다)
 * @param {object} ctx {zone, wave, tier, seed, affixes, kind, isBoss, hunt, petHunt}
 */
function applyToEnemy(baseHP, ctx){
  ctx = ctx || {};
  const z = Math.max(1, Math.floor(ctx.zone === undefined ? 1 : ctx.zone));
  const w = Math.min(WAVES_PER_ZONE, Math.max(1, Math.floor(ctx.wave === undefined ? 1 : ctx.wave)));
  let kind = ctx.kind;
  if(!kind || !WAVE[kind]){
    kind = (ctx.isBoss === true && ctx.wave === undefined) ? 'boss' : waveKind(z, w);
  }
  const T  = tierOf(ctx.tier);
  const ax = normAffixes({zone:z, tier:ctx.tier, seed:ctx.seed, affixes:ctx.affixes});

  const base = (baseHP === undefined || baseHP === null || !isFinite(baseHP))
             ? zoneHP(z) * waveHpFactor(w) : baseHP;

  const hpField = kind === 'mob' ? 'hpMob' : kind === 'elite' ? 'hpElite' : 'hpBoss';
  const affixHP = affixMul(ax, hpField);
  const hpMult  = WAVE[kind].hp * T.hp * affixHP;

  const boss = (kind === 'boss' || kind === 'overlord');
  return {
    kind: kind,
    zone: z, wave: w, tier: T.t,
    hp: Math.min(HP_CAP, base * hpMult),
    hpMult: hpMult,
    count: (kind === 'mob') ? Math.round(affixMul(ax, 'dup')) : 1,
    playerDmgMult: affixMul(ax, 'dmg'),
    timeLimit: boss ? bossTimeFor({zone:z, wave:w, tier:ctx.tier, seed:ctx.seed,
                                   affixes:ax, hunt:ctx.hunt, petHunt:ctx.petHunt}) : 0,
    goldMult:  affixMulK(ax, 'gold',  kind === 'overlord' ? 'boss' : kind),
    snackMult: affixMulK(ax, 'snack', kind === 'overlord' ? 'boss' : kind),
    affixes: ax.map(a => a.id),
  };
}

function enemyMaxHP(zone, wave, opts){
  opts = opts || {};
  return applyToEnemy(null, {zone:zone, wave:wave, tier:opts.tier,
                             seed:opts.seed, affixes:opts.affixes}).hp;
}

/**
 * 보스 제한시간(초).
 * (30 + 4×보스사냥꾼 + 동료 hunt) × 티어 hp × 어픽스 bt × (대군주 ? 1.35 : 1)
 * 티어 hp가 체력과 시간에 '같이' 곱해지는 것이 난이도 절벽 제거의 핵심이다.
 */
function bossTimeFor(opts){
  opts = opts || {};
  const z = Math.max(1, Math.floor(opts.zone === undefined ? 1 : opts.zone));
  const w = opts.wave === undefined ? BOSS_WAVE : opts.wave;
  const T = tierOf(opts.tier);
  const ax = normAffixes({zone:z, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  const base = BASE_BOSS_TIME + 4 * (opts.hunt || 0) + (opts.petHunt || 0);
  return base * T.hp * affixMul(ax, 'bt') * (isOverlord(z, w) ? OVERLORD_TIME : 1);
}

/* ══════════════════════════════════════════════════════════════════════════
   6. 보상
      발자국 = zoneHP × 0.09 × 종류배율 × 티어 rg × 어픽스 × goldMult()
      간식   = 기본치 × √B(z) × 티어 rn × 어픽스 × (1 + 동료 snack)
      B(z) = 절대 심도. 플레이어 강함과 무관하므로 저존 눌러앉기가 이득이 될 수 없다.
   ══════════════════════════════════════════════════════════════════════════ */

const GOLD_K   = 0.09;
const DEPTH_LEN = 15;
const depth  = z => 1 + Math.floor((Math.max(1, Math.floor(z)) - 1) / DEPTH_LEN);
const depthS = z => Math.sqrt(depth(z));

/**
 * 처치 1회분 보상.
 * @param ctx {
 *   zone, wave,                  필수
 *   tier, seed,                  난이도 / 어픽스 시드
 *   kind,                        생략 시 waveKind로 판정
 *   goldMult   = 1,              호스트 goldMult() (사냥 본능·황금 심장·황금 사냥)
 *   snackBonus = 0,              petPassive('snack')  가산
 *   eliteGold  = 0,              petPassive('eliteGold')  정예 전용 가산
 *   pioneer    = 0,              petPassive('pioneer')    최고 존 갱신 보스 가산
 *   newBest    = false           이 보스가 최고 존 갱신분인가 (zone > state.bestBeaten)
 * }
 * @returns {gold, snack, kind, zoneHP, depth, tierGold, tierSnack, affixes}
 */
function rewardFor(ctx){
  ctx = ctx || {};
  const z = Math.max(1, Math.floor(ctx.zone === undefined ? 1 : ctx.zone));
  const w = Math.min(WAVES_PER_ZONE, Math.max(1, Math.floor(ctx.wave === undefined ? 1 : ctx.wave)));
  const kind = (ctx.kind && WAVE[ctx.kind]) ? ctx.kind : waveKind(z, w);
  const T  = tierOf(ctx.tier);
  const ax = normAffixes({zone:z, tier:ctx.tier, seed:ctx.seed, affixes:ctx.affixes});
  const ch = (kind === 'overlord') ? 'boss' : kind;

  let gm = WAVE[kind].gold * T.rg * affixMulK(ax, 'gold', ch)
         * (ctx.goldMult === undefined ? 1 : ctx.goldMult);
  if(kind === 'elite')                      gm *= 1 + (ctx.eliteGold || 0);
  if((kind === 'boss' || kind === 'overlord') && ctx.newBest) gm *= 1 + (ctx.pioneer || 0);

  const snack = WAVE[kind].snack * depthS(z) * T.rn * affixMulK(ax, 'snack', ch)
              * (1 + (ctx.snackBonus || 0));

  return {
    kind: kind, zone: z, wave: w,
    gold:  Math.min(HP_CAP, zoneHP(z) * GOLD_K * gm),
    snack: snack,
    zoneHP: zoneHP(z), depth: depth(z),
    tierGold: T.rg, tierSnack: T.rn,
    affixes: ax.map(a => a.id),
  };
}

/** 지역 돌파(5존마다, z%5===1 진입 시) 1회성 간식 */
function regionReward(zone, opts){
  opts = opts || {};
  const T = tierOf(opts.tier);
  const ax = normAffixes({zone:zone, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  return {
    snack: REGION_SNACK * depthS(zone) * T.rn * affixMulK(ax, 'snack', 'boss')
         * (1 + (opts.snackBonus || 0)),
  };
}

/** 환생 야생혼 배율 (soulGain에 곱한다) */
const soulMult = t => tierOf(t).rs;

/** 존 1개 총량 — 중립성 검증과 티어 비교 UI에 쓴다 (대군주 제외한 표준 존) */
function zoneReward(zone, opts){
  opts = opts || {};
  let gold = 0, snack = 0;
  for(let w = 1; w <= WAVES_PER_ZONE; w++){
    const kind = waveKind(1, w);                       // 표준 존
    const mod  = applyToEnemy(null, {zone:zone, wave:w, tier:opts.tier,
                                     seed:opts.seed, affixes:opts.affixes, kind:kind});
    const r = rewardFor({zone:zone, wave:w, kind:kind, tier:opts.tier, seed:opts.seed,
                         affixes:opts.affixes, goldMult:opts.goldMult,
                         snackBonus:opts.snackBonus, eliteGold:opts.eliteGold});
    gold  += r.gold  * mod.count;
    snack += r.snack * mod.count;
  }
  return {gold:gold, snack:snack, E:E(zone, opts.tier, opts.seed)};
}

/* ══════════════════════════════════════════════════════════════════════════
   7. 벽 지수 W — 표시 전용. 보상에는 절대 관여하지 않는다.
      W = 보스 체력 / (실사용 DPS) / 보스 제한시간
      W ≥ 1.00 이면 '제한시간 안에 물리적으로 못 잡는다'. 지표가 곧 벽의 정의다.

      ※ 티어·어픽스는 체력과 시간에 같은 계수로 곱해지므로 W에서 상쇄된다.
        즉 난이도를 올려도 벽의 '위치'는 그대로고 소요 시간만 늘어난다 —
        그것이 이 설계의 논지이며, soak 값이 그 변화를 대신 보여준다.
   ══════════════════════════════════════════════════════════════════════════ */

const GRADES = [
  {k:'calm',  max:0.08,     n:'무풍', c:'#5ec8f0'},
  {k:'fair',  max:0.20,     n:'순조', c:'#54c98a'},
  {k:'tense', max:0.40,     n:'긴장', c:'#e0c344'},
  {k:'tight', max:0.65,     n:'팽팽', c:'#e8a93a'},
  {k:'harsh', max:1.00,     n:'험난', c:'#f08a3c'},
  {k:'wall',  max:Infinity, n:'불가', c:'#a02c4a'},
];
const gradeOf = idx => {
  for(let i = 0; i < GRADES.length; i++) if(idx < GRADES[i].max) return GRADES[i];
  return GRADES[GRADES.length - 1];
};

/**
 * 체감 난이도.
 * @param zone
 * @param playerDps   동료 총 DPS (totalDps() — 자동터치 제외한 값)
 * @param opts {tier, seed, autoRatio, bossMult, hunt, petHunt, affixes}
 * @returns {index, grade, gradeIndex, name, color, fill, ttk, soak, E, clearDps}
 */
function ratingOf(zone, playerDps, opts){
  opts = opts || {};
  const z = Math.max(1, Math.floor(zone));
  const w = BOSS_WAVE;
  const ax = normAffixes({zone:z, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  const mod = applyToEnemy(null, {zone:z, wave:w, tier:opts.tier, seed:opts.seed, affixes:ax});
  const t   = bossTimeFor({zone:z, wave:w, tier:opts.tier, seed:opts.seed, affixes:ax,
                           hunt:opts.hunt, petHunt:opts.petHunt});

  /* 실사용 DPS = 동료 DPS × (1 + 자동터치 비율) × 보스 피해 × 어픽스 피해 */
  const eff = Math.max(0, playerDps || 0)
            * (1 + (opts.autoRatio || 0))
            * (opts.bossMult === undefined ? 1 : opts.bossMult)
            * mod.playerDmgMult;

  const index = eff > 0 ? (mod.hp / eff / Math.max(t, 1e-9)) : Infinity;
  const g = gradeOf(index);

  /* 존 전체 소요 시간(초) — 티어·어픽스에 따라 실제로 변하는 값 */
  let soak = 0;
  if(eff > 0){
    const effZone = Math.max(0, playerDps || 0) * (1 + (opts.autoRatio || 0)) * mod.playerDmgMult;
    for(let ww = 1; ww <= WAVES_PER_ZONE; ww++){
      const m = applyToEnemy(null, {zone:z, wave:ww, tier:opts.tier, seed:opts.seed, affixes:ax});
      const d = (m.kind === 'boss' || m.kind === 'overlord')
              ? effZone * (opts.bossMult === undefined ? 1 : opts.bossMult) : effZone;
      soak += (m.hp * m.count) / Math.max(d, 1e-9);
    }
  } else soak = Infinity;

  return {
    zone: z,
    index: index,
    grade: g, gradeIndex: GRADES.indexOf(g), name: g.n, color: g.c,
    fill: Math.max(0, Math.min(1, index)),          // 게이지 0~1 (1.0 지점이 눈금)
    ttk: eff > 0 ? mod.hp / eff : Infinity,         // 보스 처치 소요(초)
    soak: soak,                                     // 존 전체 소요(초)
    clearDps: mod.hp / Math.max(t, 1e-9) / Math.max(mod.playerDmgMult, 1e-9),
    E: E(z, opts.tier, opts.seed),
    affixes: ax.map(a => a.id),
    overlord: isOverlord(z, w),
  };
}

/** 앞뒤 존 색 띠(#ui-map)용. 기본 −8 ~ +11 존 */
function forecast(zone, playerDps, opts){
  opts = opts || {};
  const back = opts.back === undefined ? 8 : opts.back;
  const fwd  = opts.fwd  === undefined ? 11 : opts.fwd;
  const from = Math.max(1, Math.floor(zone) - back);
  const to   = Math.floor(zone) + fwd;
  const log  = opts.wallLog || {};
  const out  = [];
  for(let z = from; z <= to; z++){
    const r = ratingOf(z, playerDps, opts);
    out.push({
      zone: z, color: r.color, name: r.name, gradeIndex: r.gradeIndex,
      index: r.index, cur: z === Math.floor(zone),
      region: z % AFFIX_BLOCK === 1, overlord: isOverlord(z, BOSS_WAVE),
      fails: log[z] || 0,
      affixes: r.affixes,
    });
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   8. 상태 · 해금 · 마이그레이션
   ══════════════════════════════════════════════════════════════════════════ */

const FIELDS = ['tier', 'affixSeed', 'snack', 'bestBeaten', 'tierBest', 'wallLog'];
const WALLLOG_KEEP = 40;

const newState = () => ({
  tier: 0, affixSeed: DEFAULT_SEED, snack: 0, bestBeaten: 1,
  tierBest: {}, wallLog: {},
});

/** 해금 판정. state = {best, ascs} */
function unlocked(state){
  const best = (state && state.best) || 1;
  const ascs = (state && state.ascs) || 0;
  const list = TIERS.map(T => {
    const zOK = best >= T.zone, aOK = ascs >= T.asc;
    let reason = '';
    if(!zOK && !aOK)      reason = '환생 ' + T.asc + '회 + 최고 존 ' + T.zone + ' 필요';
    else if(!zOK)         reason = '최고 존 ' + T.zone + ' 필요 (현재 ' + best + ')';
    else if(!aOK)         reason = '환생 ' + T.asc + '회 필요 (현재 ' + ascs + ')';
    return {tier:T.t, ok:zOK && aOK, reason:reason, zone:T.zone, asc:T.asc};
  });
  let max = 0;
  for(const r of list) if(r.ok) max = Math.max(max, r.tier);
  return {max:max, list:list, next:list.find(r => !r.ok) || null};
}

const tierUnlocked = (t, state) => unlocked(state).list[tierOf(t).t].ok;

/** 난이도 변경. 해금되지 않았으면 false를 반환하고 아무것도 바꾸지 않는다 */
function setTier(state, t){
  if(!state) return false;
  const T = TIERS[t | 0];
  if(!T) return false;
  if(!tierUnlocked(T.t, state)) return false;
  state.tier = T.t;
  return true;
}

function trimWallLog(state){
  const keys = Object.keys(state.wallLog);
  if(keys.length <= WALLLOG_KEEP) return;
  keys.sort((a, b) => (+b) - (+a));
  const next = {};
  for(let i = 0; i < WALLLOG_KEEP; i++) next[keys[i]] = state.wallLog[keys[i]];
  state.wallLog = next;
}

/**
 * 기존 세이브에 난이도 필드를 얹는다. 자기 소유 키만 건드린다(멱등).
 * v1 세이브는 tier=0(E=1.000)으로 진입 → 기존 플레이어는 체감 변화가 없다.
 */
function migrate(save){
  const S = save || {};
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

  S.tier = num(S.tier, 0) | 0;
  if(!TIERS[S.tier]) S.tier = 0;
  S.affixSeed  = num(S.affixSeed, DEFAULT_SEED) | 0;
  S.snack      = Math.max(0, num(S.snack, 0));
  S.bestBeaten = Math.max(1, num(S.bestBeaten, 1) | 0);
  S.tierBest   = obj(S.tierBest);
  S.wallLog    = obj(S.wallLog);

  /* 해금되지 않은 티어로 저장된 세이브는 가능한 최고 티어로 내린다 */
  const mx = unlocked(S).max;
  if(S.tier > mx) S.tier = mx;

  trimWallLog(S);
  if(!(num(S.v, 1) >= 2)) S.v = 2;
  return S;
}

/** 보스를 실제로 잡았을 때. bestBeaten·tierBest 갱신 (보상 지급 뒤에 호출) */
function recordBest(state, zone, kind){
  if(!state) return;
  const z = Math.floor(zone);
  if(kind === 'boss' || kind === 'overlord' || kind === undefined)
    state.bestBeaten = Math.max(state.bestBeaten || 1, z);
  const t = String(state.tier | 0);
  state.tierBest = state.tierBest || {};
  state.tierBest[t] = Math.max(state.tierBest[t] || 1, z);
}

/** 보스 제한시간 초과. 지도 띠의 💀 표시용 */
function recordBossFail(state, zone){
  if(!state) return;
  state.wallLog = state.wallLog || {};
  const k = String(Math.floor(zone));
  state.wallLog[k] = (state.wallLog[k] || 0) + 1;
  trimWallLog(state);
}

/* ══════════════════════════════════════════════════════════════════════════
   9. UI 헬퍼 (문자열만 만든다 — DOM은 건드리지 않는다)
   ══════════════════════════════════════════════════════════════════════════ */

const x = v => '×' + (v >= 10 ? v.toFixed(1) : v.toFixed(2));

function describeTier(t){
  const T = tierOf(t);
  return {
    tier:T.t, key:T.k, icon:T.ic, name:T.n, color:T.c, desc:T.d,
    label: T.ic + ' ' + T.n,
    hp:    '적 체력 ' + x(T.hp),
    gold:  '발자국 ' + x(T.rg),
    snack: '간식 ' + x(T.rn),
    soul:  '환생 야생혼 ' + x(T.rs),
    line:  '발자국 ' + x(T.rg) + ' · 간식 ' + x(T.rn) + ' · 야생혼 ' + x(T.rs),
    perSec:'초당 발자국 ' + x(T.rg / T.hp) + ' · 초당 간식 ' + x(T.rn / T.hp),
    bossTime: Math.round(BASE_BOSS_TIME * T.hp) + '초',
    slots: T.slots,
    need:  T.zone === 0 && T.asc === 0 ? '기본 해금'
         : T.asc === 0 ? '최고 존 ' + T.zone
         : '환생 ' + T.asc + '회 + 최고 존 ' + T.zone,
  };
}

function describeAffix(a){
  const A = (typeof a === 'string') ? AFFIX_BY_ID[a] : a;
  if(!A) return null;
  return {
    id:A.id, kind:A.kind, icon:A.ic, name:A.n, desc:A.d, tip:A.tip,
    label: A.ic + ' ' + A.n,
    badge: A.kind === 'trial' ? '시련' : '축복',
    reward: A.kind === 'trial'

function selfTest(){
  const fails = [];
  const near = (a, b, eps, msg) => { if(!(Math.abs(a - b) <= eps)) fails.push(msg + ' (' + a + ' vs ' + b + ')'); };
  const ok   = (c, msg) => { if(!c) fails.push(msg); };

  /* 1. 존 단위 합 */
  near(UNITS.hp.total, 28.456, 1e-9, '존 체력 단위 합');
  near(UNITS.gold.total, 22, 1e-9, '존 발자국 단위 합');

  /* 2. E 상한 */
  let emax = 0;
  for(const T of TIERS) emax = Math.max(emax, worstE(T.t));
  ok(emax <= 2.0, 'E 상한 초과: ' + emax);
  near(emax, 1.7882352941, 1e-6, 'E 최댓값');

  /* 3. 시련 보상 규칙 */
  for(const a of TRIALS){
    if(a.id === 'mist') continue;                       // 명시적 예외(자원 교환)
    near(a.zoneGold, a.tf, 1e-9, a.n + ' 초당 발자국 중립');
    ok(a.zoneSnack >= a.snackFloor - 1e-9, a.n + ' 간식 하한');
  }

  /* 4. T1+ 어떤 조합도 T0보다 나쁘지 않다 */
  for(let t = 1; t < TIERS.length; t++){
    for(const tr of TRIALS) for(const bl of BLESSES){
      const tf = tr.tf * bl.tf;
      const g  = TIERS[t].rg * tr.zoneGold  * bl.zoneGold  / tf;
      const s  = TIERS[t].rn * tr.zoneSnack * bl.zoneSnack / tf;
      ok(g >= 1, 'T' + t + ' ' + tr.n + '+' + bl.n + ' 초당 발자국 < T0');
      ok(s >= 1, 'T' + t + ' ' + tr.n + '+' + bl.n + ' 초당 간식 < T0');
    }
  }

  /* 5. 보스 실패 문턱 DPS 불변 */
  const ref = ratingOf(60, 1e6, {tier:0}).clearDps;
  for(let t = 0; t < TIERS.length; t++)
    for(let s = 1; s <= 6; s++){
      const c = ratingOf(60, 1e6, {tier:t, seed:s}).clearDps;
      near(c / ref, 1, 1e-9, 'T' + t + ' seed' + s + ' 보스 문턱 DPS 불변');
    }

  /* 6. 웨이브 구성 */
  let m = 0, e = 0, b = 0;
  for(let w = 1; w <= 10; w++){ const k = waveKind(7, w); if(k === 'mob') m++; else if(k === 'elite') e++; else b++; }
  ok(m === 7 && e === 2 && b === 1, '웨이브 구성 7/2/1');

  return {ok: fails.length === 0, fails: fails, E_max: emax};
}

/* ─────────────────── 4. 성장 단계 모디파이어 ───────────────────
 * 새끼(0)는 머리 크고 다리 짧고 몸 작고 색이 옅다(유형성숙).
 * 단계가 오를수록 두상이 길어지고 다리가 길어지며 물건이 붙는다.

    st: st, g: g,
    headMul: 1 + 0.26 * (1 - g),

    cape: st >= 4, mane: st >= 4, glow: st >= 4

/* ─────────────────── 5. 조립기 ─────────────────── */
var U100 = 100;                     /* 1.0 로컬 = 100 유저유닛 */

  this.L = { glow: [], back: [], deep: [], body: [], head: [], front: [], acc: [] };
  this.minX = 1e9; this.minY = 1e9; this.maxX = -1e9; this.maxY = -1e9;

  if (!d.length) return;
  var j = d.join(' ');
  if (!noTrack) this.track(j);

};

  if (!d) return; this.track(d);
  this.L[layer].unshift('<path d="' + d + '" ' + (attrs || '') + '/>');

/* 색 클래스 약어 */
var A = {
  coat: 'class="k-c"', far: 'class="k-f"', line: 'class="k-l"',
  bel: 'class="k-b"', acc: 'class="k-a"', dim: 'class="k-d"', bone: 'class="k-n"'

/* ── 5-1 앵커 계산 ── */
function anchors(sp, M) {
  var B = sp.body, L = sp.legs, H = sp.head, NK = sp.neck;
  var bodyLen = B.len * M.lenMul * U100;
  var girth = B.girth * M.girthMul * U100;
  var legLen = (L.n > 0 ? L.len * M.legMul : 0) * U100;
  var hover = sp.hover * U100;
  var rHip = girth * B.prof[1];
  var baseY = -(legLen + rHip * 0.92) - hover;
  var hipX = -bodyLen * 0.5, chestX = bodyLen * 0.5;
  var sag = B.sag * U100, rise = B.rise * U100;

  var na = NK.ang;

  var rp = [];
  for (var i = 0; i < 6; i++) rp.push(girth * B.prof[i] * (i === 4 ? nkr * 1.24 : i === 5 ? nkr * 0.98 : 1));

    [hipX, baseY],

  var c0 = add(neckTop, hd, -hs * 0.38);

  var cm = add(c1, hd, snoutL * 0.55);

  var hp = H.prof, headProf = [hs * hp[0], hs * hp[1], hs * hp[2], hs * hp[3] * H.taper, hs * hp[4] * H.taper];

  var eyeP = add(add(c1, hd, hs * sp.eye.x), up, hs * sp.eye.y);

  return {
    bodyLen: bodyLen, girth: girth, legLen: legLen, baseY: baseY, hipX: hipX, chestX: chestX,
    sag: sag, rise: rise, rp: rp, bodyCps: bodyCps, neckTop: neckTop, na: na,
    headAng: headAng, hd: hd, up: up, hs: hs, snoutL: snoutL, c0: c0, c1: c1, cm: cm, tip: tip,
    headCps: headCps, headProf: headProf, eyeP: eyeP,

/* 몸통 스파인 위 t(0~1) 지점과 반경 */

/* ── 5-2 다리 ── */

function buildLegs(b) {

    var a3 = [K.chestX * 0.30, K.baseY + K.rp[3] * 0.52], s3 = L.spread * U100;

      var sc3 = z === 2 ? 1 : 0.92;

        'class="' + c3[2] + ' wl-leg wl-leg-' + c3[3] + '" style="transform-origin:@@O:' + r2(hp3[0]) + ',' + r2(hp3[1]) + '@@"');
    }

/* ── 5-3 꼬리 ── */

  var d;

    return;

      'class="k-cn wl-tail" ' + org);
    b.p('deep', closedSmooth([add(rt, dirOf(ang - 96), r * 0.9), add(rt, dirOf(ang + 14), len * 0.46),

      var cps = tailChain(base, aa, ln, T.curl, 2);

  else if (T.type === 'spike') prof = [r * 1.05, r * 0.88, r * 0.62, r * 0.34, r * 0.06];

  else if (coil) prof = [r * 1.02, r * 0.94, r * 0.74, r * 0.46, r * 0.04];

/* ── 5-4 귀 ── */

  var tilt = E.tilt + (M.st === 0 ? 8 : 0);

  for (var i = 0; i < 2; i++) {
    var isFar = i === 0;
    var bp = [baseP[0] - (isFar ? w * 0.85 : 0) - (isFar ? 1.5 : -1.0), baseP[1] + (isFar ? w * 0.16 : 0)];
    var aa = aBase + (isFar ? 9 : 0), d;

      var cps = tailChain(bp, aa, h, -10, 3);
      d = ribbon(cps, [w * 0.55, w * 0.92, w * 0.86, w * 0.52], { n: 9, capN: 4 });

      d = ell(c2[0], c2[1], w * 1.05, h * 0.60, 96 - aa);
    } else if (E.type === 'tube') {
      var cps3 = tailChain(bp, aa, h, -16, 2);
      d = ribbon(cps3, [w * 0.9, w * 0.8, w * 0.55], { n: 7, capN: 3 });

      (isFar ? '' : ' stroke="var(--ed)" stroke-width="0.6"') +
      (M.torn && !isFar ? ' fill-rule="evenodd"' : '') +
      ' style="transform-origin:@@O:' + r2(bp[0]) + ',' + r2(bp[1]) + '@@"');
    /* 귀 안쪽 */

      var ic = add(bp, dirOf(aa), h * icf);

/* ── 5-5 눈 · 입 ── */

/* ── 5-6b 신규 12종이 가져온 파츠 ────────────────────────────────────────
 * 규칙은 위와 같다: ribbon / ell / spike 세 프리미티브만 쓰고, 자기 레이어에만
 * 밀어넣는다. 새 종을 위해 별도 렌더 경로를 만들지 않는다.
 * -------------------------------------------------------------------- */

/* 긴 턱선 — 악어·보아·고래·파라케라테리움.
   fang(송곳니 2~5개)과 다르다: 이건 주둥이를 끝까지 가르는 '잇줄 전체' 다.
   teeth:false 면 선만 남아 고래의 다문 입선이 된다. */
EX.lips = function (b, e) {
  var K = b.K, M = b.M, n = e.n || 0, i;

};

/* 목도리 — 콘도르. 목 밑동을 한 바퀴 감는 흰 러프(등줄기 갈기가 아니다) */
EX.ruffcheek = function (b, e) {
  var K = b.K, M = b.M, o = onBody(K, e.at == null ? 0.82 : e.at);

/* 고래 미익 — 수평 지느러미. 상어의 수직 미저(caudal)와 정반대인 게 정체성이다.

/* 사각 두상 — 향유고래의 정면 '벽'. 파라케라테리움에선 s 를 줄여 콧등 패드로 쓴다 */

/* 아가리 — 메갈로돈. 벌어진 구강 + 아래턱 + 삼각니 2줄.

/* 비늘 띠 — 티타노보아의 배비늘. 몸통을 가로지르는 호가 무족 실루엣을 읽히게 한다 */

/* 굽 — 기린·파라케라테리움. 작지만 이게 없으면 발이 뭉툭한 덩어리로 끝난다 */

/* 혓불 — 삼족오·기린. 등줄기에서 피어오른다. 색은 눈과 같은 accent 를 쓴다:

    /* 혓불 = 밑동이 굵고 끝이 바늘, 그리고 반드시 한 번 꺾인다. 안 꺾으면 가시로 읽힌다 */

      'class="k-fm wl-flame" opacity="' + (e.o == null ? 0.55 : e.o) + '" style="transform-origin:@@O:' + r2(base[0]) + ',' + r2(base[1]) + '@@;--fp:' + r2(f * 0.9) + 's"');
  }

/* 후광 — 붕(鵬). 최종 동료이므로 발광 링 하나로 끝낸다.

  var K = b.K, M = b.M;

function injectStyle() {
  if (injected || typeof document === 'undefined') return;
  injected = true;
  if (!document.getElementById(STYLE_ID)) {
    var st = document.createElement('style');
    st.id = STYLE_ID; st.textContent = CSS;
    document.head.appendChild(st);
  }
  if (!document.getElementById(DEFS_ID)) {
    var w = document.createElement('div');
    w.setAttribute('aria-hidden', 'true');
    w.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
    w.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" id="' + DEFS_ID + '" width="0" height="0"><defs>' +
      twoSide('wlcr-rim', false, true) + twoSide('wlcr-rimf', true, true) +
      twoSide('wlcr-rimk', false, false) + twoSide('wlcr-rimkf', true, false) +
      rimGrad('wlcr-rw', 0, 1, 1, 0.05, PAL.ember, 1, 0.5) +
      rimGrad('wlcr-rwf', 1, 1, 0, 0.05, PAL.ember, 1, 0.5) +
      rimGrad('wlcr-rc', 1, 0, 0.1, 0.95, PAL.moon, 0.95, 0.34) +
      rimGrad('wlcr-rcf', 0, 0, 0.9, 0.95, PAL.moon, 0.95, 0.34) +

      '<stop offset=".55" stop-color="' + PAL.ember + '" stop-opacity=".07"/>' +
      '<stop offset="1" stop-color="' + PAL.ember + '" stop-opacity="0"/></radialGradient>' +
      '</defs></svg>';

/* ─────────────────── 7. 색 계산 ─────────────────── */
function colorsFor(sp, M, pal) {
  pal = pal || {};
  var base = pal.base || PAL.soot;
  var tint = pal.tint || sp.tint;
  var amt = (pal.amt == null ? M.coat : pal.amt);
  var co = mix(base, tint, amt);
  var cold = pal.rim === 'cold';
  return {
    '--co': co,
    '--co2': shade(co, 0.32),
    '--con': shade(co, 0.155),
    '--co3': shade(co, 0.55),
    '--ed': shade(co, 0.48),
    '--bel': mix(co, PAL.emberCore, 0.17),
    '--eye': pal.accent || (cold ? PAL.emberDeep : PAL.emberCore),
    '--inner': mix(shade(co, 0.25), PAL.emberDeep, 0.20),
    '--bone': mix(PAL.emberCore, co, 0.20),
    '--mark': shade(co, 0.62),
    '--scar': mix(co, PAL.emberCore, 0.55),
    '--wire': mix(co, PAL.moon, 0.35),
    '--lt': mix(co, '#8B5A2B', 0.55),
    '--cape': shade(mix(co, PAL.emberDeep, 0.20), 0.40),
    /* 불꽃은 accent 가 아니라 불 그 자체의 색이다 — 뼈·눈과 같은 색이면 가시로 읽힌다 */
    '--flm': mix(PAL.ember, pal.accent || (cold ? PAL.emberDeep : PAL.emberCore), 0.28),
    '--shadow': PAL.night,
    '--rwO': cold ? 0.30 : 0.92,
    '--rcO': cold ? 0.92 : 0.46

}

/* ─────────────────── 8. 공유 rAF 티커 ─────────────────── */
var jobs = [], raf = 0, driveFn = null, t0 = 0;
function loop(now) {
  raf = 0;

  var t = (now - t0) / 1000, i;
  for (i = jobs.length - 1; i >= 0; i--) {
    var j = jobs[i];
    if (now >= j.at) { jobs.splice(i, 1); try { j.fn(); } catch (e) { } }
  }
  if (driveFn) {
    var v = driveFn(t);
    if (typeof v === 'number' && document.documentElement) document.documentElement.style.setProperty('--wl-fire', r2(v));
  }
  if (jobs.length || driveFn) raf = requestAnimationFrame(loop);
}
function kick() { if (!raf && typeof requestAnimationFrame === 'function') raf = requestAnimationFrame(loop); }

/* ─── 품질 티어 · 적응형 폴백 ───────────────────────────────────────────
 * 고정 상한만 두고 런타임 감지가 없으면 느린 기기에서 그냥 무너진다.
 * 연속으로 예산(18ms)을 넘기면 한 단계씩 내리고, 여유가 지속되면 되올린다. */

function applyTier() {

  d.classList.toggle('wlq1', qTier === 1);
  d.classList.toggle('wlq0', qTier === 0);
}
function setTier(n) { qTier = clamp(n | 0, 0, 2); applyTier(); return qTier; }
function qLoop(now) {
  qWatch = 0;
  if (!qAuto) return;
  if (qLast) {
    var dt = now - qLast;
    if (dt > 18) { qBad++; qGood = 0; } else if (dt < 13) { qGood++; qBad = 0; }
    if (qBad > 24 && qTier > 0) { setTier(qTier - 1); qBad = 0; }
    else if (qGood > 360 && qTier < 2) { setTier(qTier + 1); qGood = 0; }
  }

  qWatch = requestAnimationFrame(qLoop);
}
function setAuto(on) {

/* ─────────────────── 9. make() ─────────────────── */
var SVGNS = 'http://www.w3.org/2000/svg';
var uidSeq = 0;
var ONESHOT = { attack: 520, hurt: 300, cheer: 920, eat: 1400, die: 720 };
var ALLSTATE = ['idle', 'attack', 'hurt', 'cheer', 'sleep', 'die', 'eat', 'pet'];

var autoInit = false;
function make(opts) {
  opts = opts || {};
  injectStyle();
  /* 적응형 폴백은 기본 ON. 끄려면 WL.Creatures.autoQuality(false). */
  if (!autoInit) { autoInit = true; setAuto(true); }
  var id = opts.species;
  if (!SPECIES[id]) throw new Error('WL.Creatures: 알 수 없는 종 "' + id + '"');
  var uid = ++uidSeq;
  var svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'wl-cr');
  svg.setAttribute('role', 'img');
  svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');

  var H = {
    el: svg, id: id, uid: uid,
    stage: clamp(opts.stage == null ? 2 : opts.stage | 0, 0, 4),
    size: opts.size || 96,
    flip: !!opts.flip,
    relative: opts.relative !== false,
    pal: opts.palette || null,
    mood: opts.mood || 'calm',
    seed: opts.seed == null ? (1 + ((Math.random() * 99991) | 0)) : opts.seed,
    label: opts.label || SPECIES[id].name,
    state: 'idle',
    spec: null
  };
  var rr = rng(H.seed);
  H._ph = [ -(rr() * 4).toFixed(2), -(rr() * 4).toFixed(2), -(rr() * 5).toFixed(2), -(rr() * 4).toFixed(2) ];
  H._br = (2.9 + rr() * 1.5).toFixed(2);
  H._tw = (2.1 + rr() * 1.6).toFixed(2);
  H._ef = (3.6 + rr() * 2.2).toFixed(2);
  H._bl = (3.0 + rr() * 1.8).toFixed(2);

  function paint() {
    var sp = SPECIES[H.id], M = stageMods(H.stage);
    H.spec = sp;
    var built = buildAll(sp, M, H.seed, uid);
    var b = built.b, K = b.K;
    var pad = Math.max(3, (b.maxX - b.minX) * 0.035);
    var x0 = b.minX - pad, y0 = b.minY - pad;
    var w = (b.maxX - b.minX) + pad * 2, h = (b.maxY - b.minY) + pad * 2 + 1.5;

    /* transform-box:view-box 에서 transform-origin 의 길이값은 (실측) 뷰박스 좌상단이 아니라
       사용자 좌표계 원점 기준으로 해석된다. x0/y0 를 빼면 파트마다 회전축이
       (x0,y0) 만큼 어긋나 귀·꼬리가 몸에서 떨어져 날아간다. 원좌표를 그대로 쓴다. */
    function sub(s) {
      return s.replace(/@@O:(-?[\d.]+),(-?[\d.]+)@@/g, function (_, a, c) {
        return r2(+a) + 'px ' + r2(+c) + 'px';
      });
    }
    var bodyCenter = crPt(K.bodyCps, 0.45);
    var torsoOrg = r2(bodyCenter[0]) + 'px ' + r2(bodyCenter[1]) + 'px';
    var headOrg = r2(K.neckTop[0]) + 'px ' + r2(K.neckTop[1]) + 'px';

    var inner =
      '<defs><clipPath id="' + built.clipId + '"><path d="' + b.bodyD + '"/></clipPath></defs>' +
      '<g class="wl-sil" aria-hidden="true"><use href="#wlr-' + uid + '" xlink:href="#wlr-' + uid + '"/></g>' +
      '<g class="wl-root" id="wlr-' + uid + '" style="transform-origin:0px ' + r2(K.baseY) + 'px">' +
        '<g class="wl-glow">' + b.L.glow.join('') + '</g>' +
        '<g class="wl-back">' + b.L.back.join('') + '</g>' +
        '<g class="wl-deep">' + b.L.deep.join('') + '</g>' +
        '<g class="wl-torso" style="transform-origin:' + torsoOrg + '">' +
          '<g class="wl-bodyg">' + b.L.body.join('') + '</g>' +
          '<g class="wl-headg" style="transform-origin:' + headOrg + '">' + b.L.head.join('') + '</g>' +
        '</g>' +
        '<g class="wl-frontg">' + b.L.front.join('') + '</g>' +
        '<g class="wl-accg">' + b.L.acc.join('') + '</g>' +
      '</g>' +
      '<g class="wl-flash" aria-hidden="true"><use href="#wlr-' + uid + '" xlink:href="#wlr-' + uid + '"/></g>';

    svg.setAttribute('viewBox', r2(x0) + ' ' + r2(y0) + ' ' + r2(w) + ' ' + r2(h));

    var pxW = pxH * (H._w / H._h);
    svg.style.height = r2(pxH) + 'px';
    svg.style.width = r2(pxW) + 'px';
    /* non-scaling-stroke 는 스크린 px 고정이다. 48px 초상과 200px 전장이 같은 굵기면
       작은 쪽이 실루엣 외곽선에 잡아먹힌다 → 렌더 크기에 비례시킨다. */
    /* 스트로크는 사용자 단위다(non-scaling-stroke 를 쓰지 않는다 — 매 프레임
       스트로크를 다시 재는 비용이 60fps 예산에서 실제로 잡힌다).
       화면에서 원하는 굵기를 뷰박스 배율로 나눠 사용자 단위로 환산한다. */
    var uscale = pxH / (H._h || 1);

    for (k in c) svg.style.setProperty(k, c[k]);
    var cold = !!(H.pal && H.pal.rim === 'cold');
    svg.style.setProperty('--rimG', 'url(#wlcr-rim' + (cold ? 'k' : '') + (H.flip ? 'f' : '') + ')');
    /* 활공조는 날갯짓 주기를 종이 직접 정한다. flap:0(기본) 이면 제거 → 기존 동작 그대로 */
    svg.style.setProperty('--flap', sp.flap ? sp.flap + 's' : '');
    svg.style.setProperty('--br', H._br + 's');
    svg.style.setProperty('--tw', H._tw + 's');
    svg.style.setProperty('--ef', H._ef + 's');
    svg.style.setProperty('--bl', H._bl + 's');
    svg.style.setProperty('--ph', H._ph[0] + 's');
    svg.style.setProperty('--ph2', H._ph[1] + 's');
    svg.style.setProperty('--ph3', H._ph[2] + 's');
    svg.style.setProperty('--ph4', H._ph[3] + 's');
  }
  function applyFlags(sp, M) {
    var cl = ['wl-cr'];
    if (H.flip) cl.push('flip');
    if (sp.gait === 'hover' || sp.gait === 'drift' || sp.gait === 'glide') cl.push('hover');
    if (sp.arch === 'bird') cl.push('fly');
    if (M.veteran) cl.push('vet');
    if (H.mood && H.mood !== 'calm') cl.push('mood-' + H.mood);
    if (H.state !== 'idle') cl.push('is-' + H.state);
    svg.setAttribute('class', cl.join(' '));
    svg.setAttribute('aria-label', H.label + (M.st >= 3 ? ' (성체)' : M.st === 0 ? ' (새끼)' : ''));
  }

  paint();

  H.play = function (state, o) {
    o = o || {};

    void svg.getBoundingClientRect().width;
    H.state = state;
    if (state !== 'idle') svg.classList.add('is-' + state);
    if (ONESHOT[state] && !o.hold && state !== 'die') {
      later(ONESHOT[state] + 20, function () {
        if (H.state === state) { svg.classList.remove('is-' + state); H.state = 'idle'; }

    return H;
  };
  H.setMood = function (m) {
    svg.classList.remove('mood-happy', 'mood-fierce', 'mood-tired');
    H.mood = m || 'calm';

}
