<style>

:root{
  --bg:#07090d;--panel:#11161f;--panel2:#18202b;--line:#283142;--fg:#f2f5f9;--muted:#b0b9c9;
  --up:#16c784;--down:#f2313f;--gold:#ffc63a;--rumor:#b58cff;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:6px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:420px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}.gd{color:var(--gold)}.mu{color:var(--muted)}

/* ticker tape */
.tape{overflow:hidden;border-block:1px solid var(--line);height:22px;flex:none;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape div{display:inline-flex;gap:22px;white-space:nowrap;line-height:22px;font-size:11px;animation:tape 38s linear infinite;padding-right:22px}
.tape span{color:var(--muted)}.tape b{font-family:var(--mono);font-weight:700;margin-left:4px}
@keyframes tape{to{transform:translateX(-50%)}}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.3px;white-space:nowrap}
h1 b{color:var(--up);font-weight:400}
.hb{display:flex;gap:5px;align-items:center}
.ib{font:700 12px var(--mono);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;height:28px;padding:0 8px;cursor:pointer;white-space:nowrap}
.ib.gd{color:var(--gold)}
.rank{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;max-width:150px}
.rank span{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank i{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rank i b{display:block;height:100%;background:var(--gold);transition:width .4s}

/* account */
.acct{display:grid;grid-template-columns:1.5fr 1fr 1fr;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.acct div{padding:5px 10px;min-width:0}
.acct div+div{border-left:1px solid var(--line)}
.acct small{display:block;font-size:11px;color:var(--muted)}
.acct span{display:block;font-family:var(--mono);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* quote */
.quote{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex:none;padding:2px 2px 0}
.qn{min-width:0}
.qn b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.qn .tier{display:inline-block;font-family:var(--body);font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--fg)}
.qp{text-align:right}
#qPrice{font-family:var(--mono);font-weight:800;font-size:clamp(24px,7.5vw,34px);line-height:1;font-variant-numeric:tabular-nums}
#qChg{font-family:var(--mono);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}

/* main: chart + book */
.main{position:relative;flex:1;min-height:150px;display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px}
.chart{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app.fever .chart{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px color-mix(in srgb,var(--gold) 35%,transparent)}
.chart.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
canvas{position:absolute;inset:0;width:100%;height:100%}
#pnl{position:absolute;left:8px;top:6px;font-family:var(--mono);font-size:12px;font-weight:700;pointer-events:none;background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
#fever{position:absolute;right:62px;top:6px;font:900 12px var(--body);color:#1a1200;background:var(--gold);padding:2px 8px;border-radius:999px;pointer-events:none;animation:pulse .5s infinite alternate}
.book{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.book .hd{font-family:var(--body);font-size:11px;color:var(--muted);text-align:center;padding:3px 0;border-bottom:1px solid var(--line)}
.ob{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 5px;min-height:0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.ob.ask{background:color-mix(in srgb,var(--down) 7%,transparent)}
.ob.bid{background:color-mix(in srgb,var(--up) 7%,transparent)}
.ob i{position:absolute;top:2px;bottom:2px;right:0;opacity:.22}
.ob.ask i{background:var(--down)}.ob.bid i{background:var(--up)}
.ob .p{position:relative;font-weight:800;font-size:13.5px;line-height:1.15}
.ob .q{position:relative;color:var(--fg);opacity:.75;font-size:11px;line-height:1.15}
.ob.now{outline:2px solid var(--gold);outline-offset:-2px;background:color-mix(in srgb,var(--gold) 14%,transparent)}
.book .ft{font-size:11px;text-align:center;padding:3px 0;color:var(--muted);font-family:var(--body)}
.book .ft b{font-family:var(--mono)}

#news{flex:none;height:26px;line-height:24px;box-sizing:border-box;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:slide .25s ease-out}
#news[hidden]{display:block;opacity:.45;animation:none}
#news.idle{color:var(--muted);font-weight:500}
#news.bear{background:color-mix(in srgb,var(--down) 32%,var(--bg));border:1px solid var(--down)}
#news.bull{background:color-mix(in srgb,var(--up) 30%,var(--bg));border:1px solid var(--up)}
#news.rumor{background:color-mix(in srgb,var(--rumor) 30%,var(--bg));border:1px solid var(--rumor)}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 34px);transform:translateX(-50%);background:var(--gold);color:#1a1300;font-weight:900;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:slide .3s ease-out;z-index:30;box-shadow:0 6px 20px #0008}

.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,92%);max-height:96%;overflow:auto;box-sizing:border-box;background:color-mix(in srgb,var(--bg) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center;backdrop-filter:blur(8px);animation:pop .22s ease-out;z-index:3}
@keyframes pop{from{transform:translate(-50%,-44%);opacity:.3}}
.card .grade{font-family:var(--display);font-size:30px;line-height:1.1}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.card .big{font-family:var(--mono);font-weight:800;font-size:20px;margin-top:6px;font-variant-numeric:tabular-nums}
.card .bar{height:7px;border-radius:4px;background:var(--line);margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--gold)}
.card .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px}
.card .btns{display:flex;gap:6px;justify-content:center;margin-top:10px}
.card button{font:inherit;font-size:13px;font-weight:700;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
.card button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card ul{text-align:left;font-size:12.5px;line-height:1.6;padding-left:18px;margin:8px 0 0;color:var(--fg)}


.talk{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;height:42px;box-sizing:border-box;overflow:hidden;font-size:12.5px;display:flex;flex-direction:column;justify-content:flex-end}
.talk p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:16px;animation:slide .2s ease-out}
.talk p b{color:var(--muted);font-weight:500;margin-right:6px}
.talk p:first-child{opacity:.55}

/* pickers */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;flex:none}
.chip{font:inherit;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:5px 7px;cursor:pointer;min-width:0;line-height:1.25}
.chip b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.chip:disabled{opacity:.4;cursor:default}
.items{display:flex;gap:5px;overflow-x:auto;flex:none;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.items .chip{flex:0 0 auto;min-width:100px}
.chip:focus-visible,.ib:focus-visible,.card button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hold{height:68px;flex:none;border:0;border-radius:16px;background:var(--up);color:#fff;font-family:var(--display);font-size:24px;letter-spacing:1px;cursor:pointer;touch-action:none;box-shadow:0 5px 0 color-mix(in srgb,var(--up) 50%,#000);transition:transform .06s,box-shadow .06s}
.app.fever #hold{background:linear-gradient(90deg,var(--up),#ff7a1a,var(--up));background-size:200% 100%;animation:flow 1.2s linear infinite}
.app.fever #hold.on{background:linear-gradient(90deg,var(--down),#7a5cff,var(--down));background-size:200% 100%}
@keyframes flow{to{background-position:200% 0}}
#hold:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#hold.on{background:var(--down);transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--down) 50%,#000),0 0 calc(var(--heat,0) * 46px) color-mix(in srgb,var(--down) 80%,transparent);animation:pulse .45s infinite alternate}
#hold.wait{background:var(--panel2);color:var(--muted);box-shadow:0 5px 0 #040508;animation:none}
@keyframes pulse{to{filter:brightness(1.25)}}

.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{width:min(380px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-sizing:border-box}
.modal h2{font-family:var(--display);font-weight:400;margin:0 0 4px;font-size:22px}
.modal .note{font-size:12px;color:var(--muted);margin:0 0 8px}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.li>i{font-style:normal;font-size:20px;width:26px;text-align:center;flex:none}
.li div{flex:1;min-width:0}
.li b{display:block;font-size:13.5px}.li small{color:var(--muted);font-size:11.5px}
.li .pb{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.li .pb u{display:block;height:100%;background:var(--gold)}
.li.lock{opacity:.35}.li.lock>i{filter:grayscale(1)}
.li.done b{color:var(--gold)}
.modal button{margin-top:12px;width:100%;font:inherit;font-weight:700;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:10px;cursor:pointer}

#bossbar{position:absolute;left:8px;right:8px;top:34px;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:color-mix(in srgb,#7a1020 55%,var(--bg));border:1px solid #ff4d6d;border-radius:10px;padding:6px 10px;pointer-events:none}
#bossbar b{font-size:13px;white-space:nowrap}
#bossbar i{height:10px;background:#2a0a10;border-radius:5px;overflow:hidden;border:1px solid #ff4d6d}
#bossbar u{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff8a00);transition:width .15s}
#bossbar small{font-family:var(--mono);font-size:11.5px;color:var(--gold);white-space:nowrap}
.bosschip{grid-column:1/-1;background:linear-gradient(90deg,color-mix(in srgb,#ff2d55 25%,var(--panel)),var(--panel))!important;border-color:#ff4d6d!important}
.sk .t .lv{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sk.lockd{opacity:.55}
.xpb{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.xpb u{display:block;height:100%;background:var(--gold)}
.offers{display:block}
.pick1{width:100%;display:flex;align-items:center;gap:10px;font:inherit;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--gold);border-radius:12px;padding:8px 12px;cursor:pointer}
.pick1:disabled{opacity:.45}
.pick1 .pe,.srow .pe{font-size:22px;flex:none}
.pick1 .pt,.srow .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.pick1 b,.srow b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick1 small,.srow small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick1 .pc{flex:none;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.pick1 svg,.srow svg{flex:none}
.items{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;overflow:visible}
.items .chip.ic{min-width:0!important;text-align:center;padding:6px 4px}
.items .chip.ic b{font-size:13px}
.items .chip.ic small{font-size:11px}
#sheet{position:fixed;inset:0;z-index:22;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{width:min(560px,100%);max-height:78vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:12px max(14px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:slide .2s ease-out}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh-h b{display:block;font-family:var(--display);font-weight:400;font-size:21px}
.sh-h small{color:var(--muted);font-size:12px}
.sh-h button{font:inherit;font-weight:700;font-size:13px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
.srow{width:100%;display:flex;align-items:center;gap:10px;font:inherit;text-align:left;background:none;color:var(--fg);border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer}
.srow.on{background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:10px}
.srow .pr{flex:none;width:58px;text-align:right;font-family:var(--mono);font-weight:800;font-size:13px}
.items{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.items .chip.ic.hot{border-color:#ff4d6d;background:color-mix(in srgb,#ff2d55 22%,var(--panel))}
.shopb{display:flex;flex-direction:column;gap:4px;flex:none}
.shopb .setbtn{padding:6px 10px;font-size:12px;white-space:nowrap}
.shopb .setbtn:disabled{opacity:.4}
.tabs button{font-size:11px}
.card .cx{position:absolute;top:8px;right:8px;width:34px;height:34px;margin:0!important;padding:0!important;border-radius:50%!important;font-size:16px!important;line-height:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);cursor:pointer;z-index:1}
.betrow{flex:none;display:flex;align-items:center;gap:5px}
.betrow span{font-size:12px;color:var(--muted);white-space:nowrap}
.betrow button{font:inherit;font-size:13px;font-weight:800;flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:6px 0;cursor:pointer}
.betrow button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--panel))}
.betrow button:disabled{opacity:.4}
.betrow b{font-family:var(--mono);font-size:13px;min-width:74px;text-align:right;white-space:nowrap}
#regime{position:absolute;right:62px;top:6px;font:800 11.5px var(--body);color:var(--fg);background:color-mix(in srgb,var(--panel2) 85%,transparent);border:1px solid var(--line);padding:2px 8px;border-radius:999px;pointer-events:none;z-index:2}
#fever{top:30px!important}
#giftBtn.ready{animation:pulse .6s infinite alternate;border-color:var(--gold)}
.wheel{font-size:72px;text-align:center;margin:10px 0}
.achgrid div{display:flex;flex-direction:column;align-items:center;gap:1px}
.achgrid .stars{font-style:normal;font-size:11px;letter-spacing:-1px;white-space:nowrap}
.achgrid .stars span{opacity:.3}
.achgrid small{font-size:9.5px;color:var(--muted);line-height:1.2}
.achgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
#debtTag{display:block;font-style:normal;font-size:11px;color:#ff6b7a;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* readability pass */
body{font-size:14px;line-height:1.4}
.app{gap:8px}
.acct small,.tile small{font-size:12px}
.acct span{font-size:17px}
.qn b{font-size:17px}
.qn small{font-size:12.5px}
#qChg{font-size:13.5px;font-weight:700}
.main{grid-template-columns:minmax(0,1fr) 106px}
.book .hd{font-size:10.5px;padding:3px 0}
.ob{padding:0 5px}
.ob .p{font-size:12.5px}
.ob .q{font-size:10px}
.trs{font-size:10.5px;padding:2px 5px}
.trs .th{font-size:9.5px}
.trs .th,.tr{line-height:13px}
.book .ft{font-size:10.5px;line-height:1.3}
#pnl{font-size:12.5px;padding:2px 7px}
.talk{font-size:12.5px;height:40px;padding:3px 10px}
.talk p{line-height:16px}
.chip{padding:7px 9px}
.chip b{font-size:13px}
.chip small{font-size:10.5px;margin-top:1px}
.items .chip{min-width:132px}
.tabs button{font-size:12px}
.tabs button i{font-size:19px}
.rank span{font-size:12.5px}
.ib{font-size:13px;height:30px}
.card .sub{font-size:14px}
.card .row{font-size:12.5px}
.card ul{font-size:14px}
.card button{font-size:14px;padding:10px 16px}
#coach{font-size:15px}
.page .lead{font-size:14px}
.sk p{font-size:12.5px}
.setrow small,.li small{font-size:12.5px}
.li b{font-size:15px}
.hist{font-size:13.5px}
.achgrid div{font-size:11.5px}
.talk p{animation:none}.talk p:last-child{animation:slide .2s ease-out}
.ob{flex-direction:row;align-items:center;justify-content:space-between;gap:4px}

function draw(){

  if(run&&run.hint&&state!=='ready')hi=Math.max(hi,Math.min(run.hint.v*1.05,hi*1.6));

  const X=i=>plotL+i*cw+cw/2;
  ctx.font='600 10.5px "JetBrains Mono",monospace';ctx.textBaseline='middle';ctx.textAlign='left';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const m=Math.exp(L0+(L1-L0)*(i+.5)/5),y=Y(m);
    ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(plotL,y);ctx.lineTo(plotR,y);ctx.stroke();
    {const lc=candles[candles.length-1];const ty=lc?Y(Math.max(lc.c,Math.exp(L0))):-99;if(Math.abs(y-ty)>14){ctx.fillStyle=C.muted;ctx.fillText(fmtP(priceOf(m)),plotR+4,y);}}}
  const T=TIERS[offer().k];
  const hl=(m,col,label,dash)=>{if(m<Math.exp(L0)||m>Math.exp(L1))return;const y=Y(m);ctx.strokeStyle=col;ctx.setLineDash(dash);ctx.globalAlpha=.75;

    ctx.fillStyle=col;ctx.font='700 10px "Noto Sans KR",sans-serif';ctx.fillText(label,plotL+4,y-7);ctx.font='500 10px "JetBrains Mono",monospace';};
  hl(1/eM,C.muted,'Base price',[2,3]);

  // volume
  const vmax=Math.max(1,...vis.map(c=>c.v));
  vis.forEach((c,i)=>{const h=c.v/vmax*volH;ctx.fillStyle=c.c>=c.o?C.up:C.down;ctx.globalAlpha=c.ghost?.25:.55;ctx.fillRect(X(i)-(cw-2)/2,H-6-h,cw-2,h);});
  ctx.globalAlpha=1;
  // MA5
  const off=all.length-vis.length;
  ctx.strokeStyle=C.gold;ctx.lineWidth=1.2;ctx.globalAlpha=.7;ctx.beginPath();let st=false;
  vis.forEach((c,i)=>{const j=off+i;if(j<4)return;let s=0;for(let k=j-4;k<=j;k++)s+=all[k].c;const y=Y(s/5);st?ctx.lineTo(X(i),y):(ctx.moveTo(X(i),y),st=true);});
  ctx.stroke();ctx.globalAlpha=1;ctx.lineWidth=1;
  // candles
  vis.forEach((c,i)=>{
    const up=c.c>=c.o&&!c.crash,col=up?C.up:C.down,x=X(i);
    ctx.globalAlpha=c.ghost&&!c.crash?(state==='ready'?.45:.32):1;
    ctx.strokeStyle=col;ctx.fillStyle=col;
    ctx.beginPath();ctx.moveTo(x+.5,Y(c.h));ctx.lineTo(x+.5,Y(Math.max(c.l,Math.exp(L0))));ctx.stroke();
    const yo=Y(c.o),yc=Y(Math.max(c.c,Math.exp(L0)));ctx.fillRect(x-(cw-2)/2,Math.min(yo,yc),cw-2,Math.max(1,Math.abs(yc-yo)));
  });
  ctx.globalAlpha=1;
  if(!vis.length)return;
  // sell marker
  if(sell){const i=sell.idx-off;if(i>=0&&i<vis.length){const x=X(i),y=Y(vis[i].h)-8;
    ctx.fillStyle=C.down;ctx.beginPath();ctx.moveTo(x-5,y-8);ctx.lineTo(x+5,y-8);ctx.lineTo(x,y);ctx.closePath();ctx.fill();
    ctx.font='700 11px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.fillText('SELL',Math.max(16,x),y-16);ctx.textAlign='left';}}
  // peak marker after crash
  if(crashed){let pi=-1,pm=0;vis.forEach((c,i)=>{if(c.h>pm&&!c.crash&&c.r){pm=c.h;pi=i}});
    if(pi>=0){ctx.fillStyle=C.gold;ctx.font='700 10px "Noto Sans KR",sans-serif';ctx.textAlign='center';
      ctx.fillText('Peak '+fmtP(priceOf(pm)),Math.min(plotR-34,Math.max(34,X(pi))),Y(pm)-10);ctx.textAlign='left';}}
  // current price tag
  const last=vis[vis.length-1],ly=Y(Math.max(last.c,Math.exp(L0)));
  const tagCol=last.crash||last.c<1?C.down:C.up;
  ctx.strokeStyle=tagCol;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(plotL,ly);ctx.lineTo(plotR,ly);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=tagCol;ctx.fillRect(plotR,ly-8,padR,16);
  ctx.fillStyle='#fff';ctx.font='700 10px "JetBrains Mono",monospace';ctx.fillText(fmtP(priceOf(last.c)),plotR+3,ly);
  if(state==='holding'){ctx.fillStyle=C.up;ctx.shadowColor=C.up;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(X(vis.length-1)+.5,ly,3,0,7);ctx.fill();ctx.shadowBlur=0;}
}

  const bo=$('bkOut');if(bo)bo.onclick=()=>{const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('shg_'))d[k]=localStorage.getItem(k);}
    const code='SHG1:'+btoa(unescape(encodeURIComponent(JSON.stringify(d))));(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('💾 Backup code copied. Paste it in Notes to keep it safe'),()=>prompt('Long-press the code below to copy',code));};
  const bi=$('bkIn');if(bi)bi.onclick=()=>{const code=(prompt('Paste your backup code (current progress will be overwritten)')||'').trim();if(!code)return;
    try{if(!code.startsWith('SHG1:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(code.slice(5)))));if(!d.shg_bal)throw 0;
      Object.keys(localStorage).filter(k=>k.startsWith('shg_')).forEach(k=>localStorage.removeItem(k));for(const k in d)if(k.startsWith('shg_'))localStorage.setItem(k,d[k]);toast('📥 Loading…');setTimeout(()=>location.reload(),500);}
    catch(e){toast('Invalid backup code');}};
  const w=$('wipe');if(w)w.onclick=()=>{if(Date.now()-resetArm>3000){resetArm=Date.now();w.textContent='Really reset? Tap again within 3 sec';return;}
    try{Object.keys(localStorage).filter(k=>k.startsWith('shg_')).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};
}
/* ---------- loop ---------- */
function frame(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  stepFx(dt);
  if(freezeT>0){freezeT-=dt;draw();requestAnimationFrame(frame);return;}
  if(state==='holding'||state==='ghost'){
    const prev=cur;
    t+=dt*(state==='ghost'?3:.6*(run.it.slow?.6:1)*(SET.slow?.8:1)*(1-.02*skl('mind'))*(gear.chair?.97:1));
    const b=base(t);
    if(state==='holding'){
      if(!run.tut&&!warned&&base(t+1)>=run.crashAt){warned=true;if(Math.random()<(profile==='fox'?.65:.4)+.04*skl('intel')+(run.T.warn||0))news('⚠ '+newsPick(0),'bear');}
      else if(!run.tut&&t>.8&&!events.some(e=>t<e.t0+1.6)&&Math.random()<dt*.18*(run.T.news||1)*(run.rg.news||1)){
        const bull=Math.random()<.45;events.push({t0:t,amp:(bull?.12:-.14)*(run.T.amp||1)});if(!bull)run.sawDip=true;
        news(bull?'📈 '+newsPick(1):'⚠ '+newsPick(0),bull?'bull':'bear');talk(bull?'hype':'fear');
      }
      talkT+=dt;if(talkT>.4+Math.random()*.5){talkT=0;talk(inDip(t)?'fear':cur>1.15?'hype':pick(['hype','idle']));}
    }
    if(b>=run.crashAt){cur=run.crashAt;peak=Math.max(peak,cur);crash();}
    else{
      cur=Math.max(run.liqLine?.3:.85,b*(1+(wig(t)-1)*(run.T.wig||1)*(run.rg.wig||1))*newsF(t));peak=Math.max(peak,cur);
      if(state==='holding'&&run.liqLine&&cur<=run.liqLine){if(inv.noliq>0){inv.noliq--;store.set('shg_inv',inv);stats.c.items++;run.liqLine=0;toast('🧯 Liquidation Shield used! Saved!');}else{run.liq=1;stamp('💀 Liquidated','dn');crash();draw();requestAnimationFrame(frame);return;}}
      const idx=runBase+Math.floor(t/CD);
      while(candles.length<=idx){const pc=candles.length?candles[candles.length-1].c:1;candles.push({o:pc,h:pc,l:pc,c:pc,v:0,ghost:state==='ghost',r:1});if(state==='holding')sfx.tick(cur);}
      const c=candles[candles.length-1];c.h=Math.max(c.h,cur);c.l=Math.min(c.l,cur);c.c=cur;
      const dv=dt*(1+Math.abs(cur-prev)/prev*300+(events.some(e=>t>=e.t0&&t<=e.t0+1.4)?3:0))*rnd(.6,1.4);c.v+=dv;volTotal+=dv*(1+cur);
      if(state==='holding'&&run.boss){const hp=Math.max(0,1-(cur-1)/(run.boss.target-1));$('bossHp').style.width=(hp*100).toFixed(1)+'%';if(hp<=0&&!run.boss.down){run.boss.down=1;stamp('💥 HP 0! Sell now to win');}}
      if(state==='holding'){events.forEach(e=>{if(e.shake&&!e.shown&&t>=e.t0){e.shown=1;run.sawDip=true;news('⚠ Whales dumping to shake out retail ants','bear');talk('fear');}});tension(dt);if(run.tut)tutTick();while(run.mi<MS.length&&cur>=MS[run.mi][0]){if(!(MS[run.mi][0]===1.3&&!run.T.limit))stamp(MS[run.mi][1]);run.mi++;}}
      if(state==='holding'){const lev=run.lev,g=run.re?run.re.bet*(cur/run.re.entry-1)*lev:run.bet*(cur-1)*lev;
        $('pnl').innerHTML='Unrealized P/L <span class="'+(g>=0?'up':'dn')+'">'+sw(g)+'</span>'+(lev>1?' <span class="gd">x'+lev+'</span>':'')+(run.allin?' <span class="gd">🎲</span>':'');}
    }
    paintQuote();
  }else{
    if(!run)liveTick(dt);
    paintQuote();
    if(state==='ready'){talkT+=dt;if(talkT>1.6){talkT=0;talk('idle');}}
  }
  tradeT+=dt;if(tradeT>(state==='holding'?rnd(.04,.16):state==='ghost'?.12:rnd(.4,.9))){tradeT=0;pushTrade(!run?liveM:cur);}
  bookT+=dt;if(bookT>(state==='holding'||state==='ghost'?.12:.5)){bookT=0;renderBook();}
  draw();requestAnimationFrame(frame);
}

buildChartIdle();paintTop();paintPickers();paintQuote();renderBook();setBtn();if(spFree()<0){sk={};store.set('shg_sk',sk);setTimeout(()=>toast('Skill tree updated, so all your SP was refunded'),1500);}paintTop();boot();talk('idle');talk('idle');
try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}
if(/selftest/.test(location.search)){
  window.__t={start,release,reenter,declareBankrupt,takeLoan,repay,tab,
    get s(){return {state,balance,debt,credit,cur,crashed,re:!!(run&&run.re),inv:invTotal(),xp,pres,tut:tutDone,streak,ready:performance.now()>=readyAt,curTab,modal:!$('modal').hidden,card:!card.hidden,col:col.length,net:stats.net,rounds:stats.rounds,hist:stats.hist.length}},
    set allin(v){allin=v},set lev(v){levSel=v},set pct(v){betPct=v},set sel(v){Object.assign(sel,v)},closeCard(){card.hidden=true;$('modal').hidden=true;}};
  if(/fast/.test(location.search)){draw=()=>{};}
}
setTimeout(()=>{try{if(tutDone&&profile&&state==='ready'&&balance+invTotal()<100000){state='over';showOver(0);setBtn();}}catch(e){}},900);
requestAnimationFrame(frame);
})();
