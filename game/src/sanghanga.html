<title>떡상 계좌 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="preload" as="image" href="brand/intro_portrait_ko.webp" media="(orientation:portrait)" fetchpriority="high">
<link rel="preload" as="image" href="brand/intro_landscape_ko.webp" media="(orientation:landscape)" fetchpriority="high">
<style>
/* Layout: one-screen HTS (증권사 앱) — account, quote, candle chart + 호가창, 종토방, picker, hold button
   디자인 v3 기초(토큰): 새 화면·기능은 아래 :root 값만 씀. 색 역할: 금색=보상·돈 / 빨강·파랑(영어판 초록·빨강)=가격·캔들·손익·매수 버튼 / 흰색=고르기·주 버튼 */
:root{
  /* 면: 남색 바탕 + 패널 3단(기본 · 카드 안 칸 · 선택된 칩·보조 버튼) + 흰빛 섞인 얇은 선 */
  --bg:#090c13;--bg-glow:radial-gradient(130% 55% at 50% -12%,#15223a,transparent 62%);
  --panel:#111723;--panel2:#192131;--panel3:#232d40;
  --hair:rgba(160,180,215,.12);--hair2:rgba(160,180,215,.22);--track:rgba(160,180,215,.16);--grid:#262f40;--line:var(--hair2);
  --fg:#f3f6fb;--fg2:#c3cad8;--muted:#9aa6ba;--muted2:#8b95a7;--ink:#0b0f17;
  /* 시장 색: 가격·캔들·손익·매수 버튼에만 (영어판은 en/build.py가 초록 상승·빨강 하락으로) · -t는 14px 이하 작은 숫자용 밝은 색 · cta는 흰 글씨 대비를 맞춘 큰 버튼 색 */
  --up:#f2313f;--down:#2f7bff;--up-t:#ff4d5a;--down-t:#5b96ff;--cta-up:#d0202e;--cta-dn:#1f5fd6;--on-up:#fff;--cta-fev-up:#c2410c;--cta-fev-dn:#6a4bf0; /* 피버 버튼이 흐르는 가운데 색 (흰 글씨 5.2:1 이상) */
  /* 역할 색 (언어와 상관없이 같음) */
  --gold:#ffc84a;--gold-t:#ffd36e;--gold-tone:rgba(255,200,74,.14);--gold-line:rgba(255,200,74,.38);--on-gold:#1a1300;
  --danger:#ff5468;--danger-t:#ff7684;--danger-tone:rgba(255,84,104,.10);--danger-line:rgba(255,84,104,.5);
  --notify:#ff5468;--teal:#4fc3cf;--rumor:#b58cff;--sel:rgba(243,246,251,.8);
  --halo0:rgba(255,180,138,.22);--halo1:rgba(79,195,207,.22);--halo2:rgba(255,200,74,.30); /* 파트너 후광: 아기·어른·전설 */
  --c-mis:#8b5cf6;--c-grow:#ff9f1c;--c-col:#ff6fae; /* (선택) 기능별 포인트 색: 섹션 아이콘 바탕·선택 탭 표시에만 (버튼 채우기 금지) */
  /* 빛과 그림자: 위쪽 4% 흰 빛 + 윗선 하이라이트 + 아래 부드러운 그림자 (3D 아이콘과 같은 재질) */
  --sheen:linear-gradient(180deg,rgba(255,255,255,.04),transparent 46%);
  --hi:inset 0 1px 0 rgba(255,255,255,.06);
  --sh-panel:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -16px rgba(0,0,0,.85);
  --sh-float:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -20px rgba(0,0,0,.9);
  --scrim:rgba(5,7,12,.62);--glass:rgba(20,27,41,.86); /* 모달·시트·카드 뒤 배경(흐림 10px) / 카드 자체(흐림 18px) */
  /* 모서리: 6 태그·호가 줄 / 10 버튼·칩 / 14 패널 / 20 모달·결과 / 24 시트 위쪽 / 999 알약 (예외: 큰 매수 버튼 18, 탭바 22, 주 버튼 12) */
  --r-xs:6px;--r-sm:10px;--r-btn:12px;--r-md:14px;--r-lg:20px;--r-xl:24px;--r-pill:999px;--r-cta:18px;--r-tab:22px;
  /* 간격 다섯 단계 */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
  /* 글꼴 (fonts/fonts.css 직접 호스팅): Gasoek One=특별한 순간만 / Noto Sans KR=모든 화면 글자 / Inter=모든 숫자 / mix=한글 섞인 줄(글은 Noto, 숫자만 Inter) */
  --sys:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif;
  --brand:"Gasoek One","Noto Sans KR",var(--sys);
  --ui:"Noto Sans KR",var(--sys);
  --num:"Inter","Noto Sans KR",var(--sys);
  --mix:"Inter Num","Noto Sans KR",var(--sys);
  /* 글자 크기 단계 (최소 11px · 굵기 400 본문 / 500 설명 강조 / 700 항목·버튼 / 800 큰 숫자·제목·매수 버튼, 900은 안 씀) */
  --t-micro:11px;--t-meta:12px;--t-chip:13px;--t-body:14px;--t-item:15px;--t-value:17px;--t-cta:20px;--t-title:22px;--t-price:26px;--t-brand:clamp(26px,7.5vw,32px);--t-hero:44px;
  /* 움직임: 누름 70/뗌 160 · 빠름 150 · 기본 220 · 등장 320 · 핵심 순간 700 (사라질 때는 약 30% 짧게) · 곡선: 나감/들어감/통통(좋은 일)/묵직(나쁜 일) */
  --m-press:70ms;--m-release:160ms;--m-fast:150ms;--m-base:220ms;--m-enter:320ms;--m-hero:700ms;
  --e-out:cubic-bezier(.22,1,.36,1);--e-in:cubic-bezier(.55,0,1,.45);--e-spring:cubic-bezier(.34,1.56,.64,1);--e-heavy:cubic-bezier(.5,0,.75,0);
  color-scheme:dark;--appw:760px;
}
html[lang=en]{--up-t:#16c784;--down-t:#ff4d5a;--cta-up:#16c784;--cta-dn:#d0202e;--on-up:#05140d;--cta-fev-up:#ff7a1a} /* 영어판: 초록 상승·빨강 하락 (--up/--down 자체는 en/build.py가 바꿈) · 초록 버튼은 진한 글씨 */
html,body{height:100%}
html[lang=ko] body{word-break:keep-all;overflow-wrap:anywhere}
body{background:var(--bg-glow) no-repeat,var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
p,small,li,.sub,.lead,.note{text-wrap:pretty} /* 문장 끝 한 단어만 다음 줄로 넘어가지 않게 */
.nb{white-space:nowrap} /* '(자동 사용)'·'1,000 XP 남음'처럼 중간에 끊기면 안 되는 말 */
.app{--pl:max(12px,env(safe-area-inset-left,0px));--pr:max(12px,env(safe-area-inset-right,0px));height:100%;box-sizing:border-box;max-width:var(--appw);margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-1);padding-block:6px 0;padding-left:var(--pl);padding-right:var(--pr)}
@media (min-width:420px){.app{--pl:max(16px,env(safe-area-inset-left,0px));--pr:max(16px,env(safe-area-inset-right,0px))}}
.top{display:contents} /* 폰: 머리·다음 목표·계좌 칸이 그대로 세로로 (PC는 위쪽 64px 바 하나) */
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up-t)}.dn{color:var(--down-t)}.gd{color:var(--gold)}.mu{color:var(--muted)}.wn{color:var(--danger-t)} /* 작은 글자의 가격 색은 밝은 버전 (큰 숫자는 아래에서 --up/--down) */
/* 버튼 5종류: 주(흰색, 화면에 하나) · 보조(--panel3) · 보상 받기(금색, '받기'에만) · 연한 금색(SP·가격 쓰기) · 위험(빨간 테두리) + 시장 버튼(#hold 하나) */
.b-pri,.setbtn,.card button.pri,#modalClose{background:var(--fg);color:var(--ink);border:0;font-weight:800;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 8px 20px -12px rgba(255,255,255,.35)}
.b-sec,.setbtn.ghost,.card button,.sh-h button{background:var(--panel3);color:var(--fg);border:1px solid var(--hair2);font-weight:700;box-shadow:var(--hi)}
.setbtn.rw,.b-rw,.card button.rw{background:linear-gradient(180deg,#ffd76e,var(--gold));color:var(--on-gold);border:0;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 0 #c98f12}
.setbtn.tone,.sk button,.b-tone{background:var(--gold-tone);color:var(--gold-t);border:1px solid var(--gold-line);font-weight:700;box-shadow:none}
.setbtn.danger,.b-danger,.card button.danger{background:var(--danger-tone);color:var(--danger-t);border:1px solid var(--danger-line);font-weight:700;box-shadow:none}
/* 누르면 바로 반응: 누르는 동안 95%·살짝 어둡게(70ms), 떼면 통통 튀며 원래대로(160ms) · transform을 쓰는 요소와 겹치지 않게 scale 속성 */
:where(button,.chip,[role=button],summary,a.setbtn){transition:scale var(--m-release) var(--e-spring),filter var(--m-release) ease-out,background-color var(--m-fast),border-color var(--m-fast),color var(--m-fast)}
:where(button,.chip,[role=button],summary,a.setbtn):active:not(:disabled){scale:.95;filter:brightness(.93);transition-duration:var(--m-press),var(--m-press),var(--m-fast),var(--m-fast),var(--m-fast)}
:where(.srow,.pick1,#hold,.modal .box button,.card .btns button,.page .setbtn[style*="width:100%"],.card .opts button,.sw,.ri,.si):active:not(:disabled){scale:.97}
@keyframes tick{from{scale:1.06}} /* % 칩·아이템 칩이 켜질 때 '톡' */
.tk{animation:tick var(--m-release) var(--e-out)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
h1{font-family:var(--brand);font-weight:400;font-size:var(--t-cta);margin:0;letter-spacing:0;white-space:nowrap;-webkit-text-stroke:1px var(--bg)} /* 로고 글꼴 (특별한 순간·로고에만) */
h1 b{color:var(--up);font-weight:400}
.hb{display:flex;gap:5px;align-items:center}
.ib{font:700 var(--t-chip) var(--num);background:var(--sheen),var(--panel2);color:var(--fg);border:1px solid var(--hair2);border-radius:var(--r-sm);height:28px;padding:0 8px;cursor:pointer;white-space:nowrap;box-shadow:var(--hi)}
.ib.gd{color:var(--gold)}
.rank{display:flex;align-items:center;gap:var(--sp-2);min-width:0;cursor:pointer;border-radius:var(--r-pill)}
.rkt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rank span{font-size:var(--t-meta);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkt>i{display:block;height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.rkt>i b{display:block;height:100%;background:var(--gold);transition:width .4s}
/* 파트너 얼굴 = 내 레벨: 둘레 금색 링 = 경험치(레벨 안 진행도) · 오른쪽 아래 Lv 배지 · 누르면 레벨 창 (동물 친구를 끄면 성향 아이콘) */
.pav{--p:0;position:relative;flex:none;width:46px;height:46px;box-sizing:border-box;padding:3px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p) * 1%),var(--track) 0)}
.rank .pav{overflow:visible}
.pav i{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:no-repeat 50% 0/auto 210%,radial-gradient(circle at 50% 30%,#2b5a66,#14202c 75%);box-shadow:inset 0 0 0 2px var(--bg)}
.pav i.ic{background-size:72% auto,auto;background-position:50% 50%,0 0}
.pav b{position:absolute;right:-7px;bottom:-3px;font:800 var(--t-micro)/1 var(--num);color:var(--on-gold);background:var(--gold);padding:2px 5px;border-radius:var(--r-pill);box-shadow:0 0 0 2px var(--bg);white-space:nowrap;font-variant-numeric:tabular-nums}

/* account: 예수금이 주인공 (머리 줄 52px: 얼굴 | 예수금 26px | 선물·SP 44x44) · 연속 익절은 2연속부터 작은 🔥 알약, 투자 한도는 주문 칸에 */
.acct{display:grid;grid-template-columns:1.5fr 1fr 1fr;flex:none;background:var(--sheen),var(--panel);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--sh-panel)}
.acct div{padding:5px 10px 6px;min-width:0}
.acct div+div{border-left:1px solid var(--hair)}
.acct small{display:block;font-size:var(--t-meta);color:var(--muted)}
.acct span{display:block;font-family:var(--num);font-weight:800;font-size:var(--t-value);line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acct .rkl{display:none;font:700 var(--t-meta)/1.25 var(--ui);color:#c9d1de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .bl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stkp{flex:none;font:700 var(--t-micro)/1 var(--mix);font-style:normal;color:var(--fg);background:var(--panel3);border:1px solid var(--hair2);border-radius:var(--r-pill);padding:2px 7px}.stkp[hidden]{display:none}
.stkp .ico{width:1.25em;height:1.25em;vertical-align:-.3em;margin:-.1em .05em -.1em -.15em}
#bal u{text-decoration:none;font:700 16px/1 var(--ui);color:#c9d1de;margin-left:1px;letter-spacing:0} /* 단위(만원)는 회색 작게 */
/* 보유 중: 다음 목표 줄 대신 평가손익 바 (52px · 이익이면 상승 색, 손해면 하락 색 바탕) */
.pnlb{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);height:52px;box-sizing:border-box;padding:0 var(--sp-4);border-radius:var(--r-md);border:1px solid var(--hair2);background:var(--sheen),var(--panel);box-shadow:var(--sh-panel);min-width:0;flex:none}
.pnlb[hidden]{display:none}
.pbl{display:flex;flex-direction:column;justify-content:center;min-width:0}
.pnlb small{font:500 var(--t-meta)/1.2 var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnlb b{font:800 var(--t-price)/1.1 var(--num);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;overflow:clip visible;text-overflow:ellipsis} /* 안전망: 넘쳐도 수익률 위로 번지지 않게 가로로만 자름 (보통은 pbFit이 짧은 표기로 바꿈) */
.pnlb em{flex:none;font:800 18px/1 var(--num);font-style:normal;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.pnlb.up b,.pnlb.up em{color:var(--up-t)}.pnlb.dn b,.pnlb.dn em{color:var(--down-t)}.pnlb.gd b,.pnlb.gd em{color:var(--gold)}
@supports (background:color-mix(in srgb,red,blue)){.pnlb.up{background:linear-gradient(90deg,color-mix(in srgb,var(--up) 24%,var(--panel)),color-mix(in srgb,var(--up) 9%,var(--panel)));border-color:color-mix(in srgb,var(--up) 50%,transparent)}.pnlb.dn{background:linear-gradient(90deg,color-mix(in srgb,var(--down) 24%,var(--panel)),color-mix(in srgb,var(--down) 9%,var(--panel)));border-color:color-mix(in srgb,var(--down) 50%,transparent)}}
.pnlb.beat{animation:pbBt .18s var(--e-out)}@keyframes pbBt{50%{scale:1.012}} /* 심장 박동에 맞춰 살짝 */
.app:not(.pro) .pnlb b{font-size:var(--t-cta)}.app:not(.pro) .pnlb em{font-size:40px}.app:not(.pro) .pnlb em.m{font-size:32px}.app:not(.pro) .pnlb em.s{font-size:26px} /* 간편 모드: 수익률이 40px 주인공 (긴 숫자는 한 단계씩 작게) */

/* quote */
.quote{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;padding:0 2px}
.qn{min-width:0;flex:1}
.qnr{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.qn b{display:block;font-size:var(--t-cta);font-weight:800;letter-spacing:-.02em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:374px){.qn b{font-size:var(--t-value)}.qnr{gap:6px}.qnr .spill{padding:0 8px}} /* 좁은 폰: 종목명 자리를 조금 더 (알약은 26px 높이·44px 누름 영역 그대로) */
.qn small{display:block;margin-top:2px;font-size:var(--t-meta);color:var(--muted);font-family:var(--mix)}
.qn .tier{display:inline-block;font-family:var(--ui);font-size:var(--t-micro);font-weight:700;border:1px solid var(--hair2);border-radius:var(--r-xs);padding:0 5px;margin-left:4px;color:var(--fg)}
.qp{text-align:right;flex:none}
#qPrice{font-family:var(--num);font-weight:800;font-size:clamp(24px,6.2vw,26px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em} /* 종목 가격은 예수금(26px)과 같거나 작게 */
/* 종목명 옆 '종목 8개 ▾' 알약 = 종목 고르기 (종목 카드 대신) · 누르는 곳 44px */
.offers{flex:none;display:flex;min-width:0}
.spill{position:relative;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--panel2);border:1px solid var(--hair2);color:var(--fg);font:700 var(--t-meta)/1 var(--ui);cursor:pointer;white-space:nowrap;box-shadow:var(--hi)}
.spill::after{content:"";position:absolute;top:-10px;right:-4px;bottom:-10px;left:-4px}
.spill:disabled{opacity:.45;cursor:default}
.spill svg{width:10px;height:6px;flex:none}
.spill.bosschip{background:color-mix(in srgb,#ff2d55 22%,var(--panel2));border-color:#ff4d6d}
#qPrice.up{color:var(--up)}#qPrice.dn{color:var(--down)}
#qChg{font-family:var(--num);font-size:var(--t-meta);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* main: chart + book */
.main{position:relative;flex:1;min-height:150px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.app.pro .main{grid-template-columns:minmax(0,1fr) var(--bkw,92px)} /* 프로 HTS: 차트 + 호가창 92px (간편 모드는 차트가 꽉 참) · 가격·잔량 글자가 길면(10만원 이상·잔량 네 자리) renderBook이 --bkw로 넓힘 */
html[lang=en] .app.pro .main{grid-template-columns:minmax(0,1fr) var(--bkw,102px)} /* 영어판 달러 가격($241.50)은 조금 넓게 */
.app:not(.pro) .main>.book{display:none}
.chart{position:relative;background:var(--sheen),var(--panel);border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-panel)}
.app.fever .chart{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px color-mix(in srgb,var(--gold) 35%,transparent)}
.chart.shake{animation:shake .35s var(--e-heavy)}

.chart.hit{animation:hitC .7s var(--e-out)}@keyframes hitC{from{box-shadow:inset 0 0 0 2px var(--down),inset 0 0 60px color-mix(in srgb,var(--down) 60%,transparent)}} /* 폭락: 화면 전체 번쩍임 대신 차트 안쪽 하락 색 그림자 */
.chart.shake.hit{animation:shake .35s var(--e-heavy),hitC .7s var(--e-out)}

.chart.gw2{animation:gw2 .9s var(--e-out)}@keyframes gw2{from{box-shadow:0 0 0 2px var(--gold),inset 0 0 70px color-mix(in srgb,var(--gold) 45%,transparent)}} /* 큰 수익(+50%~): 차트 안 금빛 */
canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}

.book{overflow-wrap:normal;background:var(--sheen),var(--panel);border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;font-family:var(--num);font-size:var(--t-meta);font-variant-numeric:tabular-nums;box-shadow:var(--sh-panel)}

.ob .q{position:relative;color:var(--fg2);font-size:var(--t-micro);line-height:1.15;text-align:right}
.ob.now{outline:1.5px solid var(--sel);outline-offset:-1.5px;background:rgba(243,246,251,.07)}

#news{position:absolute;left:8px;right:8px;top:38px;z-index:4;box-sizing:border-box;padding:5px 10px;line-height:1.35;border-radius:var(--r-sm);border:1px solid var(--hair2);background:rgba(17,23,35,.9);font-weight:700;font-size:var(--t-meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:slide var(--m-base) var(--e-out);box-shadow:0 8px 20px -10px rgba(0,0,0,.8)} /* 뉴스는 있을 때만 차트 안 배너로 (비어 있는 '실시간 뉴스' 줄 없음) */

#news.bull{background:color-mix(in srgb,var(--up) 30%,var(--bg));border:1px solid var(--up)}
#news.rumor{background:color-mix(in srgb,var(--rumor) 30%,var(--bg));border:1px solid var(--rumor)}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 34px);transform:translateX(-50%);background:rgba(38,49,69,.96);color:var(--fg);border:1px solid var(--hair2);font-weight:700;font-size:var(--t-chip);padding:9px 16px;border-radius:var(--r-pill);white-space:nowrap;pointer-events:none;animation:slide var(--m-base) var(--e-out);z-index:30;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px -8px rgba(0,0,0,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)} /* 알림은 금색이 아닌 밝은 유리 (금색은 보상에만) */

.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,92%);max-height:96%;overflow:auto;box-sizing:border-box;background:var(--glass);border:1px solid var(--hair2);border-radius:var(--r-lg);padding:var(--sp-3) var(--sp-4);text-align:center;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);animation:pop var(--m-base) var(--e-out);z-index:3}
@keyframes pop{from{opacity:0;translate:0 10px;scale:.97}}
.card .grade{font:800 var(--t-title)/1.25 var(--ui);letter-spacing:-.02em} /* 카드 제목 = 화면 제목 스타일 (환영·파산·챌린지 등) */
.card .grade.br,.stamp{font-family:var(--brand);font-weight:400;letter-spacing:0;-webkit-text-stroke:1.2px var(--stk,#141b29)} /* 특별한 순간(결과 '익절 성공!/물렸습니다'·튜토리얼 완료·파트너 성장·도장)만 로고 글꼴, 1.2px 테두리로 로고처럼 살짝 얇게 · 바뀌는 숫자엔 안 씀 */
.card .grade.br{font-size:var(--t-brand);line-height:1.15}
.card .grade.up,.card .big.up{color:var(--up)}.card .grade.dn,.card .big.dn{color:var(--down)}.card .grade.wn{color:var(--danger)} /* 바닥·신용불량 제목은 위험 색 (가격 색 아님) */
.card.cmp .rage,.card.cmp .near{display:none}.card.cmp .grade{font-size:var(--t-cta)}.card.cmp .grade.br{font-size:var(--t-price)}.card.cmp{padding-block:10px}

.card .bar{height:7px;border-radius:4px;background:var(--track);margin-top:9px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--gold)}
.card .goal .pb{height:4px;background:var(--track);border-radius:2px;margin-top:3px;overflow:hidden}.card .goal .pb u{display:block;height:100%;background:var(--gold)} /* 결과 카드의 다음 목표 막대 */
.card .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mix);font-size:var(--t-chip);color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}

.card .btns>button{width:100%} /* 순서는 마크업 그대로 (주 버튼을 앞에 둠 · 설명 줄이 자기 버튼 바로 아래에 붙어 있게) */

.card ul{text-align:left;font-size:var(--t-body);line-height:1.6;padding-left:18px;margin:8px 0 0;color:var(--fg)}

/* 종토방 */
.talk{flex:none;position:relative;background:var(--sheen),var(--panel);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--sh-panel);padding:0 10px 0 6px;height:30px;box-sizing:border-box;overflow:hidden;font-size:var(--t-chip);display:flex;flex-direction:row;align-items:center;gap:8px} /* 채팅은 한 줄(30px)로 흐르는 글 */

.talk p:last-child{animation:tkIn var(--m-base) var(--e-out)}@keyframes tkIn{from{opacity:0;translate:18px 0}}

.talk::before{content:attr(data-l);flex:none;font:700 var(--t-micro)/16px var(--ui);color:var(--muted);border:1px solid var(--hair2);border-radius:var(--r-xs);padding:0 6px;pointer-events:none;white-space:nowrap}body.noChat .talk{display:none!important} /* 진짜 사람 채팅으로 오해하지 않게 '가상' 표시(앞 꼬리표), 포털이 채팅 끄기를 켜면 숨김 */

/* pickers: 주문 칸 카드 한 장 = 투자 금액 + 10/25/50/100% 묶음 버튼 + 아이템 (간편 모드는 아이템 칩 하나 → 시트) */

@media (max-width:359px){#betrow .seg button{font-size:var(--t-chip)}#betrow{gap:6px}}
.itb,#betrow .itb{position:relative;flex:none;width:52px;height:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border-radius:var(--r-btn);background:var(--sheen),var(--panel2);border:1px solid var(--hair2);color:var(--fg);font:700 var(--t-micro)/1.1 var(--ui);cursor:pointer;box-shadow:var(--hi);white-space:nowrap}
.itb .ico{width:22px;height:22px;margin:0;vertical-align:0}
.itb em{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;box-sizing:border-box;padding:0 4px;border-radius:var(--r-pill);background:var(--fg);color:var(--ink);font:800 var(--t-micro)/18px var(--num);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}
.itb[aria-pressed="true"]{border-color:var(--sel);background:var(--panel3)}
.itb.hot em{background:var(--danger);color:#fff}
.itb:disabled{opacity:.45}
.app.pro .itb,.itb[hidden]{display:none}
.chip{font:inherit;text-align:left;background:var(--sheen),var(--panel2);color:var(--fg);border:1px solid var(--hair);border-radius:var(--r-sm);padding:var(--sp-2);cursor:pointer;min-width:0;line-height:1.25;box-shadow:var(--hi)}
.chip b{display:block;font-size:var(--t-chip);font-weight:700;white-space:nowrap;overflow:hidden;overflow:clip visible;text-overflow:ellipsis} /* 가로로만 잘라 말줄임 (세로는 안 잘라서 글자 아랫부분·밑으로 내려가는 획이 안 잘림, 옛 브라우저는 hidden) */
.chip small{display:block;font-size:var(--t-meta);margin-top:1px;color:var(--fg2);white-space:nowrap;overflow:hidden;overflow:clip visible;text-overflow:ellipsis;font-family:var(--mix)}
.chip[aria-pressed="true"]{border-color:var(--sel);background:var(--panel3);box-shadow:inset 0 0 0 .5px var(--sel),0 2px 6px rgba(0,0,0,.4)} /* 선택: 흰 테두리 1.5px (금색 아님) */
.chip:disabled{opacity:.4;cursor:default}
.items{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:5px;overflow:visible;flex:none;scrollbar-width:none}
.items::-webkit-scrollbar{display:none}
.chip:focus-visible,.ib:focus-visible,.card button:focus-visible,.tabs button:focus-visible,.setbtn:focus-visible,.sw:focus-visible,summary:focus-visible,.betrow button:focus-visible,.srow:focus-visible,#modalClose:focus-visible,#shClose:focus-visible,.rank:focus-visible,.pick1:focus-visible,#regime:focus-visible,.sk button:focus-visible,.sp:focus-visible,.pc:focus-visible,.modal button:focus-visible,#goal:focus-visible,.qh:focus-visible,.pjump button:focus-visible,.ri:focus-visible,.si:focus-visible{outline:2px solid var(--fg);outline-offset:2px;box-shadow:0 0 0 5px rgba(9,12,19,.75)} /* 키보드 초점은 늘 보이게 (흰 테두리 + 어두운 테 · 금색은 보상에만) */

/* 시장 버튼(매수/매도): 위가 밝고 아래가 진한 광택 + 4px 아랫단 + 같은 색 빛 번짐 · 글자 Noto 800(숫자는 Inter) */
#hold{--c:var(--cta-up);height:56px;flex:none;border:0;border-radius:var(--r-cta);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 88%,#000) 100%);color:var(--on-up);font:800 var(--t-cta)/1.15 var(--mix);letter-spacing:-.02em;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:none;text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.2),0 4px 0 color-mix(in srgb,var(--c) 55%,#000),0 14px 30px -12px color-mix(in srgb,var(--c) 70%,transparent);transition:transform .06s,box-shadow .06s,scale var(--m-release) var(--e-spring),filter var(--m-release)}
.app.fever #hold{background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.3) 50%,transparent 58%) -150% 0/250% 100% no-repeat,linear-gradient(90deg,var(--cta-up),var(--cta-fev-up),var(--cta-up)) 50% 0/200% 100%;animation:sweep 2.4s linear infinite} /* 피버: 흐르는 그라데이션 대신 2.4초에 한 번 지나가는 빛줄기 */
.app.fever #hold.on{background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.3) 50%,transparent 58%) -150% 0/250% 100% no-repeat,linear-gradient(90deg,var(--cta-dn),var(--cta-fev-dn),var(--cta-dn)) 50% 0/200% 100%}
@keyframes flow{to{background-position:200% 0}}@keyframes sweep{0%{background-position:-150% 0,50% 0}35%,100%{background-position:250% 0,50% 0}}
#hold:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#hold.on{--c:var(--cta-dn);color:#fff;transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 color-mix(in srgb,var(--c) 55%,#000),0 0 calc(var(--heat,0) * 46px) color-mix(in srgb,var(--c) 80%,transparent)}
#hold.on.beat{animation:hbt .18s var(--e-out)} /* 보유 중: 깜빡임 대신 심장박동 소리에 맞춰 1→1.025→1 */
.app.fever #hold.on.beat{animation:hbt .18s var(--e-out),sweep 2.4s linear infinite} /* 피버 중엔 박동해도 빛줄기는 계속 */
@keyframes hbt{50%{scale:1.025}}
#hold.wait{background:var(--panel2);color:var(--muted);text-shadow:none;box-shadow:var(--hi),0 4px 0 #040508;animation:none}
@keyframes pulse{to{box-shadow:0 0 0 2px var(--gold-line),0 0 18px 2px color-mix(in srgb,var(--gold) 40%,transparent)}}@keyframes pulse2{50%{box-shadow:0 0 0 2px var(--gold-line),0 0 18px 2px color-mix(in srgb,var(--gold) 40%,transparent)}} /* 보상 준비(선물·시즌 패스): 밝기 깜빡임 대신 빛 번짐 */

.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{width:min(380px,100%);max-height:80vh;overflow:auto;background:var(--sheen),var(--panel2);border:1px solid var(--hair2);border-radius:var(--r-lg);padding:var(--sp-4);box-sizing:border-box;box-shadow:var(--sh-float)}
.modal .box:focus,#sheet .sh:focus{outline:none}
.modal h2,.page h2,.sh-h b,.card .q{font:800 var(--t-title)/1.25 var(--ui);letter-spacing:-.02em;margin:0 0 4px} /* 페이지·시트·모달 제목은 하나의 스타일 */
.modal h3,.page h3{font:700 var(--t-item)/1.3 var(--ui);color:var(--fg);letter-spacing:0;margin:var(--sp-5) 0 var(--sp-2)} /* 섹션 제목: 15px 700 흰색, 옆 숫자는 13px 회색 */
.modal h3{margin:var(--sp-3) 0 var(--sp-1)}
.modal h3 .mu,.page h3 .mu{font-size:var(--t-chip);font-weight:500}
.modal .note{font-size:var(--t-meta);color:var(--muted);margin:0 0 8px;line-height:1.45}
.li{display:flex;gap:var(--sp-3);align-items:center;padding:var(--sp-2) 0;border-top:1px solid var(--hair)}
.li>i{font-style:normal;font-size:var(--t-cta);width:26px;text-align:center;flex:none}
.li div{flex:1;min-width:0}
.li b{display:block;font-size:var(--t-item);line-height:1.35;overflow-wrap:anywhere}.li small{color:var(--muted);font-size:var(--t-meta);line-height:1.4}
.li .pb{height:4px;background:var(--track);border-radius:2px;margin-top:4px;overflow:hidden}.li .pb u{display:block;height:100%;background:var(--gold)}
.li.lock b,.li.lock small{color:var(--muted2)}.li.lock>i{filter:brightness(0) invert(.36);opacity:.9} /* 잠긴 항목: 글자는 색으로, 아이콘은 회색 처리 대신 동물 도감 같은 어두운 실루엣 */
.li.done b{color:var(--fg)} /* 보유·완료 줄: 금색 대신 흰 글자 (금색은 보상·돈에만) */
.li.me{background:var(--panel3);box-shadow:inset 3px 0 0 var(--fg);border-radius:var(--r-sm);padding-inline:var(--sp-2);margin-inline:calc(-1 * var(--sp-2))} /* 친구 리그 '나' 줄: 흰 표시 (고르기 = 흰색) */
.ownb{display:inline-block;font:700 var(--t-meta)/1.3 var(--ui);color:var(--fg);background:var(--panel3);border:1px solid var(--sel);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap}.fv{color:var(--fg);font-weight:800}.tgs{color:var(--muted)!important;font-weight:700!important}
.modal button{font-family:inherit;font-size:var(--t-body);cursor:pointer}

/* TOURS begin: css */
:root{--tour-dim:rgba(5,7,12,.66);--tour-bub:#f6f8fc;--tour-ink:#262d3b;--tour-mu:#4a5468;--tour-line:#d3dbe8;--tour-pan:#e9eef7;--tour-cost:#c4162a;--tour-ok:#0f7a4a;--tour-ring:#fff;--tour-focus:#2f7bff;--tour-pill:#1d2433} /* 버튼 안내 색 (게임은 어두운 화면만 · 말풍선은 늘 밝은 면) */

#tour .tptr{position:absolute;width:40px;height:40px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));font-size:34px;line-height:1}

const RNOTE=[[1,2,'익절과 물림','오르는 동안 팔면 그 가격으로 수익을 챙겨요 (익절). 팔기 전에 폭락이 오면 떨어진 가격에 묶여요 (물림). 한 판은 결국 ‘언제 팔까’를 고르는 일이에요.'],[2,4,'폭락은 언제 오나요?','폭락 시점은 판마다 달라서 미리 알 수 없어요. 오래 들고 있을수록 위험이 커지고, 사자마자 떨어지는 폭락은 운도 있어요. 종류마다 물렸을 때 잃는 비율이 달라요 (종목 이름 아래 ‘물리면 −N%’).'],[3,6,'장세 8가지','보통장, 불장, 하락장, 변동성 폭발, 횡보장, 테마 장세, 유동성 파티, 블랙스완 주의보. 장세는 몇 판씩 이어지고 차트 위 칩에 이름과 남은 판 수가 보여요. 칩을 누르면 무엇이 달라지는지 알려 줘요.'],[4,9,'보스전은 읽는 싸움','열 판마다 보스가 나와요. 보스마다 버릇이 있어서, 차트와 신호를 읽고 팔 때를 고르면 이겨요. 처치하면 보스 도감에 기록돼요.'],[5,14,'손절도 실력','떨어지기 시작할 때 조금 잃고 나오는 것도 실력이에요. 🛡️ 손절보험을 켜면 폭락 손실이 75% 줄어요 (최소 10%는 잃어요).'],[7,17,'뉴스와 찌라시','뉴스는 차트를 흔들어요. 🔍 찌라시는 폭락 가격을 선으로 미리 보여 주는데, 열 번 중 일곱 번은 진짜예요 (70%). 진짜면 폭락 전에 1초 여유가 생겨요.'],[23,20,'Lv.20부터 빨라지는 폭락','Lv.20부터 Lv.64까지는 레벨이 오를수록 폭락이 조금씩 빨리 와요 (최대 35%). 그 대신 레벨 투자 한도는 레벨마다 22%씩 커져요.'],[6,25,'분산 투자','돈을 한 곳에 다 넣지 않고 나눠 두면, 한 번의 폭락에 전부 잃지 않아요. 내 계좌의 투자 상품도 여러 개로 나눠 넣을 수 있어요.'],[8,41,'호가창 읽기','호가창은 사고팔려는 주문이 쌓인 모습이에요. 위쪽은 팔려는 가격, 아래쪽은 사려는 가격이에요. 프로 HTS를 켜면 거래 화면에서 볼 수 있어요.'],[9,57,'거래량','차트 아래 막대는 그때 얼마나 많이 거래됐는지(거래량)예요. 가격이 크게 움직일 때 막대도 같이 커지는 경우가 많아요.'],[10,71,'이동평균선','차트 위를 지나는 부드러운 선은 최근 봉 5개 종가의 평균(5일선 같은 이동평균선)이에요. 가격이 선 위에 있으면 최근보다 높은 자리라는 뜻이에요.'],[11,83,'복리의 힘','번 돈에 다시 이자가 붙는 것이 복리예요. 매년 10%씩 7년이면 처음 돈의 약 1.95배가 돼요. 시간이 길수록 차이가 커져요.'],[12,94,'변동성','가격이 얼마나 크게 출렁이는지가 변동성이에요. 변동성이 크면 빨리 벌 수도 있지만 빨리 잃을 수도 있어요. 동전주와 코인이 이 게임에서 가장 크게 출렁여요.'],[13,107,'레버리지가 위험한 이유','레버리지 2배면 수익도 손실도 2배예요. 많이 떨어지면 강제청산돼서 판이 바로 끝나고, 배수가 클수록 수수료(이자)도 커져요. 1배로만 해도 레벨은 똑같이 올라요.'],[14,118,'빚과 이자','대출을 받으면 판마다 이자가 붙어요. 빚이 남은 채 계좌가 바닥나면 파산 신청과 압류로 이어져요. 빌리기 전에 갚을 길부터 생각해요.'],[15,129,'정기적금과 국채','정기적금은 이율이 낮지만 꾸준해요. 국채는 나라에 돈을 빌려주는 것이라 안전한 편이에요. 둘 다 크게 벌기보다 지키는 쪽에 가까워요.'],[16,141,'리츠와 인덱스','리츠는 여러 사람이 돈을 모아 건물에 투자하는 상품이에요. 인덱스 펀드는 시장 전체를 조금씩 사는 상품이라 한 회사에 덜 흔들려요.'],[17,153,'공모주','공모주는 처음 시장에 나오는 회사예요. 상장 첫날엔 크게 오르기도, 크게 떨어지기도 해요. 이 게임에서도 공모주는 출렁임이 크고 사자마자 폭락하는 일이 더 잦은 편이에요.'],[18,163,'테마주','테마주는 유행하는 이야기(로봇, 배터리, AI…)로 함께 움직이는 종목이에요. 이야기가 식으면 빨리 떨어질 수 있어요. 테마 장세엔 테마주·코인·바이오 수익이 50% 늘어요.'],[19,177,'동전주','동전주는 한 주 가격이 아주 싼 종목이에요. 가격이 1원만 움직여도 비율로는 커서 출렁임이 가장 커요.'],[20,186,'미국 주식','미국 주식은 달러로 표시되고 하루 상한가가 없어요. 이 게임의 미국주식도 달러로 보이고 +30% 제한 없이 움직여요.'],[21,198,'작전주를 조심해요','작전주는 누군가 일부러 가격을 끌어올리는 종목이에요. 이 게임의 작전주는 경고가 뜨면 대부분 진짜예요. 남의 말보다 내 기록을 믿어요.'],[22,214,'진짜 경고 ⚠️','경고가 떠도 늘 폭락이 오는 건 아니고, 경고 없이 떨어질 때도 있어요. 차트와 함께 보고 판단해요. 🦊 눈치 여우 성향은 진짜 폭락 경고를 더 자주 받아요.'],[24,224,'배당이란?','배당은 회사가 번 돈의 일부를 주주에게 나눠 주는 것이에요. 배당주 펀드는 이런 회사들을 모아 둔 상품이라 꾸준한 편이에요.'],[25,233,'은퇴는 새 출발','은퇴하면 돈·투자·소모품·빚이 처음으로 돌아가고, 장비·레벨·스킬은 그대로 남아요. 레벨 길에서 연 것도 그대로예요.'],[26,248,'블랙스완','블랙스완은 아무도 예상 못 한 큰 사건이에요. 이 게임의 ‘블랙스완 주의보’ 장세에선 폭락이 25% 빨리 오는 대신 수익이 60% 커져요.'],[27,259,'거품은 왜 꺼질까','가격이 가치보다 훨씬 비싸지면 거품이라고 해요. 더 오를 거라는 기대만으로 사는 사람이 줄면, 작은 소식에도 한꺼번에 떨어져요.'],[28,268,'1929년 대공황','1929년 10월 미국 주식 시장이 크게 무너졌고, 이어진 대공황으로 다우 지수는 1932년까지 약 89% 떨어졌어요. 빚을 내 산 사람들이 특히 크게 잃었어요.'],[29,282,'닷컴 버블','1990년대 말 인터넷 회사 주가가 크게 올랐다가, 나스닥 지수는 2000년 3월 꼭대기에서 2002년까지 약 78% 떨어졌어요. 이야기만 있고 벌이가 없던 회사가 많았어요.'],[30,294,'두려움과 욕심','욕심이 커지면 너무 오래 들고, 두려움이 커지면 너무 빨리 팔아요. 미리 정한 기준대로 파는 습관이 둘 다 막아 줘요.']];

const T7=[{L:'D',k:'일반',c:'#9aa6ba'},{L:'C',k:'고급',c:'#50c878'},{L:'B',k:'희귀',c:'#7ab8ff'},{L:'A',k:'에픽',c:'#b58cff'},{L:'S',k:'전설',c:'#ffc84a'},{L:'SS',k:'신화',c:'#ff5a8a'},{L:'SSS',k:'신',c:'#fff3d6'}]; // D 일반 … SSS 신: 글자 · 이름 · 테두리 색 (있던 색만)

const gT=id=>Math.max(0,Math.min(7,Math.floor(+gear[id]||0))); // 0 = 없음, 1..7 = D..SSS
const gV=id=>{const t=gT(id);return t?GL[id].v[t-1]:0;}; // 의자·카드는 D에서 0 (D 효과는 원래 자리 그대로)
const gMul=()=>(1+gV('car'))*(1+gV('yacht'))*(1+gV('firm')); // 투자 한도 배수 ×1 … ×2.756
const gMulD=()=>(gear.car?1.1:1)*(gear.yacht?1.2:1)*(gear.firm?1.5:1); // 지금(v3.0.5)까지의 배수 ≤ ×1.98: 레버리지 판 한도·대출·빚 한도는 이 값 그대로
const misRw=()=>1000000*(1+.1*skl('mission'))*(gear.building?2:1)+(gear.building?Math.round(gV('building')*betCap(1)/gMul()/1e4)*1e4:0); // 일일 미션 1개 보상: 빌딩은 현금 2배 + 장비 뺀 기본 한도의 단계별 %

const gRo=w=>{const c=String(w).charCodeAt(String(w).length-1)-44032,j=c>=0&&c<11172?c%28:0;return j===0||j===8?'\uB85C':'\uC73C\uB85C';}; // 로/으로 (받침 없음·ㄹ받침 → 로)

const gLbl=(id,k,long)=>{const s=GL[id];return s.k==='c'?(k?(long?'1배 판 손절 손실':'1배 손절'):'차트 속도'):s.k==='v'?(k?(long?'1배 판 세금':'1배 세금'):'수수료'):s.k==='b'?(long?'일일 미션 보너스 · 기본 한도의':'미션 보너스'):s.st;};

const gRgb=h=>{const n=parseInt(h.slice(1),16);return (n>>16&255)+','+(n>>8&255)+','+(n&255);};

function gearCan(id){const t=gT(id);if(t>=7)return'max';if(!gOpen(id,t))return'gate';if(debt>0)return'debt';return balance<GL[id].p[t]?'short':'ok';} // 다음 한 단계만: 최고 · 조건 · 빚 · 돈
function gEffRow(id,cur,nx){ // 줄 둘째 칸: '투자 한도 +13% → +14%' (D의 카드·의자는 화살표에서 이름이 바뀜)

function skRec(){const n=spFree();return n>0?SKILLS.filter(x=>!(x.req&&brPts(x.br)<x.req)&&skl(x.id)<x.max&&costOf(skl(x.id))<=n).sort((a,b)=>skl(a.id)-skl(b.id))[0]||null:null;} // 지금 추천하는 다음 강화 하나 (가장 덜 찍은, 살 수 있는 스킬) = 화면에 하나뿐인 꽉 찬 금색 버튼
function skRow(x,rec){const l=skl(x.id),cost=costOf(l),maxed=l>=x.max,locked=x.req&&brPts(x.br)<x.req,can=!maxed&&!locked&&spFree()>=cost,sg=x.d.slice(-1)==='-'?'\u2212':'+',lab=x.d.slice(0,-1).trim(),v=k=>+(x.per*k).toFixed(1)+x.u,bl=maxed?'MAX':locked?'🔒 계열 '+x.req+'P 필요':'강화 · SP '+cost; // 60px 한 줄 [아이콘 32 | 이름 15 + Lv | 지금 → 다음 | SP 버튼 64×36]

function ivFit(){document.querySelectorAll('#page .ivr').forEach(r=>{const s=r.querySelector('.ivs'),x=r.querySelector('.ivx');if(!s||!x)return;if(x.parentNode!==r)r.insertBefore(x,s.nextSibling);const cw=s.clientWidth;if(!cw)return; // 투자 줄: '지난 판' 손익을 먼저 따로 한 줄로 두고, 잔액 옆(왼쪽 칸)에 통째로 들어가면 같은 줄로 옮김 (좁은 폰에선 그대로 따로: '·'만 남거나 금액이 갈리지 않게)
  s.style.width=x.style.width='max-content';const a=s.offsetWidth,b=x.offsetWidth;s.style.width=x.style.width='';if(a+b+16<=cw)s.appendChild(x);});}
