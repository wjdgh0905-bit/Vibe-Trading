  <path d="M196 310h120l-13 78q-2 12-14 12h-66q-12 0-14-12z" fill="#D9A08A"/>
  <path d="M196 310h40l-9 90h-17q-12 0-14-12z" fill="#C08A76"/>
  <rect x="178" y="282" width="156" height="34" rx="12" fill="#D9A08A"/>
  <rect x="178" y="282" width="46" height="34" rx="12" fill="#C08A76"/>
  <rect x="200" y="282" width="24" height="34" fill="#D9A08A"/>
