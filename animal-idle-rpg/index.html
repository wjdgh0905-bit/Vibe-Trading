<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>모닥불 무리 — 방치형 동물 RPG</title>
<meta name="description" content="밤의 야영지에서 동물 무리를 키워 무한히 이어지는 야생을 정복하는 방치형 RPG." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" />
<style>
/* ── ui.css ── */
/* ══ 모닥불 무리 — 디자인 시스템 ══════════════════════════════════════════
   빛이 닿는 만큼만 존재한다. 단일 세계관(밤)에 커밋한다.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --night:#0E1119; --soot:#1C2331; --ash:#2B3346;
  --ember:#FF9333; --ember-core:#FFE2A6; --ember-deep:#C1391A;
  --moon:#9EB6D6; --firefly:#C7DE7A; --soulfire:#5FD9C4;
  --ink:#E6DCCB; --label:rgba(158,182,214,.62); --dim:rgba(158,182,214,.40);
  --line:rgba(158,182,214,.14); --line-warm:rgba(255,147,51,.22);
  --wl-fire:1;
  --disp:"Hahmlet",'Apple SD Gothic Neo','Malgun Gothic',serif;
  --body:"IBM Plex Sans KR",'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:"IBM Plex Mono","IBM Plex Sans KR",'Malgun Gothic',monospace;
  --gut:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--night); color:var(--ink);
  font-family:var(--body); font-weight:400; font-size:13px; line-height:1.55;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--ember);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500}
.lbl{font-size:10px;font-weight:300;letter-spacing:.09em;color:var(--label)}
.warm{color:var(--ember)} .cool{color:var(--moon)} .soul{color:var(--soulfire)}
.snackc{color:var(--firefly)}

.wrap{max-width:1180px;margin:0 auto;padding:14px var(--gut) 40px}

/* ── 상단 재화 스트립 : 카드가 아니라 한 줄의 재선 ── */
.strip{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:0 2px 9px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:7px;margin-right:auto}
.mark svg{width:19px;height:19px;display:block;
  filter:drop-shadow(0 0 calc(7px*var(--wl-fire)) rgba(255,147,51,.45))}
.mark b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
.res{display:flex;flex-direction:column;gap:1px;min-width:58px}
.res .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;line-height:1.2}
.res.gold .v{color:var(--ember);text-shadow:0 0 calc(9px*var(--wl-fire)) rgba(255,147,51,.35)}
.res.snack .v{color:var(--firefly)} .res.soul .v{color:var(--soulfire)}

/* ── 레이아웃 ── */
.grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,.88fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:900px){ .grid{grid-template-columns:1fr} }

/* ── 무대 ── */
.stage{position:relative;border:1px solid var(--line);background:var(--night);overflow:hidden;border-radius:3px}
.stage.boss{border-color:rgba(193,57,26,.55)}
#scene{display:block;width:100%;aspect-ratio:16/9;min-height:250px}
@media (max-width:560px){ #scene{aspect-ratio:4/3} }
.field{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.actor{position:absolute;transform:translate(-50%,-100%);transition:opacity .3s;will-change:transform}
.actor svg{display:block;overflow:visible}
.tapcatch{position:absolute;inset:0;cursor:crosshair}

/* 무대 오버레이 */
.ov{position:absolute;pointer-events:none}
.ov-zone{left:12px;top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.zname{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
.bname{font-size:11px;color:var(--label)}
.grade{font-size:10px;letter-spacing:.06em;padding:2px 7px;border:1px solid currentColor;border-radius:2px;opacity:.9}
.tierbadge{font-size:10px;letter-spacing:.06em;color:var(--moon);border-bottom:1px solid var(--line);padding-bottom:1px}

.ov-enemy{left:50%;top:8px;transform:translateX(-50%);width:min(440px,72%);text-align:center}
.ename{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:-.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ename .rank{color:var(--moon);font-weight:500}
.etag{display:inline-block;font-size:9.5px;letter-spacing:.12em;padding:1px 5px;margin-left:5px;
  border:1px solid currentColor;vertical-align:2px}
.etag.el{color:var(--firefly)} .etag.bs{color:var(--ember-deep)} .etag.ov{color:var(--soulfire)}
.hp{position:relative;height:7px;margin-top:5px;background:rgba(10,14,22,.72);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.hp i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--ember-deep),var(--ember));transition:transform .1s linear}
.hp b{position:absolute;top:0;bottom:0;width:2px;background:var(--ember-core);box-shadow:0 0 7px var(--ember-core)}
.hptxt{margin-top:3px;font-family:var(--num);font-size:10px;font-weight:500;color:var(--label);font-variant-numeric:tabular-nums}

/* 보스 심지선 : 무대 상단을 타들어간다 */
.fuse{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--ember-core),var(--ember));
  box-shadow:0 0 10px var(--ember);transition:width .12s linear}
.fuse.warn{animation:fusepulse .5s steps(2) infinite}
@keyframes fusepulse{50%{opacity:.35}}

.ov-waves{left:12px;bottom:10px;display:flex;gap:3px;align-items:flex-end}
.wv{width:9px;height:3px;background:var(--ash);border-radius:1px}
.wv.done{background:var(--ember);box-shadow:0 0 6px rgba(255,147,51,.55)}
.wv.cur{background:var(--ember-core);height:5px;box-shadow:0 0 8px var(--ember-core)}
.wv.el{height:6px} .wv.bs{width:13px;height:7px;background:var(--ash)}
.wv.bs.done{background:var(--ember-deep)}

.ov-ctl{right:10px;bottom:9px;display:flex;gap:6px;pointer-events:auto}
.ghost{font-size:10.5px;letter-spacing:.04em;color:var(--label);padding:4px 9px;
  border:1px solid var(--line);background:rgba(14,17,25,.7);border-radius:2px}
.ghost:hover{color:var(--ink);border-color:var(--line-warm)}
.ghost.on{color:var(--ember-core);border-color:var(--line-warm);
  box-shadow:inset 0 -1px 0 var(--ember)}

/* ── 스킬바 ── */
.skills{display:flex;gap:5px;padding:8px 8px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(28,35,49,.35),transparent);overflow-x:auto;scrollbar-width:none}
.skills::-webkit-scrollbar{display:none}
.sk{position:relative;flex:1 0 auto;min-width:66px;padding:6px 8px 7px;text-align:center;
  border:1px solid var(--line);border-radius:2px;background:rgba(14,17,25,.55);overflow:hidden}
.sk .n{font-family:var(--disp);font-weight:500;font-size:11.5px;white-space:nowrap}
.sk .c{font-family:var(--num);font-size:9.5px;color:var(--label);margin-top:1px}
.sk .f{position:absolute;left:0;bottom:0;height:2px;background:var(--firefly);opacity:.85}
.sk.rdy{border-color:var(--line-warm)} .sk.rdy .n{color:var(--ember-core)}
.sk.on{border-color:var(--ember);box-shadow:inset 0 0 14px rgba(255,147,51,.22)}
.sk.on .n{color:var(--ember-core)}
.sk[disabled]{opacity:.38}
.sk .auto{position:absolute;right:3px;top:2px;font-size:8px;letter-spacing:.08em;color:var(--firefly)}

/* ── 우측 장부 ── */
.ledger{border:1px solid var(--line);border-radius:3px;background:
  linear-gradient(180deg,rgba(28,35,49,.5),rgba(14,17,25,.5))}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px 4px 8px;font-size:11.5px;font-weight:400;color:var(--label);
  border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ember-core);border-bottom-color:var(--ember);font-weight:600}
.tab .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--firefly);vertical-align:3px;margin-left:3px}
.body{padding:10px 11px 12px;max-height:min(62vh,620px);overflow-y:auto;scrollbar-width:thin}
@media (max-width:900px){ .body{max-height:none} }

.qbar{display:flex;gap:5px;align-items:center;padding-bottom:9px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.qbar .lbl{margin-right:auto}
.qb{font-size:10.5px;font-family:var(--num);padding:3px 8px;color:var(--label);border:1px solid transparent;border-radius:2px}
.qb.on{color:var(--ember-core);border-color:var(--line-warm)}

/* 동료 행 : 박스가 아니라 재선으로 나뉜다 */
.row{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:none}
.row.locked{opacity:.42}
.por{flex:none;width:46px;height:40px;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.por.emoji{font-size:24px;align-items:center}
.info{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:6px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:-.01em}
.lv{font-family:var(--num);font-size:9.5px;font-weight:600;color:var(--moon);letter-spacing:.02em}
.x2{font-family:var(--num);font-size:9.5px;color:var(--ember);font-weight:600}
.sub{font-size:10.5px;color:var(--label);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .pv{color:var(--firefly)}
.mst{height:2px;background:rgba(158,182,214,.10);margin-top:5px;border-radius:1px;overflow:hidden}
.mst i{display:block;height:100%;background:var(--ember);opacity:.7}
.buy{flex:none;min-width:88px;text-align:right;padding:4px 2px 4px 8px}
.buy .c{font-family:var(--num);font-size:12px;font-weight:600;color:var(--dim)}
.buy .q{font-size:9.5px;color:var(--label);margin-top:1px}
.buy.ok .c{color:var(--ember);text-shadow:0 0 10px rgba(255,147,51,.3)}
.buy.ok{box-shadow:inset 0 -1px 0 var(--ember)}
.buy[disabled]{cursor:not-allowed}

/* 육성 서랍 */
.care{display:none;gap:8px;padding:2px 2px 10px;align-items:center;border-bottom:1px solid var(--line)}
.row.open + .care{display:flex;flex-wrap:wrap}
.bond{flex:1;min-width:120px}
.bond .bar{height:3px;background:rgba(158,182,214,.10);border-radius:1px;overflow:hidden;margin-top:3px}
.bond .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--firefly))}
.care .act{font-size:10.5px;color:var(--label);border:1px solid var(--line);padding:4px 9px;border-radius:2px}
.care .act:hover{color:var(--ink);border-color:var(--line-warm)}
.care .act[disabled]{opacity:.4}
.say{flex-basis:100%;font-size:11px;color:var(--moon);font-style:italic}

/* 일반 정보 블록 */
.note{font-size:11px;color:var(--label);line-height:1.75;padding:9px 10px;margin-bottom:10px;
  border-left:2px solid var(--line-warm);background:rgba(28,35,49,.35)}
.note b{color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:11.5px}
.kv b{font-family:var(--num);font-weight:600}
.big{display:block;width:100%;padding:11px;margin-top:10px;font-family:var(--disp);font-weight:700;font-size:13.5px;
  border:1px solid var(--line-warm);border-radius:2px;color:var(--ember-core);
  background:linear-gradient(180deg,rgba(255,147,51,.14),rgba(193,57,26,.08))}
.big:hover{background:linear-gradient(180deg,rgba(255,147,51,.2),rgba(193,57,26,.12))}
.big[disabled]{opacity:.4;cursor:not-allowed}
.big.soulb{border-color:rgba(95,217,196,.35);color:var(--soulfire);
  background:linear-gradient(180deg,rgba(95,217,196,.12),transparent)}
.big.danger{border-color:rgba(193,57,26,.4);color:#ff9f8c;background:rgba(193,57,26,.1)}

/* 난이도 티어 */
.tier{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tier .ic{font-size:17px;width:22px;text-align:center;flex:none}
.tier .tn{font-family:var(--disp);font-weight:700;font-size:13px}
.tier .td{font-size:10.5px;color:var(--label);margin-top:1px}
.tier .tr{font-family:var(--num);font-size:10px;color:var(--moon);margin-top:3px}
.tier.sel{box-shadow:inset 2px 0 0 currentColor}
.tier.off{opacity:.45;cursor:not-allowed}
.affix{display:flex;gap:7px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line)}
.affix .an{font-family:var(--disp);font-weight:500;font-size:12px;white-space:nowrap}
.affix .ad{font-size:10.5px;color:var(--label)}
.affix.trial .an{color:var(--ember-deep)} .affix.bless .an{color:var(--firefly)}

/* 지도 띠 */
.mapband{display:flex;gap:2px;margin:8px 0 2px}
.mapband i{flex:1;height:14px;border-radius:1px;position:relative}
.mapband i.cur{outline:1px solid var(--ember-core);outline-offset:1px}
.mapband i span{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--num);font-size:8px;color:var(--dim);margin-top:2px}

/* 배너/토스트 */
.ribbons{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:4}
.rib{font-family:var(--disp);font-weight:500;font-size:12px;padding:4px 12px;
  background:rgba(14,17,25,.82);border:1px solid var(--line);border-radius:2px;
  animation:ribIn .3s ease-out, ribOut .5s ease-in 3.1s forwards}
.rib.gold{color:var(--ember-core);border-color:var(--line-warm)}
.rib.good{color:var(--firefly);border-color:rgba(199,222,122,.3)}
.rib.bad{color:#ff9f8c;border-color:rgba(193,57,26,.4)}
.rib.soul{color:var(--soulfire);border-color:rgba(95,217,196,.3)}
@keyframes ribIn{from{opacity:0;transform:translateY(-6px)}}
@keyframes ribOut{to{opacity:0;transform:translateY(-6px)}}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(6,8,13,.78);display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:40;backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:430px;padding:18px 19px 17px;border:1px solid var(--line-warm);border-radius:3px;
  background:linear-gradient(180deg,#1a2030,#0E1119);box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mbox h3{margin:0 0 10px;font-family:var(--disp);font-weight:700;font-size:16px}
.mbox p{margin:0 0 12px;font-size:12.5px;color:var(--ink);line-height:1.8}
.mbox p .num{color:var(--ember)}
.mrow{display:flex;gap:8px}
.mrow .big{margin-top:0}
.foot{margin-top:14px;text-align:center;font-size:10px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="strip">
    <div class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.2c1.9 2.6 3 4.6 3 6.6a3 3 0 0 1-6 0c0-2 1.1-4 3-6.6Z" fill="#FF9333"/>
        <path d="M12 8.4c1 1.5 1.6 2.6 1.6 3.7a1.6 1.6 0 0 1-3.2 0c0-1.1.6-2.2 1.6-3.7Z" fill="#FFE2A6"/>
        <path d="M4.5 20.4 12 16l7.5 4.4" stroke="#2B3346" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <b>모닥불 무리</b>
    </div>
    <div class="res gold"><span class="lbl">발자국</span><span class="v" id="r-gold">0</span></div>
    <div class="res snack"><span class="lbl">간식</span><span class="v" id="r-snack">0</span></div>
    <div class="res"><span class="lbl">초당 피해</span><span class="v" id="r-dps">0</span></div>
    <div class="res soul"><span class="lbl">야생혼</span><span class="v" id="r-soul">0</span></div>
    <div class="res"><span class="lbl">최고 존</span><span class="v" id="r-best">1</span></div>
  </div>

  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <canvas id="scene"></canvas>
        <div class="field" id="field"></div>
        <div class="tapcatch" id="tap"></div>
        <div class="fuse" id="fuse" style="width:0"></div>
        <div class="ribbons" id="ribbons"></div>

        <div class="ov ov-zone">
          <span class="zname" id="o-zone">존 1</span>
          <span class="bname" id="o-biome">이끼 낀 숲</span>
          <span class="grade" id="o-grade">쾌속</span>
          <span class="tierbadge" id="o-tier">🍃 산책</span>
        </div>

        <div class="ov ov-enemy">
          <div class="ename" id="o-ename">숲개미</div>
          <div class="hp"><i id="o-hpfill"></i><b id="o-hpedge" hidden></b></div>
          <div class="hptxt" id="o-hptxt"></div>
        </div>

        <div class="ov ov-waves" id="o-waves"></div>
        <div class="ov ov-ctl">
          <button class="ghost on" id="b-auto">자동 진행</button>
          <button class="ghost" id="b-quality" title="연출 강도">연출 강</button>
        </div>
      </div>
      <div class="skills" id="skillbar"></div>
    </div>

    <div class="ledger">
      <div class="tabs" id="tabs">
        <button class="tab on" data-t="pets">무리</button>
        <button class="tab" data-t="up">강화</button>
        <button class="tab" data-t="diff">시련</button>
        <button class="tab" data-t="asc">환생</button>
        <button class="tab" data-t="log">기록</button>
      </div>
      <div class="body" id="tabbody"></div>
    </div>
  </div>

  <div class="foot">진행은 이 브라우저에 자동 저장됩니다 · 자리를 비운 동안에도 무리는 사냥합니다</div>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
/* ══ roster.js ══ */
/*!
 * WL.Content — 동료 24종 + 적 135행 콘텐츠 데이터
 * 의존성 0. IIFE. window.WL 에 부착. import/export 없음. 최상위 DOM 조작 없음.
 *
 * ─────────────────────────────────────────────────────────────────────────
 * 이 모듈이 하는 일 / 하지 않는 일
 * ─────────────────────────────────────────────────────────────────────────
 * 한다  : 동료·적의 "정체성" 데이터(이름·플레이버·패시브·조형 파라미터)와
 *         결정론적 선택 함수, 패시브 합산 함수.
 * 안 한다: 체력/보상 배율(→ WL.Difficulty), 그리기(→ WL.Creatures), DOM(→ UI).
 *
 * ★ 중요 계약 ★ enemyFor() 는 HP·보상 배율을 일절 곱하지 않는다.
 *   웨이브 종류(kind)만 알려주고, 배율은 WL.Difficulty 가 단독으로 적용한다.
 *   여기서 배율을 한 번 더 곱하면 원장의 E ≤ 2.000 상한이 깨진다.
 *
 * ─────────────────────────────────────────────────────────────────────────
 * 공개 API
 * ─────────────────────────────────────────────────────────────────────────
 * WL.Content = {
 *   VERSION,                       // '1.0.0'
 *
 *   // ── 동료 ──

  /* 최종 PETS — cost/dps 는 여기서 공식으로 생성한다(원본 .map 체인과 동일) */
  var PETS = PET_ROWS.map(function (p, i) {
    var tbl = PASSIVE[i] || {};
    var keys = Object.keys(tbl);
    var main = keys[0];
    var extra = null;
    if (keys.length > 1) {
      extra = {};
      for (var k = 1; k < keys.length; k++) extra[keys[k]] = tbl[keys[k]];
    }
    return {
      i: i,
      id: p.id, ic: p.ic, n: p.n, d: p.d, lore: p.lore,
      species: p.species, personality: p.personality, biome: p.biome,
      cost: 10 * Math.pow(8.8, i),
      dps: 0.8 * Math.pow(9.2, i),
      passive: {
        name: p.pn,
        type: main,
        value: tbl[main],
        extra: extra,
        desc: p.pn + ' — ' + PASSIVE_DESC[i],
        all: tbl
      },
      art: ART[p.species] || null      /* 0~11 은 렌더러가 이미 보유 → null */
    };
  });

  /** 1레벨 이상 보유한 "종" 수 (레벨 합이 아니다) */
  function ownedPets(pets) {
    var c = 0, n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) if (pets[i] > 0) c++;
    return c;
  }

  /**
   * 단일 버킷 합계. 원본 스펙의 petPassive(b) 와 의미가 같다.
   * 'roster' 만 특례: 합계 × 보유 종 수.
   */
  function petPassive(pets, bucket) {
    var v = 0, n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) {
      if (!(pets[i] > 0)) continue;
      var p = PASSIVE[i];
      if (p && p[bucket] !== undefined) v += p[bucket];
    }
    if (bucket === 'roster') v *= ownedPets(pets);
    var meta = BUCKETS[bucket];
    if (meta && meta.cap != null) v = Math.min(v, meta.cap);
    return v;
  }

  /**
   * 전 버킷 합산 + 파생 배율.
   *
   * @param pets  number[] — S.pets (레벨 배열). 길이가 24 미만이어도 안전.
   * @param opt   {upsLuck, upsBless, upsClaw, upsGold, upsFang, slsEcho, skillCdr}
   *              기존 업그레이드 레벨. 공유 상한(치명타 60%, 쿨감 60%)을
   *              정확히 계산하려면 넘겨야 한다. 생략하면 0으로 본다.
   *
   * @return {
   *   owned, raw:{버킷:합계},
   *   // ── 기존 괄호에 "더할" 값 (곱항을 새로 만들지 말 것) ──
   *   blessAdd, clawAdd, goldAdd, fangAdd, luckAdd, echoAdd, snackAdd,
   *   offlineAdd, huntAdd, eliteGoldAdd, pioneerAdd,
   *   // ── 조건부 (조건 만족 시에만 곱한다) ──
   *   lowHpAdd, gripAdd, eliteAdd, shiftAdd, recritP, mercy,
   *   // ── 상한이 적용된 최종값 ──
   *   critChance, critMult, cdrMul,
   *   // ── 요약 배율 (UI 표시용. 업그레이드 레벨 포함) ──
   *   dpsMult, goldMult, bossMult, snackMult, soulMult, offlineMult
   * }
   */
  function petPassives(pets, opt) {
    opt = opt || {};
    var owned = ownedPets(pets);
    var raw = {};
    for (var b in BUCKETS) raw[b] = 0;

    var n = pets ? pets.length : 0;
    for (var i = 0; i < n && i < PET_COUNT; i++) {
      if (!(pets[i] > 0)) continue;
      var p = PASSIVE[i];
      if (!p) continue;
      for (var k in p) if (raw[k] !== undefined) raw[k] += p[k];
    }
    raw.roster *= owned;

    /* 이 모듈이 단독으로 책임지는 상한만 적용 */
    for (var b2 in BUCKETS) {
      var cap = BUCKETS[b2].cap;
      if (cap != null && raw[b2] > cap) raw[b2] = cap;
    }

    var upsLuck  = opt.upsLuck  || 0;
    var upsBless = opt.upsBless || 0;
    var upsClaw  = opt.upsClaw  || 0;
    var upsGold  = opt.upsGold  || 0;
    var upsFang  = opt.upsFang  || 0;
    var slsEcho  = opt.slsEcho  || 0;
    var skillCdr = opt.skillCdr || 0;

    /* 공유 상한 — 업그레이드/스킬과 같은 통에 넣고 한 번만 클램프 */
    var critChance = Math.min(0.60, 0.02 * upsLuck + raw.luck);
    var cdrTotal   = Math.min(0.60, raw.cdr + skillCdr);

    /* bless 와 roster 는 "같은 가산 버킷". 곱연산으로 분리하지 말 것. */
    var blessAdd = raw.bless + raw.roster;

    return {
      owned: owned,
      raw: raw,

      blessAdd: blessAdd,
      clawAdd: raw.claw,
      goldAdd: raw.gold,
      fangAdd: raw.fang,
      luckAdd: raw.luck,
      echoAdd: raw.echo,
      snackAdd: raw.snack,
      offlineAdd: raw.offline,
      huntAdd: raw.hunt,
      eliteGoldAdd: raw.eliteGold,
      pioneerAdd: raw.pioneer,

      lowHpAdd: raw.lowHp,
      gripAdd: raw.grip,
      eliteAdd: raw.elite,
      shiftAdd: raw.shift,
      recritP: clamp(raw.recrit, 0, 1),
      mercy: raw.mercy > 0 ? 1 : 0,

      critChance: critChance,
      critMult: 5 + raw.critMult,
      cdrMul: 1 - cdrTotal,

      /* 요약 — 상단 스트립/도감 표시용. 실제 전투식은 위의 *Add 를 쓴다. */
      dpsMult: 1 + 0.08 * upsBless + blessAdd,
      goldMult: 1 + 0.12 * upsGold + raw.gold,
      bossMult: 1 + 0.18 * upsFang + raw.fang,
      snackMult: 1 + raw.snack,
      soulMult: 1 + 0.15 * slsEcho + raw.echo,
      offlineMult: 1 + raw.offline,
      clickMult: 1 + 0.35 * upsClaw + raw.claw
    };
  }

  var RANK = ['', '거친 ', '굶주린 ', '사나운 ', '단단한 ', '고대의 ', '광폭한 ',
              '전설의 ', '심연의 ', '초월한 ', '신화의 ', '초신성의 ', '무형의 ', '태초의 '];

  /* ══════════════════════════════════════════════════════════════════════
     5. 결정론적 선택
     ──────────────────────────────────────────────────────────────────────
     NORD: 일반 웨이브(1,2,3,5,6,8,9)에 0..6 순번을 부여한다.
     원안의 (z*7 + w*3) % 8 은 w=1 과 w=9 가 8 차이라 mod 8 에서 반드시
     충돌한다 — 선형 사상으로는 불가능하다. 순번 룩업이 유일한 해법이다.
     ══════════════════════════════════════════════════════════════════════ */
  var NORD = [0, 0, 1, 2, 0, 3, 4, 0, 5, 6];   /* 인덱스 = w (1..9). w4·w7 미사용 */

  function isElite(w) { return w === 4 || w === 7; }
  function isBossWave(w) { return w === 10; }
  function isOverlord(z, w) { return w === 10 && z % 50 === 0; }
  function cycleOf(z) { return Math.floor((z - 1) / 50); }

  function mobIdx(z, w) { return mod(z * 3 + NORD[w], 8); }
  function eliteIdx(z, w) { return mod(z * 5 + (w === 4 ? 0 : 1), 3); }
  function bossIdx(z) { return mod(cycleOf(z), 2); }
  function overlordIdx(z) { return mod(Math.round(z / 50) - 1, OVERLORDS.length); }

  function biomeFor(z) { return BIOMES[mod(Math.floor((z - 1) / 5), BIOMES.length)]; }
  function rankOf(z) { return clamp(Math.floor((z - 1) / 18), 0, RANK.length - 1); }

  function waveKind(z, w) {
    if (isOverlord(z, w)) return 'overlord';
    if (isBossWave(w)) return 'boss';
    if (isElite(w)) return 'elite';
    return 'mob';
  }

  /* 종류별 렌더 크기 배수 — 전투력이 아니라 "눈에 보이는 위압" 전용 */
  var SIZE_MUL = { mob: 1.00, elite: 1.22, boss: 1.55, overlord: 1.90 };
  var GLOW = { mob: 0, elite: 0.18, boss: 0.45, overlord: 0.85 };

  /**
   * 결정론적으로 적 1체를 뽑는다. 같은 (zone, wave) → 항상 같은 적.
   * tier 는 이름/종을 바꾸지 않는다 — 높은 티어에서 발광만 약간 세진다.
   *
   * ★ HP·보상 배율은 여기서 곱하지 않는다. WL.Difficulty 단독 책임.
   */
  function enemyFor(zone, wave, tier) {
    var z = Math.max(1, Math.floor(zone || 1));
    var w = clamp(Math.floor(wave || 1), 1, 10);
    var t = clamp(Math.floor(tier || 0), 0, 4);

    var kind = waveKind(z, w);
    var b = biomeFor(z);
    var r = rankOf(z);
    var row, title = null;

    if (kind === 'overlord')   row = OVERLORDS[overlordIdx(z)];
    else if (kind === 'boss')  row = b.bosses[bossIdx(z)];
    else if (kind === 'elite') { row = b.elites[eliteIdx(z, w)]; title = row.title; }
    else                       row = b.mobs[mobIdx(z, w)];

    /* 고유명(대군주)은 접두사를 붙이지 않는다.
       RANK 는 "같은 종이 깊은 곳에서 더 사나워진다"를 말하는 장치인데,
       대군주는 애초에 한 번씩만 나타나는 고유 개체다. 게다가 r=13('태초의')
       + '최초의 짐승' 처럼 같은 형태소가 겹쳐 한국어가 무너지는 조합이 나온다. */
    var px = row.unique ? '' : RANK[r];
    var name = px + row.n + (title ? ' 〈' + title + '〉' : '');
    var glow = GLOW[kind] + 0.04 * t;

    return {
      kind: kind,
      boss: kind === 'boss' || kind === 'overlord',
      elite: kind === 'elite',
      ic: row.ic,
      name: name,
      baseName: row.n,
      title: title,
      rank: r,
      rankName: px.trim(),
      biome: { i: b.i, n: b.n, tint: b.tint },
      archetype: row.a,
      palette: row.palette,
      sizeMul: SIZE_MUL[kind],
      glow: glow,
      tier: t,
      /* WL.Creatures.make() 에 그대로 넘길 수 있는 형태.
         renderer 의 tier 는 0..10 이므로 RANK(0..13) 를 클램프한다. */
      art: {
        species: row.a,
        tier: Math.min(10, r),
        coat: row.palette,
        tint: b.tint,
        glow: glow,
        seed: z * 1000 + w
      }
    };
  }

  /* ══════════════════════════════════════════════════════════════════════
     6. UI 최소 헬퍼
     ══════════════════════════════════════════════════════════════════════ */

  /** '🦷 산의 왕 — 보스에게 주는 피해 +10%' */
  function passiveLine(i) {
    var p = PETS[i];
    return p ? p.ic + ' ' + p.passive.desc : '';
  }

  /** 로그 한 줄용 이름 (이모지 포함) */
  function enemyLabel(e) { return e ? e.ic + ' ' + e.name : ''; }

  /**
   * enemyFor() 결과 → WL.Creatures.make() opts.
   * 렌더러가 없으면 호출부가 ic 이모지로 폴백하면 된다.
   */
  function creatureOpts(e, size) {
    var s = size || 96;
    return {
      species: e.art.species,
      tier: e.art.tier,
      size: s * e.sizeMul,
      fit: 'scene',
      flip: true,
      tint: e.art.tint,
      glow: e.art.glow,
      seed: e.art.seed,
      coat: e.art.coat
    };
  }

  /* ══════════════════════════════════════════════════════════════════════
     7. 부착
     ══════════════════════════════════════════════════════════════════════ */
  W.Content = {
    VERSION: VERSION,

    PETS: PETS,
    PET_COUNT: PET_COUNT,
    PASSIVE: PASSIVE,
    BUCKETS: BUCKETS,
    petPassive: petPassive,
    petPassives: petPassives,
    ownedPets: ownedPets,
    petCost: petCost,
    petBaseDps: petBaseDps,

    BIOMES: BIOMES,
    OVERLORDS: OVERLORDS,
    RANK: RANK,
    ARCHETYPES: ARCHETYPES,
    NORD: NORD,
    SIZE_MUL: SIZE_MUL,

    enemyFor: enemyFor,
    biomeFor: biomeFor,
    waveKind: waveKind,
    rankOf: rankOf,
    isElite: isElite,
    isBossWave: isBossWave,
    isOverlord: isOverlord,
    mobIdx: mobIdx,
    eliteIdx: eliteIdx,
    bossIdx: bossIdx,
    overlordIdx: overlordIdx,

    passiveLine: passiveLine,
    enemyLabel: enemyLabel,
    creatureOpts: creatureOpts
  };
})();

/* ══════════════════════════════════════════════════════════════════════════
   0. 기본 곡선 — 원본 index.html과 1:1 동일해야 한다
   ══════════════════════════════════════════════════════════════════════════ */

const HP_CAP = 1e300;
const hpCache = [0, 10];
/** 존 기본 체력. zoneHP(1)=10, 이후 존당 ×(1.42 + min(0.26, z×0.0012)) */
function zoneHP(z){
  z = Math.max(1, Math.floor(z));
  if(hpCache[z] !== undefined) return hpCache[z];
  let hp = hpCache[hpCache.length - 1];
  for(let i = hpCache.length; i <= z; i++){
    hp = Math.min(HP_CAP, hp * (1.42 + Math.min(0.26, i * 0.0012)));
    hpCache[i] = hp;
  }
  return hpCache[z];
}

const OVERLORD_EVERY = 50;
const OVERLORD_TIME  = 1.35;   // 대군주 제한시간 배수
const BASE_BOSS_TIME = 30;     // 원본과 동일

/** 웨이브 종류별 배율. hp=체력, gold=발자국, snack=간식 기본치 */
const WAVE = {
  mob:      {hp:1.0, gold:1,  snack:0.8, n:'일반'},
  elite:    {hp:2.2, gold:3,  snack:5,   n:'정예'},
  boss:     {hp:5.5, gold:9,  snack:14,  n:'보스'},
  overlord: {hp:8.8, gold:18, snack:40,  n:'대군주'},
};
const REGION_SNACK = 30;       // 지역 돌파(5존마다) 1회성 간식 계수

const waveHpFactor = w => 1 + (w - 1) * 0.12;

const isBossWave  = w => w === BOSS_WAVE;
const isOverlord  = (z, w) => w === BOSS_WAVE && z % OVERLORD_EVERY === 0;
const isElite     = (z, w) => w === 4 || w === 7;

function waveKind(z, w){
  if(w === BOSS_WAVE) return (z % OVERLORD_EVERY === 0) ? 'overlord' : 'boss';
  if(w === 4 || w === 7) return 'elite';
  return 'mob';
}

/* 적 테이블 인덱스 선택자.
   테이블(지역 10 × 일반8/정예3/보스2 + 대군주 5)은 로스터 모듈이 소유하고,
   '어느 행을 쓸지'만 여기서 결정론적으로 고른다.
   NORD: 일반 웨이브 7개의 순번(0..6). 선형식 (z*a+w*b)%8 로는
   w=1과 w=9가 항상 충돌하므로(차이 8) 순번 룩업이 필수다. */
const NORD = [0, 0, 1, 2, 0, 3, 4, 0, 5, 6];   // 첨자 = wave(1..9), w4·w7은 미사용
const pick = {
  mob:      (z, w) => (z * 3 + NORD[w]) % 8,
  elite:    (z, w) => (z * 5 + (w === 4 ? 0 : 1)) % 3,
  boss:     z => Math.floor((z - 1) / OVERLORD_EVERY) % 2,
  overlord: z => (Math.floor(z / OVERLORD_EVERY) - 1 + 1e9) % 5,
};

/* 존 1개의 단위 합 — 어픽스 시간계수 tf와 보상 중립성의 분모가 된다 */
const UNITS = (function(){
  const u = {hp:{mob:0, elite:0, boss:0}, gold:{mob:0, elite:0, boss:0},
             snack:{mob:0, elite:0, boss:0}, kills:{mob:0, elite:0, boss:0}};
  for(let w = 1; w <= WAVES_PER_ZONE; w++){
    const k = waveKind(1, w);                    // 1존 = 대군주 아님 = 표준 존
    u.hp[k]    += waveHpFactor(w) * WAVE[k].hp;  // 체력은 웨이브 보정을 받는다
    u.gold[k]  += WAVE[k].gold;                  // 발자국은 받지 않는다(원본 규칙)
    u.snack[k] += WAVE[k].snack;
    u.kills[k] += 1;
  }
  const sum = o => o.mob + o.elite + o.boss;
  u.hp.total = sum(u.hp); u.gold.total = sum(u.gold);
  u.snack.total = sum(u.snack); u.kills.total = sum(u.kills);
  return u;
})();
/* → hp {mob:10.240, elite:6.776, boss:11.440, total:28.456}
     gold {7, 6, 9, total:22}   snack {5.6, 10, 14, total:29.6} */

/* ══════════════════════════════════════════════════════════════════════════

      rg : 발자국 ×   rn : 간식 ×   rs : 환생 야생혼 ×
      런타임 지수 연산 없이 상수로 박는다.
   ══════════════════════════════════════════════════════════════════════════ */

  {t:3, k:'frenzy', ic:'🔥', n:'광란', c:'#f08a3c',

   d:'이야기 속 짐승들이 걸어 나온다. 환생의 수확이 30% 두꺼워진다.'},
];
const TIER_MAX = TIERS.length - 1;

function tierOf(t){
  if(t && typeof t === 'object') t = t.tier;
  t = (t | 0);
  return TIERS[t] || TIERS[0];
}

/* ══════════════════════════════════════════════════════════════════════════
   3. 어픽스 8종 — 항상 정확히 시련 1 + 축복 1. 채찍에는 반드시 당근이 붙는다.

   원시 필드(설계자가 손으로 정하는 값)
     dmg     플레이어 피해 배율
     hpMob / hpElite / hpBoss   종류별 체력 배율
     dup     일반 웨이브 1개당 등장 수
     g / sn  발자국·간식 배율 (생략하면 아래 규칙으로 자동 유도)

   파생 필드(코드가 계산 — 하드코딩하지 않는다)
     tf      존 전투시간 배율          = (체력 단위 합 / 기준) / dmg
     bt      보스 제한시간 배율        = hpBoss / dmg      ← 실패율 불변의 근거
     gold/snack {mob,elite,boss}      처치 1회당 자원 배율
     zoneGold / zoneSnack             존 총량 배율

   보상 규칙(시련): 존 총 발자국 = tf  → 초당 발자국 정확히 중립
                   존 총 간식   ≥ tf^1.3 → 간식만 순증
   ══════════════════════════════════════════════════════════════════════════ */

const AFFIX_SRC = [
  /* ── 시련 5 ── */
  {id:'mud',   kind:'trial', ic:'🪨', n:'진흙 발굽', dmg:0.85,
   d:'모든 피해 ×0.85',
   tip:'발이 무거워진 만큼 발자국과 간식이 늘어난다. 시간만 빌려주는 시련.'},
  {id:'plate', kind:'trial', ic:'👑', n:'여왕의 갑주', hpBoss:1.40,
   d:'보스 체력 ×1.40 · 보스 제한시간 ×1.40',
   tip:'체력과 시간이 같이 늘어난다 — 보스 실패 확률은 조금도 변하지 않는다.'},
  {id:'hide',  kind:'trial', ic:'🛡️', n:'두꺼운 가죽', hpMob:1.25, hpElite:1.25,
   d:'일반·정예 체력 ×1.25 (보스 제외)',
   tip:'보스는 멀쩡하다. 잔몹 구간만 길어진다.'},
  {id:'swarm', kind:'trial', ic:'🐜', n:'떼거리', hpMob:0.62, dup:2, sn:1.00,
   d:'일반 웨이브마다 2마리 · 각 체력 ×0.62',
   tip:'처치 수가 두 배라 간식이 더 쌓인다. 콤보를 쌓기에도 좋다.'},
  {id:'mist',  kind:'trial', ic:'☠️', n:'역병 안개', g:0.70, sn:2.50,
   d:'발자국 ×0.70 · 간식 ×2.50',
   tip:'시간 비용 없이 발자국을 간식으로 바꾸는 거래. 티어 보정이 손해를 덮는다.'},
  /* ── 축복 3 ── */
  {id:'rich',  kind:'bless', ic:'💰', n:'황금 발자국', g:1.80,
   d:'발자국 ×1.80',
   tip:'동료를 한 계단 먼저 들이는 구간.'},
  {id:'wind',  kind:'bless', ic:'🌬️', n:'순풍', dmg:1.35,
   d:'모든 피해 ×1.35',
   tip:'유일하게 사냥이 빨라지는 축복. 보스 제한시간도 같이 줄지만 실패율은 그대로다.'},
  {id:'feast', kind:'bless', ic:'🧺', n:'풍요의 계절', sn:2.50,
   d:'간식 ×2.50',
   tip:'교감도를 몰아서 올릴 다섯 존.'},
];

const SNACK_RULE_EXP = 1.3;   // 간식 = tf^1.3

function deriveAffix(src){
  const a = {
    id:src.id, kind:src.kind, ic:src.ic, n:src.n, d:src.d, tip:src.tip,
    dmg:     src.dmg     === undefined ? 1 : src.dmg,
    hpMob:   src.hpMob   === undefined ? 1 : src.hpMob,
    hpElite: src.hpElite === undefined ? 1 : src.hpElite,
    hpBoss:  src.hpBoss  === undefined ? 1 : src.hpBoss,
    dup:     src.dup     === undefined ? 1 : src.dup,
  };
  const U = UNITS.hp;
  /* 존 전투시간 배율: 체력 총량이 늘어난 만큼 + 피해가 줄어든 만큼 */
  a.tf = (U.mob * a.hpMob * a.dup + U.elite * a.hpElite + U.boss * a.hpBoss)
         / U.total / a.dmg;
  /* 보스 제한시간 배율 — 보스 체력비 ÷ 피해비. 이 정의가 '실패율 불변'을 만든다 */
  a.bt = a.hpBoss / a.dmg;

  /* ── 발자국 ── */
  const G = UNITS.gold, K = UNITS.kills;
  if(src.g !== undefined){
    a.gold = {mob:src.g, elite:src.g, boss:src.g};
  } else if(a.kind === 'trial'){
    if(a.dup === 1){
      a.gold = {mob:a.tf, elite:a.tf, boss:a.tf};          // 균일 = tf
    } else {
      /* 처치 수가 늘어난 채널(일반)만 조정해 존 총량을 정확히 tf로 맞춘다 */
      const m = (G.total * a.tf - G.elite - G.boss) / (G.mob * a.dup);
      a.gold = {mob:m, elite:1, boss:1};
    }
  } else {
    a.gold = {mob:1, elite:1, boss:1};
  }

  /* ── 간식 ── */
  if(src.sn !== undefined){
    a.snack = {mob:src.sn, elite:src.sn, boss:src.sn};
  } else if(a.kind === 'trial'){
    const target = Math.pow(a.tf, SNACK_RULE_EXP);
    if(a.dup === 1){
      a.snack = {mob:target, elite:target, boss:target};
    } else {
      const S = UNITS.snack;
      const m = (S.total * target - S.elite - S.boss) / (S.mob * a.dup);
      a.snack = {mob:m, elite:1, boss:1};
    }
  } else {
    a.snack = {mob:1, elite:1, boss:1};
  }

  /* 존 총량 배율 (검증·UI용) */
  const zone = (per, unit) =>
    (unit.mob * a.dup * per.mob + unit.elite * per.elite + unit.boss * per.boss) / unit.total;
  a.zoneGold  = zone(a.gold,  G);
  a.zoneSnack = zone(a.snack, UNITS.snack);
  a.snackFloor = Math.pow(a.tf, SNACK_RULE_EXP);
  return a;
}

const AFFIXES = AFFIX_SRC.map(deriveAffix);
const AFFIX_BY_ID = {};
AFFIXES.forEach(a => { AFFIX_BY_ID[a.id] = a; });
const TRIALS  = AFFIXES.filter(a => a.kind === 'trial');
const BLESSES = AFFIXES.filter(a => a.kind === 'bless');

/* ── 결정론적 선택: 5존마다(지역 교체와 동기) 재추첨 ─────────────────────
   순수 함수이므로 '아직 가 보지 않은 존'의 어픽스도 미리 계산된다.        */
const AFFIX_BLOCK = 5;
const DEFAULT_SEED = 1;

function hash32(a, b){
  let h = (Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663)) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

function affixesFor(zone, tier, seed){
  const T = tierOf(tier);
  if(!T.affix) return [];
  const blk = Math.floor((Math.max(1, Math.floor(zone)) - 1) / AFFIX_BLOCK);
  const sd  = (seed === undefined || seed === null || !isFinite(seed)) ? DEFAULT_SEED : (seed | 0);
  return [
    TRIALS [hash32(blk, sd) % TRIALS.length],
    BLESSES[hash32(blk, sd + 7) % BLESSES.length],
  ];
}

/** 어픽스 배열을 어떤 형태로 받아도(객체/아이디/미지정) 정규화한다 */
function normAffixes(ctx){
  if(ctx && ctx.affixes){
    const out = [];
    for(const x of ctx.affixes){
      const a = (typeof x === 'string') ? AFFIX_BY_ID[x] : x;
      if(a && a.id) out.push(a);
    }
    return out;
  }
  return affixesFor(ctx && ctx.zone !== undefined ? ctx.zone : 1,
                    ctx && ctx.tier, ctx && ctx.seed);
}
const affixMul = (list, field) => list.reduce((m, a) => m * (a[field] === undefined ? 1 : a[field]), 1);
const affixMulK = (list, field, kind) =>
  list.reduce((m, a) => m * ((a[field] && a[field][kind] !== undefined) ? a[field][kind] : 1), 1);

/* ══════════════════════════════════════════════════════════════════════════
   4. 유효 난이도 E — 존 하나를 비우는 데 걸리는 시간의 배율. 상한 2.000
   ══════════════════════════════════════════════════════════════════════════ */

function E(zone, tier, seed){
  return tierOf(tier).hp * affixMul(affixesFor(zone, tier, seed), 'tf');
}

/** 이 티어에서 나올 수 있는 최악의 E */
function worstE(tier){
  let worst = 1;
  const T = tierOf(tier);
  if(!T.affix) return T.hp;
  for(const tr of TRIALS) for(const bl of BLESSES)
    worst = Math.max(worst, tr.tf * bl.tf);
  return T.hp * worst;
}

/* ══════════════════════════════════════════════════════════════════════════
   5. 적 보정
   ══════════════════════════════════════════════════════════════════════════ */

/**
 * @param {number|null} baseHP  웨이브 보정까지 끝난 순수 기본 체력
 *                              = zoneHP(z) × (1 + (w-1)×0.12).
 *                              null이면 zone/wave로 직접 계산한다.
 *                              (종류 배율 ×2.2/×5.5/×8.8은 이 함수가 붙인다)
 * @param {object} ctx {zone, wave, tier, seed, affixes, kind, isBoss, hunt, petHunt}
 */
function applyToEnemy(baseHP, ctx){
  ctx = ctx || {};
  const z = Math.max(1, Math.floor(ctx.zone === undefined ? 1 : ctx.zone));
  const w = Math.min(WAVES_PER_ZONE, Math.max(1, Math.floor(ctx.wave === undefined ? 1 : ctx.wave)));
  let kind = ctx.kind;
  if(!kind || !WAVE[kind]){
    kind = (ctx.isBoss === true && ctx.wave === undefined) ? 'boss' : waveKind(z, w);
  }
  const T  = tierOf(ctx.tier);
  const ax = normAffixes({zone:z, tier:ctx.tier, seed:ctx.seed, affixes:ctx.affixes});

  const base = (baseHP === undefined || baseHP === null || !isFinite(baseHP))
             ? zoneHP(z) * waveHpFactor(w) : baseHP;

  const hpField = kind === 'mob' ? 'hpMob' : kind === 'elite' ? 'hpElite' : 'hpBoss';
  const affixHP = affixMul(ax, hpField);
  const hpMult  = WAVE[kind].hp * T.hp * affixHP;

  const boss = (kind === 'boss' || kind === 'overlord');
  return {
    kind: kind,
    zone: z, wave: w, tier: T.t,
    hp: Math.min(HP_CAP, base * hpMult),
    hpMult: hpMult,
    count: (kind === 'mob') ? Math.round(affixMul(ax, 'dup')) : 1,
    playerDmgMult: affixMul(ax, 'dmg'),
    timeLimit: boss ? bossTimeFor({zone:z, wave:w, tier:ctx.tier, seed:ctx.seed,
                                   affixes:ax, hunt:ctx.hunt, petHunt:ctx.petHunt}) : 0,
    goldMult:  affixMulK(ax, 'gold',  kind === 'overlord' ? 'boss' : kind),
    snackMult: affixMulK(ax, 'snack', kind === 'overlord' ? 'boss' : kind),
    affixes: ax.map(a => a.id),
  };
}

function enemyMaxHP(zone, wave, opts){
  opts = opts || {};
  return applyToEnemy(null, {zone:zone, wave:wave, tier:opts.tier,
                             seed:opts.seed, affixes:opts.affixes}).hp;
}

/**
 * 보스 제한시간(초).
 * (30 + 4×보스사냥꾼 + 동료 hunt) × 티어 hp × 어픽스 bt × (대군주 ? 1.35 : 1)
 * 티어 hp가 체력과 시간에 '같이' 곱해지는 것이 난이도 절벽 제거의 핵심이다.
 */
function bossTimeFor(opts){
  opts = opts || {};
  const z = Math.max(1, Math.floor(opts.zone === undefined ? 1 : opts.zone));
  const w = opts.wave === undefined ? BOSS_WAVE : opts.wave;
  const T = tierOf(opts.tier);
  const ax = normAffixes({zone:z, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  const base = BASE_BOSS_TIME + 4 * (opts.hunt || 0) + (opts.petHunt || 0);
  return base * T.hp * affixMul(ax, 'bt') * (isOverlord(z, w) ? OVERLORD_TIME : 1);
}

/* ══════════════════════════════════════════════════════════════════════════
   6. 보상
      발자국 = zoneHP × 0.09 × 종류배율 × 티어 rg × 어픽스 × goldMult()
      간식   = 기본치 × √B(z) × 티어 rn × 어픽스 × (1 + 동료 snack)
      B(z) = 절대 심도. 플레이어 강함과 무관하므로 저존 눌러앉기가 이득이 될 수 없다.
   ══════════════════════════════════════════════════════════════════════════ */

const GOLD_K   = 0.09;
const DEPTH_LEN = 15;
const depth  = z => 1 + Math.floor((Math.max(1, Math.floor(z)) - 1) / DEPTH_LEN);
const depthS = z => Math.sqrt(depth(z));

/**
 * 처치 1회분 보상.
 * @param ctx {
 *   zone, wave,                  필수
 *   tier, seed,                  난이도 / 어픽스 시드
 *   kind,                        생략 시 waveKind로 판정
 *   goldMult   = 1,              호스트 goldMult() (사냥 본능·황금 심장·황금 사냥)
 *   snackBonus = 0,              petPassive('snack')  가산
 *   eliteGold  = 0,              petPassive('eliteGold')  정예 전용 가산
 *   pioneer    = 0,              petPassive('pioneer')    최고 존 갱신 보스 가산
 *   newBest    = false           이 보스가 최고 존 갱신분인가 (zone > state.bestBeaten)
 * }
 * @returns {gold, snack, kind, zoneHP, depth, tierGold, tierSnack, affixes}
 */
function rewardFor(ctx){
  ctx = ctx || {};
  const z = Math.max(1, Math.floor(ctx.zone === undefined ? 1 : ctx.zone));
  const w = Math.min(WAVES_PER_ZONE, Math.max(1, Math.floor(ctx.wave === undefined ? 1 : ctx.wave)));
  const kind = (ctx.kind && WAVE[ctx.kind]) ? ctx.kind : waveKind(z, w);
  const T  = tierOf(ctx.tier);
  const ax = normAffixes({zone:z, tier:ctx.tier, seed:ctx.seed, affixes:ctx.affixes});
  const ch = (kind === 'overlord') ? 'boss' : kind;

  let gm = WAVE[kind].gold * T.rg * affixMulK(ax, 'gold', ch)
         * (ctx.goldMult === undefined ? 1 : ctx.goldMult);
  if(kind === 'elite')                      gm *= 1 + (ctx.eliteGold || 0);
  if((kind === 'boss' || kind === 'overlord') && ctx.newBest) gm *= 1 + (ctx.pioneer || 0);

  const snack = WAVE[kind].snack * depthS(z) * T.rn * affixMulK(ax, 'snack', ch)
              * (1 + (ctx.snackBonus || 0));

  return {
    kind: kind, zone: z, wave: w,
    gold:  Math.min(HP_CAP, zoneHP(z) * GOLD_K * gm),
    snack: snack,
    zoneHP: zoneHP(z), depth: depth(z),
    tierGold: T.rg, tierSnack: T.rn,
    affixes: ax.map(a => a.id),
  };
}

/** 지역 돌파(5존마다, z%5===1 진입 시) 1회성 간식 */
function regionReward(zone, opts){
  opts = opts || {};
  const T = tierOf(opts.tier);
  const ax = normAffixes({zone:zone, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  return {
    snack: REGION_SNACK * depthS(zone) * T.rn * affixMulK(ax, 'snack', 'boss')
         * (1 + (opts.snackBonus || 0)),
  };
}

/** 환생 야생혼 배율 (soulGain에 곱한다) */
const soulMult = t => tierOf(t).rs;

/** 존 1개 총량 — 중립성 검증과 티어 비교 UI에 쓴다 (대군주 제외한 표준 존) */
function zoneReward(zone, opts){
  opts = opts || {};
  let gold = 0, snack = 0;
  for(let w = 1; w <= WAVES_PER_ZONE; w++){
    const kind = waveKind(1, w);                       // 표준 존
    const mod  = applyToEnemy(null, {zone:zone, wave:w, tier:opts.tier,
                                     seed:opts.seed, affixes:opts.affixes, kind:kind});
    const r = rewardFor({zone:zone, wave:w, kind:kind, tier:opts.tier, seed:opts.seed,
                         affixes:opts.affixes, goldMult:opts.goldMult,
                         snackBonus:opts.snackBonus, eliteGold:opts.eliteGold});
    gold  += r.gold  * mod.count;
    snack += r.snack * mod.count;
  }
  return {gold:gold, snack:snack, E:E(zone, opts.tier, opts.seed)};
}

/* ══════════════════════════════════════════════════════════════════════════
   7. 벽 지수 W — 표시 전용. 보상에는 절대 관여하지 않는다.
      W = 보스 체력 / (실사용 DPS) / 보스 제한시간
      W ≥ 1.00 이면 '제한시간 안에 물리적으로 못 잡는다'. 지표가 곧 벽의 정의다.

      ※ 티어·어픽스는 체력과 시간에 같은 계수로 곱해지므로 W에서 상쇄된다.
        즉 난이도를 올려도 벽의 '위치'는 그대로고 소요 시간만 늘어난다 —
        그것이 이 설계의 논지이며, soak 값이 그 변화를 대신 보여준다.
   ══════════════════════════════════════════════════════════════════════════ */

const GRADES = [
  {k:'calm',  max:0.08,     n:'무풍', c:'#5ec8f0'},
  {k:'fair',  max:0.20,     n:'순조', c:'#54c98a'},
  {k:'tense', max:0.40,     n:'긴장', c:'#e0c344'},
  {k:'tight', max:0.65,     n:'팽팽', c:'#e8a93a'},
  {k:'harsh', max:1.00,     n:'험난', c:'#f08a3c'},
  {k:'wall',  max:Infinity, n:'불가', c:'#a02c4a'},
];
const gradeOf = idx => {
  for(let i = 0; i < GRADES.length; i++) if(idx < GRADES[i].max) return GRADES[i];
  return GRADES[GRADES.length - 1];
};

/**
 * 체감 난이도.
 * @param zone
 * @param playerDps   동료 총 DPS (totalDps() — 자동터치 제외한 값)
 * @param opts {tier, seed, autoRatio, bossMult, hunt, petHunt, affixes}
 * @returns {index, grade, gradeIndex, name, color, fill, ttk, soak, E, clearDps}
 */
function ratingOf(zone, playerDps, opts){
  opts = opts || {};
  const z = Math.max(1, Math.floor(zone));
  const w = BOSS_WAVE;
  const ax = normAffixes({zone:z, tier:opts.tier, seed:opts.seed, affixes:opts.affixes});
  const mod = applyToEnemy(null, {zone:z, wave:w, tier:opts.tier, seed:opts.seed, affixes:ax});
  const t   = bossTimeFor({zone:z, wave:w, tier:opts.tier, seed:opts.seed, affixes:ax,
                           hunt:opts.hunt, petHunt:opts.petHunt});

  /* 실사용 DPS = 동료 DPS × (1 + 자동터치 비율) × 보스 피해 × 어픽스 피해 */
  const eff = Math.max(0, playerDps || 0)
            * (1 + (opts.autoRatio || 0))
            * (opts.bossMult === undefined ? 1 : opts.bossMult)
            * mod.playerDmgMult;

  const index = eff > 0 ? (mod.hp / eff / Math.max(t, 1e-9)) : Infinity;
  const g = gradeOf(index);

  /* 존 전체 소요 시간(초) — 티어·어픽스에 따라 실제로 변하는 값 */
  let soak = 0;
  if(eff > 0){
    const effZone = Math.max(0, playerDps || 0) * (1 + (opts.autoRatio || 0)) * mod.playerDmgMult;
    for(let ww = 1; ww <= WAVES_PER_ZONE; ww++){
      const m = applyToEnemy(null, {zone:z, wave:ww, tier:opts.tier, seed:opts.seed, affixes:ax});
      const d = (m.kind === 'boss' || m.kind === 'overlord')
              ? effZone * (opts.bossMult === undefined ? 1 : opts.bossMult) : effZone;
      soak += (m.hp * m.count) / Math.max(d, 1e-9);
    }
  } else soak = Infinity;

  return {
    zone: z,
    index: index,
    grade: g, gradeIndex: GRADES.indexOf(g), name: g.n, color: g.c,
    fill: Math.max(0, Math.min(1, index)),          // 게이지 0~1 (1.0 지점이 눈금)
    ttk: eff > 0 ? mod.hp / eff : Infinity,         // 보스 처치 소요(초)
    soak: soak,                                     // 존 전체 소요(초)
    clearDps: mod.hp / Math.max(t, 1e-9) / Math.max(mod.playerDmgMult, 1e-9),
    E: E(z, opts.tier, opts.seed),
    affixes: ax.map(a => a.id),
    overlord: isOverlord(z, w),
  };
}

/** 앞뒤 존 색 띠(#ui-map)용. 기본 −8 ~ +11 존 */
function forecast(zone, playerDps, opts){
  opts = opts || {};
  const back = opts.back === undefined ? 8 : opts.back;
  const fwd  = opts.fwd  === undefined ? 11 : opts.fwd;
  const from = Math.max(1, Math.floor(zone) - back);
  const to   = Math.floor(zone) + fwd;
  const log  = opts.wallLog || {};
  const out  = [];
  for(let z = from; z <= to; z++){
    const r = ratingOf(z, playerDps, opts);
    out.push({
      zone: z, color: r.color, name: r.name, gradeIndex: r.gradeIndex,
      index: r.index, cur: z === Math.floor(zone),
      region: z % AFFIX_BLOCK === 1, overlord: isOverlord(z, BOSS_WAVE),
      fails: log[z] || 0,
      affixes: r.affixes,
    });
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   8. 상태 · 해금 · 마이그레이션
   ══════════════════════════════════════════════════════════════════════════ */

const FIELDS = ['tier', 'affixSeed', 'snack', 'bestBeaten', 'tierBest', 'wallLog'];
const WALLLOG_KEEP = 40;

const newState = () => ({
  tier: 0, affixSeed: DEFAULT_SEED, snack: 0, bestBeaten: 1,
  tierBest: {}, wallLog: {},
});

/** 해금 판정. state = {best, ascs} */
function unlocked(state){
  const best = (state && state.best) || 1;
  const ascs = (state && state.ascs) || 0;
  const list = TIERS.map(T => {
    const zOK = best >= T.zone, aOK = ascs >= T.asc;
    let reason = '';
    if(!zOK && !aOK)      reason = '환생 ' + T.asc + '회 + 최고 존 ' + T.zone + ' 필요';
    else if(!zOK)         reason = '최고 존 ' + T.zone + ' 필요 (현재 ' + best + ')';
    else if(!aOK)         reason = '환생 ' + T.asc + '회 필요 (현재 ' + ascs + ')';
    return {tier:T.t, ok:zOK && aOK, reason:reason, zone:T.zone, asc:T.asc};
  });
  let max = 0;
  for(const r of list) if(r.ok) max = Math.max(max, r.tier);
  return {max:max, list:list, next:list.find(r => !r.ok) || null};
}

const tierUnlocked = (t, state) => unlocked(state).list[tierOf(t).t].ok;

/** 난이도 변경. 해금되지 않았으면 false를 반환하고 아무것도 바꾸지 않는다 */
function setTier(state, t){
  if(!state) return false;
  const T = TIERS[t | 0];
  if(!T) return false;
  if(!tierUnlocked(T.t, state)) return false;
  state.tier = T.t;
  return true;
}

function trimWallLog(state){
  const keys = Object.keys(state.wallLog);
  if(keys.length <= WALLLOG_KEEP) return;
  keys.sort((a, b) => (+b) - (+a));
  const next = {};
  for(let i = 0; i < WALLLOG_KEEP; i++) next[keys[i]] = state.wallLog[keys[i]];
  state.wallLog = next;
}

/**
 * 기존 세이브에 난이도 필드를 얹는다. 자기 소유 키만 건드린다(멱등).
 * v1 세이브는 tier=0(E=1.000)으로 진입 → 기존 플레이어는 체감 변화가 없다.
 */
function migrate(save){
  const S = save || {};
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

  S.tier = num(S.tier, 0) | 0;
  if(!TIERS[S.tier]) S.tier = 0;
  S.affixSeed  = num(S.affixSeed, DEFAULT_SEED) | 0;
  S.snack      = Math.max(0, num(S.snack, 0));
  S.bestBeaten = Math.max(1, num(S.bestBeaten, 1) | 0);
  S.tierBest   = obj(S.tierBest);
  S.wallLog    = obj(S.wallLog);

  /* 해금되지 않은 티어로 저장된 세이브는 가능한 최고 티어로 내린다 */
  const mx = unlocked(S).max;
  if(S.tier > mx) S.tier = mx;

  trimWallLog(S);
  if(!(num(S.v, 1) >= 2)) S.v = 2;
  return S;
}

/** 보스를 실제로 잡았을 때. bestBeaten·tierBest 갱신 (보상 지급 뒤에 호출) */
function recordBest(state, zone, kind){
  if(!state) return;
  const z = Math.floor(zone);
  if(kind === 'boss' || kind === 'overlord' || kind === undefined)
    state.bestBeaten = Math.max(state.bestBeaten || 1, z);
  const t = String(state.tier | 0);
  state.tierBest = state.tierBest || {};
  state.tierBest[t] = Math.max(state.tierBest[t] || 1, z);
}

/** 보스 제한시간 초과. 지도 띠의 💀 표시용 */
function recordBossFail(state, zone){
  if(!state) return;
  state.wallLog = state.wallLog || {};
  const k = String(Math.floor(zone));
  state.wallLog[k] = (state.wallLog[k] || 0) + 1;
  trimWallLog(state);
}

/* ══════════════════════════════════════════════════════════════════════════
   9. UI 헬퍼 (문자열만 만든다 — DOM은 건드리지 않는다)
   ══════════════════════════════════════════════════════════════════════════ */

const x = v => '×' + (v >= 10 ? v.toFixed(1) : v.toFixed(2));

function describeTier(t){
  const T = tierOf(t);
  return {
    tier:T.t, key:T.k, icon:T.ic, name:T.n, color:T.c, desc:T.d,
    label: T.ic + ' ' + T.n,
    hp:    '적 체력 ' + x(T.hp),
    gold:  '발자국 ' + x(T.rg),
    snack: '간식 ' + x(T.rn),
    soul:  '환생 야생혼 ' + x(T.rs),
    line:  '발자국 ' + x(T.rg) + ' · 간식 ' + x(T.rn) + ' · 야생혼 ' + x(T.rs),
    perSec:'초당 발자국 ' + x(T.rg / T.hp) + ' · 초당 간식 ' + x(T.rn / T.hp),
    bossTime: Math.round(BASE_BOSS_TIME * T.hp) + '초',
    slots: T.slots,
    need:  T.zone === 0 && T.asc === 0 ? '기본 해금'
         : T.asc === 0 ? '최고 존 ' + T.zone
         : '환생 ' + T.asc + '회 + 최고 존 ' + T.zone,
  };
}

function describeAffix(a){
  const A = (typeof a === 'string') ? AFFIX_BY_ID[a] : a;
  if(!A) return null;
  return {
    id:A.id, kind:A.kind, icon:A.ic, name:A.n, desc:A.d, tip:A.tip,
    label: A.ic + ' ' + A.n,
    badge: A.kind === 'trial' ? '시련' : '축복',
    reward: A.kind === 'trial'
      ? '발자국 ' + x(A.zoneGold) + ' · 간식 ' + x(A.zoneSnack)
      : A.d,
    time: A.tf > 1 ? '사냥 시간 ' + x(A.tf)
        : A.tf < 1 ? '사냥 시간 ' + x(A.tf) + ' (단축)'
        : '사냥 시간 변화 없음',
  };
}

/* ══════════════════════════════════════════════════════════════════════════
   10. 자체 검증 — 설계 불변식이 코드와 어긋나면 즉시 잡는다
   ══════════════════════════════════════════════════════════════════════════ */

function selfTest(){
  const fails = [];
  const near = (a, b, eps, msg) => { if(!(Math.abs(a - b) <= eps)) fails.push(msg + ' (' + a + ' vs ' + b + ')'); };
  const ok   = (c, msg) => { if(!c) fails.push(msg); };

  /* 1. 존 단위 합 */
  near(UNITS.hp.total, 28.456, 1e-9, '존 체력 단위 합');
  near(UNITS.gold.total, 22, 1e-9, '존 발자국 단위 합');

  /* 2. E 상한 */
  let emax = 0;
  for(const T of TIERS) emax = Math.max(emax, worstE(T.t));
  ok(emax <= 2.0, 'E 상한 초과: ' + emax);
  near(emax, 1.7882352941, 1e-6, 'E 최댓값');

  /* 3. 시련 보상 규칙 */
  for(const a of TRIALS){
    if(a.id === 'mist') continue;                       // 명시적 예외(자원 교환)
    near(a.zoneGold, a.tf, 1e-9, a.n + ' 초당 발자국 중립');
    ok(a.zoneSnack >= a.snackFloor - 1e-9, a.n + ' 간식 하한');
  }

  /* 4. T1+ 어떤 조합도 T0보다 나쁘지 않다 */
  for(let t = 1; t < TIERS.length; t++){
    for(const tr of TRIALS) for(const bl of BLESSES){
      const tf = tr.tf * bl.tf;
      const g  = TIERS[t].rg * tr.zoneGold  * bl.zoneGold  / tf;
      const s  = TIERS[t].rn * tr.zoneSnack * bl.zoneSnack / tf;
      ok(g >= 1, 'T' + t + ' ' + tr.n + '+' + bl.n + ' 초당 발자국 < T0');
      ok(s >= 1, 'T' + t + ' ' + tr.n + '+' + bl.n + ' 초당 간식 < T0');
    }
  }

  /* 5. 보스 실패 문턱 DPS 불변 */
  const ref = ratingOf(60, 1e6, {tier:0}).clearDps;
  for(let t = 0; t < TIERS.length; t++)
    for(let s = 1; s <= 6; s++){
      const c = ratingOf(60, 1e6, {tier:t, seed:s}).clearDps;
      near(c / ref, 1, 1e-9, 'T' + t + ' seed' + s + ' 보스 문턱 DPS 불변');
    }

  /* 6. 웨이브 구성 */
  let m = 0, e = 0, b = 0;
  for(let w = 1; w <= 10; w++){ const k = waveKind(7, w); if(k === 'mob') m++; else if(k === 'elite') e++; else b++; }
  ok(m === 7 && e === 2 && b === 1, '웨이브 구성 7/2/1');

  return {ok: fails.length === 0, fails: fails, E_max: emax};
}

/* ══════════════════════════════════════════════════════════════════════════ */

WL.Difficulty = {
  VERSION: '2.0.0',

  /* 데이터 */
  TIERS: TIERS, AFFIXES: AFFIXES, TRIALS: TRIALS, BLESSES: BLESSES,
  AFFIX_BY_ID: AFFIX_BY_ID, GRADES: GRADES, WAVE: WAVE, UNITS: UNITS,
  WAVES_PER_ZONE: WAVES_PER_ZONE, BOSS_WAVE: BOSS_WAVE, ELITE_WAVES: ELITE_WAVES,
  OVERLORD_EVERY: OVERLORD_EVERY, OVERLORD_TIME: OVERLORD_TIME,
  BASE_BOSS_TIME: BASE_BOSS_TIME, AFFIX_BLOCK: AFFIX_BLOCK,
  DEFAULT_SEED: DEFAULT_SEED, GOLD_K: GOLD_K, REGION_SNACK: REGION_SNACK,
  FIELDS: FIELDS, TIER_MAX: TIER_MAX,

  /* 곡선 */
  zoneHP: zoneHP, waveHpFactor: waveHpFactor,
  depth: depth, depthS: depthS,

  /* 웨이브 구조 */
  waveKind: waveKind, isElite: isElite, isBossWave: isBossWave, isOverlord: isOverlord,
  pick: pick, NORD: NORD,

  /* 난이도 */
  tierOf: tierOf, affixesFor: affixesFor, affixMul: affixMul,
  E: E, worstE: worstE,
  applyToEnemy: applyToEnemy, enemyMaxHP: enemyMaxHP, bossTimeFor: bossTimeFor,

  /* 보상 */
  rewardFor: rewardFor, regionReward: regionReward, zoneReward: zoneReward,
  soulMult: soulMult,

  /* 체감 난이도 */
  ratingOf: ratingOf, forecast: forecast, gradeOf: gradeOf,

  /* 상태 */
  newState: newState, migrate: migrate, unlocked: unlocked,
  tierUnlocked: tierUnlocked, setTier: setTier,
  recordBest: recordBest, recordBossFail: recordBossFail,

  /* UI 헬퍼 */
  describeTier: describeTier, describeAffix: describeAffix,

  /* 검증 */
  selfTest: selfTest, hash32: hash32,
};

if(typeof module !== 'undefined' && module.exports) module.exports = WL.Difficulty;

})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ============================================================================
 * WL.Creatures — 모닥불 무리: 파라메트릭 SVG 생물 렌더러
 * 의존성 0 · IIFE · window.WL 에 부착 · 최상위에서 DOM 안 건드림
 * ----------------------------------------------------------------------------
 * 공개 API
 * ----------------------------------------------------------------------------
 *   WL.Creatures.SPECIES
 *     { [id]: spec }  — 종 카탈로그(읽기 전용으로 쓸 것).
 *     동료 12종 id: hamster rabbit fox wolf hawk bear tiger rhino elephant
 *                   shark mammoth dragon
 *     적 아키타입 10종 id: insect snail critter bird reptile fish cephalopod
 *                   beast brute titan
 *
 *   WL.Creatures.make(opts) -> handle
 *     opts = {
 *       species : 'fox',            // 필수. SPECIES 의 key
 *       stage   : 0..4,             // 성장 단계 (기본 2)
 *       size    : 96,               // px. 세로 기준. (기본 96)
 *       flip    : false,            // true 면 왼쪽을 향함
 *       palette : {                 // 선택. 지역/적 색 오버라이드
 *         tint  : '#C1391A',        //   코트 색조
 *         amt   : 0.30,             //   코트에 tint 섞는 비율 0~1
 *         base  : '#0E1119',        //   코트 바닥색 (기본 --night/--soot)
 *         rim   : 'warm'|'cold',    //   주 림라이트 (동료=warm, 적=cold)
 *         accent: '#FFE2A6'         //   눈/균열 색
 *       },
 *       mood    : 'calm',           // 'calm'|'happy'|'fierce'|'tired'
 *       seed    : 1234,             // 개체 고정 시드(위상·흉터 위치). 미지정시 랜덤
 *       label   : '여우 루'          // aria-label 용(접근성). 미지정시 종 이름
 *     }
 *
 *   handle = {

/* ─────────────────── 4. 성장 단계 모디파이어 ───────────────────
 * 새끼(0)는 머리 크고 다리 짧고 몸 작고 색이 옅다(유형성숙).
 * 단계가 오를수록 두상이 길어지고 다리가 길어지며 물건이 붙는다.
 * ------------------------------------------------------------- */
function stageMods(st) {
  st = clamp(st | 0, 0, 4);
  var g = st / 4;
  return {
    st: st, g: g,
    headMul: 1 + 0.26 * (1 - g),
    eyeMul: 1 + 0.24 * (1 - g),
    legMul: 0.78 + 0.22 * g + (st >= 2 ? 0.07 : 0),
    lenMul: 0.88 + 0.12 * g,
    girthMul: 0.93 + 0.10 * g,
    neckMul: 0.80 + 0.20 * g,
    sizeMul: 0.74 + 0.0675 * st,
    coat: 0.24 + 0.065 * st,
    exMul: 0.62 + 0.095 * st,
    collar: st >= 1, marks: st >= 2, stand: st >= 2,
    scar: st >= 3, torn: st >= 3, veteran: st >= 3, trophy: st >= 3,
    cape: st >= 4, mane: st >= 4, glow: st >= 4
  };
}

/* ─────────────────── 5. 조립기 ─────────────────── */
var U100 = 100;                     /* 1.0 로컬 = 100 유저유닛 */

function Builder(sp, M, C, rnd) {
  this.sp = sp; this.M = M; this.C = C; this.rnd = rnd;
  this.L = { glow: [], back: [], deep: [], body: [], head: [], front: [], acc: [] };
  this.minX = 1e9; this.minY = 1e9; this.maxX = -1e9; this.maxY = -1e9;
}
var NUMRE = /-?\d+(?:\.\d+)?/g;
Builder.prototype.track = function (d) {
  var m = d.match(NUMRE); if (!m) return;
  for (var i = 0; i + 1 < m.length; i += 2) {
    var x = +m[i], y = +m[i + 1];
    if (x < this.minX) this.minX = x; if (x > this.maxX) this.maxX = x;
    if (y < this.minY) this.minY = y; if (y > this.maxY) this.maxY = y;
  }
};
/* p(layer, d, attrs) — path 하나를 레이어에 밀어넣고 bbox 갱신 */
Builder.prototype.p = function (layer, d, attrs, noTrack) {
  if (!d) return;
  if (!noTrack) this.track(d);
  this.L[layer].push('<path d="' + d + '" ' + (attrs || '') + '/>');
};
Builder.prototype.raw = function (layer, s) { this.L[layer].push(s); };

/* ── 5-1 앵커 계산 ── */

  var hover = sp.hover * U100;

/* ── 5-2 다리 ── */

/* ── 5-4 귀 ── */

/* ── 5-5 눈 · 입 ── */

EX.fang = function (b, e) {

/* ── 5-7 무늬 (stage>=2, 몸통 path 로 클립) ── */
function buildMarks(b, clipId) {

  if (!m || !b.M.marks) return;
  var out = [], i, t, o;
  if (m.type === 'stripe') {
    for (i = 0; i < (m.n || 6); i++) {
      t = 0.14 + (i / (m.n || 6)) * 0.62; o = onBody(K, t);
      var w = o.r * (0.11 + 0.05 * Math.sin(i * 2.1));
      out.push('<path d="' + ribbon([add(o.p, o.n, o.r * 1.1), add(o.p, o.n, o.r * 0.1), add(add(o.p, o.n, -o.r * 0.5), o.t, -o.r * 0.25)], [w * 1.1, w, w * 0.5], { n: 7, capN: 3 }) + '" class="k-mk"/>');
    }
    o = onHead(K, 0.34);
    out.push('<path d="' + ribbon([add(o.p, K.up, o.r * 0.9), add(o.p, K.up, o.r * 0.1)], [o.r * 0.11, o.r * 0.08], { n: 5, capN: 3 }) + '" class="k-mk"/>');
  } else if (m.type === 'counter') {
    var pts = [], j;
    for (j = 0; j <= 10; j++) { o = onBody(K, 0.06 + j * 0.078); pts.push(add(o.p, o.n, -o.r * 0.42)); }
    var pts2 = [];
    for (j = 10; j >= 0; j--) { o = onBody(K, 0.06 + j * 0.078); pts2.push(add(o.p, o.n, -o.r * 1.15)); }
    out.push('<path d="' + closedSmooth(pts.concat(pts2)) + '" class="k-bl"/>');
  } else if (m.type === 'sock') {
    out.push('');
  } else if (m.type === 'patch') {
    o = onBody(K, 0.42);
    out.push('<path d="' + ell(o.p[0], o.p[1] + o.r * 0.55, o.r * 0.95, o.r * 0.52, -4) + '" class="k-bl"/>');
  } else if (m.type === 'bar') {
    for (i = 0; i < (m.n || 4); i++) {
      t = 0.18 + (i / (m.n || 4)) * 0.44; o = onBody(K, t);
      out.push('<path d="' + ribbon([add(o.p, o.n, o.r * 1.05), add(o.p, o.n, -o.r * 0.2)], [o.r * 0.10, o.r * 0.07], { n: 5, capN: 3 }) + '" class="k-mk"/>');
    }

  if (out.length) b.raw('body', '<g clip-path="url(#' + clipId + ')" class="wl-marks">' + out.join('') + '</g>');

  if (m.type === 'sock') {
    var xs = [K.hipX * 0.80, K.chestX * 0.78];
    for (i = 0; i < xs.length; i++) for (var s = 0; s < 2; s++)
      b.p('front', ell(xs[i] + (s ? 2 : -3), -sp.legs.thick * U100 * 1.2, sp.legs.thick * U100 * 1.15, sp.legs.thick * U100 * 1.5, 0), 'class="k-mk" opacity=".75"', true);
  }
}

/* ── 5-8 성장 물건: 목줄 / 흉터 / 트로피 / 망토 ── */
function buildGear(b) {
  var K = b.K, M = b.M, sp = b.sp, rnd = b.rnd;
  /* 목줄 + 이름표 (stage>=1) */
  if (M.collar) {
    var o = onBody(K, 0.90);
    var a = add(o.p, o.n, o.r * 1.06), c = add(o.p, o.n, -o.r * 1.02);
    b.p('body', ribbon([a, o.p, c], [o.r * 0.19, o.r * 0.16, o.r * 0.17], { n: 7, capN: 3 }), 'class="k-lt wl-collar"');
    var tag = add(o.p, o.n, -o.r * 1.02);
    b.p('body', ell(tag[0] + 0.4, tag[1] + o.r * 0.34, o.r * 0.24, o.r * 0.30, 8), 'class="k-n wl-tag"');
  }
  /* 흉터 (stage>=3) — 시드 고정 */
  if (M.scar) {
    var n = 1 + Math.floor(rnd() * 3);
    for (var i = 0; i < n; i++) {
      var t = 0.28 + rnd() * 0.52, s = onBody(K, t);
      var base = add(s.p, s.n, s.r * (0.30 + rnd() * 0.5));
      var L = s.r * (0.5 + rnd() * 0.6), aa = -50 + rnd() * 100;
      b.p('body', openSmooth([base, add(base, dirOf(aa), L * 0.5), add(base, dirOf(aa + 12), L)]), 'class="k-sc" fill="none"', true);
    }
  }
  /* 전리품 (stage>=3) — 목에 매단 뼈구슬 */
  if (M.trophy) {
    var o2 = onBody(K, 0.84), hang = add(o2.p, o2.n, -o2.r * 0.86);
    b.p('body', openSmooth([add(o2.p, o2.n, o2.r * 0.5), hang]), 'class="k-w" fill="none" opacity=".55"', true);
    for (var q = 0; q < 3; q++)
      b.p('body', ell(hang[0] + (q - 1) * o2.r * 0.30, hang[1] + o2.r * (0.10 + 0.10 * (1 - abs(q - 1))),
        o2.r * 0.11, o2.r * 0.15, (q - 1) * 18), 'class="k-n wl-troph"', true);
  }
  /* 망토 (stage>=4) — 어깨에 걸친 그을린 외투. 본체보다 80ms 늦게 따라오는 2차 진자 */
  if (M.cape && sp.arch === 'quad' && sp.legs.n >= 4) {
    var tA = 0.78, tB = 0.34, N = 4, top = [], hem = [], k, oo, dd;
    for (k = 0; k <= N; k++) { oo = onBody(K, tA + (tB - tA) * k / N); top.push(add(oo.p, oo.n, oo.r * 0.92)); }
    for (k = N; k >= 0; k--) {
      oo = onBody(K, tA + (tB - tA) * k / N);
      dd = oo.r * (0.20 + 0.42 * (k / N)) * (k % 2 ? 1.16 : 0.88);
      hem.push(add(add(oo.p, oo.n, oo.r * 0.30), [0, 1], dd));

    b.p('front', ell(pin[0], pin[1] + 1.2, onBody(K, tA).r * 0.17, onBody(K, tA).r * 0.17, 0), 'class="k-n wl-cape"' + corg, true);
  }
}

/* ── 5-9 몸통 · 머리 · 그림자 · 조립 ── */
function buildCore(b, uid) {
  var K = b.K, sp = b.sp, M = b.M;
  var bodyD = ribbon(K.bodyCps, K.rp, { n: 16, capN: 5 });
  var headD = ribbon(K.headCps, K.headProf, { n: 12, capN: 5 });

  /* 접지 그림자 — 불 반대 방향으로 늘어난다 */

  if (sp.legs.n || sp.hover) b.p('glow', ell(K.bodyLen * 0.06, -1.4, gw, Math.max(2.6, gw * 0.15), 0), 'class="k-sh"', true);

  if (M.glow) b.raw('glow', '<ellipse cx="0" cy="' + r2(K.baseY) + '" rx="' + r2(K.bodyLen * 0.9) + '" ry="' + r2(K.girth * 2.6) + '" fill="url(#wlcr-glow)" class="wl-aura"/>');

  /* 림은 여기서 그리지 않는다 — 실루엣 합집합 뒤에 깔리는 별도 <use> 패스가 처리한다.
     파트마다 림을 그리면 '가려진 가장자리'까지 선이 남아 머리가 덧붙어 보인다. */
  b.p('body', bodyD, 'class="k-c wl-sk"');
  b.p('head', headD, 'class="k-c wl-sk"');
}

function buildAll(sp, M, seed, uid) {
  var b = new Builder(sp, M, null, rng(seed));
  b.K = anchors(sp, M); b.sp = sp; b.M = M;
  var K = b.K;
  var clipId = 'wlcr-c' + uid;

  buildTail(b);
  buildLegs(b);
  buildCore(b, uid);
  buildMarks(b, clipId);
  buildEars(b);
  buildFace(b);
  buildGear(b);
  for (var i = 0; i < sp.extras.length; i++) {
    var e = sp.extras[i], fn = EX[e.t];

  if (M.mane && !hasEx(sp, 'mane') && !hasEx(sp, 'ruff') && sp.arch === 'quad')

  return { b: b, clipId: clipId };

    '--eye': pal.accent || (cold ? PAL.emberDeep : PAL.emberCore),
    '--inner': mix(shade(co, 0.25), PAL.emberDeep, 0.20),
    '--bone': mix(PAL.emberCore, co, 0.20),
    '--mark': shade(co, 0.62),

 * 고정 상한만 두고 런타임 감지가 없으면 느린 기기에서 그냥 무너진다.
 * 연속으로 예산(18ms)을 넘기면 한 단계씩 내리고, 여유가 지속되면 되올린다. */

  H._br = (2.9 + rr() * 1.5).toFixed(2);
  H._tw = (2.1 + rr() * 1.6).toFixed(2);
  H._ef = (3.6 + rr() * 2.2).toFixed(2);
  H._bl = (3.0 + rr() * 1.8).toFixed(2);

        '<g class="wl-deep">' + b.L.deep.join('') + '</g>' +
        '<g class="wl-torso" style="transform-origin:' + torsoOrg + '">' +
          '<g class="wl-bodyg">' + b.L.body.join('') + '</g>' +
          '<g class="wl-headg" style="transform-origin:' + headOrg + '">' + b.L.head.join('') + '</g>' +
        '</g>' +
        '<g class="wl-frontg">' + b.L.front.join('') + '</g>' +
        '<g class="wl-accg">' + b.L.acc.join('') + '</g>' +

    svg.style.setProperty('--ph', H._ph[0] + 's');

})();
