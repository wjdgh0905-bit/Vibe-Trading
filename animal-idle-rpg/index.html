    pushPoly(polys, [cx - w, 0, cx - w * 0.72, h * 0.45, cx - w * 0.52, h * 0.82,
                     cx - w * 0.74, h, cx + w * 0.66, h * 0.96, cx + w * 0.46, h * 0.78,
                     cx + w * 0.70, h * 0.40, cx + w, 0]);
  }
  return { polys: polys, smooth: false };
}

function ridgeCanopy(r, lay) {
  var polys = [], i, hMul = lay ? 0.6 : 1;
  var a = [], x;
  for (x = -0.14; x <= 1.145; x += 0.012) {     /* 둥근 수관이 겹친 덩어리 */
    var h = 0.055 * hMul;
    h += abs(sin(x * 9.1 + 0.7)) * 0.030 * hMul;
    h += abs(sin(x * 4.3 + 2.1)) * 0.026 * hMul;
    a.push(x, h);
  }
  pushPoly(polys, a);
  for (i = 0; i < (lay ? 2 : 4); i++) {         /* 돌출목 */
    var cx = -0.05 + r() * 1.1, h = (0.13 + r() * 0.10) * hMul, w = 0.010 + r() * 0.008;
    pushPoly(polys, [cx - w * 0.5, 0, cx - w * 0.22, h * 0.72, cx - w * 1.9, h * 0.80,
                     cx - w * 0.3, h * 0.90, cx, h, cx + w * 0.3, h * 0.90,
                     cx + w * 2.1, h * 0.78, cx + w * 0.22, h * 0.70, cx + w * 0.5, 0]);
  }
  return { polys: polys, smooth: false };
}

function ridgeVolcano(r, lay) {
  var polys = [], hMul = lay ? 0.55 : 1;
  var a = [], x;
  for (x = -0.14; x <= 1.145; x += 0.02) a.push(x, (0.024 + sin(x * 4.1) * 0.010) * hMul);
  pushPoly(polys, a);
  function cone(cx, h, w, notch) {
    var p = [cx - w, 0, cx - w * 0.46, h * 0.60, cx - w * 0.20, h];
    if (notch) p.push(cx - w * 0.09, h * 0.90, cx + w * 0.09, h * 0.90);
    p.push(cx + w * 0.22, h, cx + w * 0.48, h * 0.58, cx + w, 0);
    pushPoly(polys, p);
  }
  cone(0.60 + r() * 0.1, (0.17 + r() * 0.09) * hMul, 0.26, true);
  cone(0.16 + r() * 0.1, (0.08 + r() * 0.05) * hMul, 0.17, false);
  if (!lay) cone(0.92, 0.10 * hMul, 0.15, true);
  return { polys: polys, smooth: false };
}

function ridgeSpire(r, lay) {
  var polys = [], floats = [], i, n = lay ? 4 : 5, hMul = lay ? 0.6 : 1;
  for (i = 0; i < n; i++) {                     /* 땅에 박힌 메사 — 수직 벽에 평평한 정상 */
    var cx = -0.08 + (i + 0.15 + r() * 0.5) / n * 1.20;
    var h = (0.075 + r() * 0.150) * hMul, w = 0.026 + r() * 0.036;
    var tw = w * (0.42 + r() * 0.18);           /* 정상은 밑변보다 좁다 — 그래야 절벽이 선다 */
    pushPoly(polys, [cx - w, 0, cx - w * 0.88, h * 0.16, cx - w * 0.71, h * 0.29,
                     cx - tw * 1.18, h * 0.63, cx - tw * 1.04, h * 0.89, cx - tw, h,
                     cx + tw * 0.96, h, cx + tw * 1.08, h * 0.87, cx + tw * 1.22, h * 0.56,
                     cx + w * 0.76, h * 0.27, cx + w * 0.93, h * 0.13, cx + w, 0]);
    floats.push(0);
  }
  for (i = 0; i < (lay ? 2 : 3); i++) {         /* 허공에 뜬 섬 — 위는 평평, 아래는 뾰족 */
    var fx = 0.05 + r() * 1.0;
    var fy = (0.17 + r() * 0.16) * hMul;        /* 바닥 높이 */
    var fw = 0.026 + r() * 0.034, fh = (0.055 + r() * 0.075) * hMul;
    /* 위는 칼같이 평평하고 아래는 한 점으로 모인다 — 뒤집힌 물방울이 '떠 있음'을 만든다 */
    pushPoly(polys, [fx - fw, fy + fh, fx + fw, fy + fh,
                     fx + fw * 0.50, fy + fh * 0.54, fx + fw * 0.30, fy + fh * 0.22,
                     fx + fw * 0.06, fy, fx - fw * 0.16, fy + fh * 0.13,
                     fx - fw * 0.44, fy + fh * 0.30, fx - fw * 0.78, fy + fh * 0.58]);
    floats.push(1);
  }
  return { polys: polys, smooth: false, floats: floats };
}

function ridgeSwamp(r, lay) {
  var polys = [], i, hMul = lay ? 0.6 : 1;
  var a = [], x;
  for (x = -0.14; x <= 1.145; x += 0.018)
    a.push(x, (0.026 + abs(sin(x * 3.2 + 1.1)) * 0.026 + sin(x * 9.7) * 0.005) * hMul);
  pushPoly(polys, a);
  for (i = 0; i < (lay ? 3 : 6); i++) {         /* 죽은 나무 — 갈라진 몸통 */
    var cx = -0.06 + r() * 1.14, h = (0.090 + r() * 0.105) * hMul, w = 0.005 + r() * 0.005;
    var bend = (r() - 0.5) * 0.035;
    pushPoly(polys, [cx - w, 0, cx - w * 0.5 + bend * 0.5, h * 0.55,
                     cx - w * 3.6 + bend, h * 0.74, cx - w * 0.4 + bend * 0.8, h * 0.70,
                     cx + bend, h, cx + w * 0.7 + bend * 0.9, h * 0.66,
                     cx + w * 4.2 + bend, h * 0.80, cx + w * 0.6 + bend * 0.4, h * 0.50, cx + w, 0]);
  }
  return { polys: polys, smooth: false };
}

function ridgeCrystal(r, lay) {
  var polys = [], i, n = lay ? 6 : 9, hMul = lay ? 0.58 : 1;
  var a = [], x;
  for (x = -0.14; x <= 1.145; x += 0.03) a.push(x, 0.014 * hMul);
  pushPoly(polys, a);
  for (i = 0; i < n; i++) {                     /* 각진 수정 결정 */
    var cx = -0.10 + (i + r() * 0.8) / n * 1.24;
    var h = (0.055 + r() * 0.185) * hMul, w = (0.012 + r() * 0.026);
    var lean = (r() - 0.5) * w * 1.6;
    pushPoly(polys, [cx - w, 0, cx - w * 0.72, h * 0.66, cx + lean, h,
                     cx + w * 0.60, h * 0.58, cx + w * 0.86, h * 0.24, cx + w, 0]);
  }
  return { polys: polys, smooth: false };
}

var RIDGE = {
  forest: ridgeForest, plain: ridgePlain, peak: ridgePeak, dune: ridgeDune,
  trench: ridgeTrench, canopy: ridgeCanopy, volcano: ridgeVolcano,
  spire: ridgeSpire, swamp: ridgeSwamp, crystal: ridgeCrystal
};

/* ─────────────────── 7. 중경 소품 ─────────────────── */
/* 인스턴스 {x, d(깊이 0먼~1가까운), s(스케일), v(변종), ph(위상), r(개별난수)} */
/* 카메라 코앞의 큰 실루엣 몇 개. 밑변을 눌러 주면 무대에 깊이가 생긴다. */
function buildFore(r) {
  var out = [], i, n = 5;
  for (i = 0; i < n; i++) {
    var x = (i + 0.15 + r() * 0.7) / n;
    if (x > 0.20 && x < 0.36) x += 0.22;               /* 모닥불은 가리지 않는다 */
    out.push({ x: x, d: 1, s: 0.8 + r() * 0.5, v: r() < 0.5 ? 0 : 2, ph: r() * TAU, r: r(), r2: r() });
  }
  return out;
}

function buildProps(kind, r) {
  var out = [], n = 32, i;
  for (i = 0; i < n; i++) {
    var x = -0.06 + (i + r() * 0.85) / n * 1.14;
    /* 오른쪽(적 영역)은 성기게 — 어둠이 읽혀야 한다 */
    if (x > 0.70 && r() < 0.42) continue;
    /* 모닥불 바로 자리는 비운다 */
    if (x > 0.21 && x < 0.33 && r() < 0.55) continue;
    out.push({ x: x, d: r(), s: 0, v: flr(r() * 3), ph: r() * TAU, r: r(), r2: r() });
  }
  for (i = 0; i < out.length; i++) out[i].s = lerp(0.52, 1.0, out[i].d);
  out.sort(function (a, b) { return a.d - b.d; });
  return { kind: kind, list: out };
}

/* 공통: 소품 본체색(거의 밤) / 불 쪽 림 / 달 쪽 림 */
function propInk(st, lit) { return rgba(cmix(PAL.night, PAL.soot, 0.22 + lit * 0.40), 1); }

function pMushroom(c, P, x, y, s, t, lit, st) {
  var sw = sin(t * 0.6 + P.ph) * 1.2 * s;
  if (P.v === 2) {                                     /* 고사리 다발 */
    c.strokeStyle = propInk(st, lit); c.lineWidth = 1.6 * s; c.lineCap = 'round';
    for (var i = 0; i < 6; i++) {
      var a = -PI / 2 + (i - 2.5) * 0.30, L = (16 + P.r * 9) * s;
      c.beginPath(); c.moveTo(x, y);
      c.quadraticCurveTo(x + cos(a) * L * 0.5, y + sin(a) * L * 0.62,
                         x + cos(a) * L + sw, y + sin(a) * L * 0.9);
      c.stroke();
    }
    return;
  }
  var h = (8 + P.r * 8) * s, cw = (7.5 + P.r2 * 6.5) * s;
  c.fillStyle = propInk(st, lit);
  c.beginPath(); c.moveTo(x - 3.0 * s, y);             /* 대 */
  c.quadraticCurveTo(x - 2.1 * s + sw * 0.4, y - h * 0.6, x - 1.8 * s + sw, y - h);
  c.lineTo(x + 1.8 * s + sw, y - h);
  c.quadraticCurveTo(x + 2.1 * s + sw * 0.4, y - h * 0.6, x + 3.0 * s, y);
  c.closePath(); c.fill();
  c.beginPath();                                        /* 갓 */
  c.moveTo(x - cw + sw, y - h);
  c.quadraticCurveTo(x + sw, y - h - cw * 1.30, x + cw + sw, y - h);
  c.quadraticCurveTo(x + sw, y - h + cw * 0.30, x - cw + sw, y - h);
  c.fill();
  if (lit > 0.04) {                                     /* 불 쪽 아래-왼 림 */
    c.strokeStyle = rgba(PAL.ember, lit * 0.5); c.lineWidth = 1.1 * s;
    c.beginPath(); c.moveTo(x - cw * 0.95 + sw, y - h + cw * 0.06);
    c.quadraticCurveTo(x - cw * 0.5 + sw, y - h - cw * 0.72, x + sw * 0.6, y - h - cw * 1.02);
    c.stroke();
  }
  if (!st.fore) {                                      /* 발광 포자점 */
    c.fillStyle = rgba(PAL.firefly, 0.16 + P.r * 0.12);
    c.beginPath(); c.arc(x + sw * 0.8, y - h - cw * 0.4, 1.0 * s, 0, TAU); c.fill();
  }
}

function pGrass(c, P, x, y, s, t, lit, st) {
  var n = 6 + (P.r * 4 | 0), i;
  c.strokeStyle = propInk(st, lit); c.lineWidth = 1.3 * s; c.lineCap = 'round';
  for (i = 0; i < n; i++) {
    var f = (i / (n - 1) - 0.5), L = (15 + P.r * 16) * s * (1 - abs(f) * 0.42);
    var sw = sin(t * 1.05 + P.ph + i * 0.5) * (2.4 + L * 0.10);
    c.beginPath(); c.moveTo(x + f * 7 * s, y);
    c.quadraticCurveTo(x + f * 10 * s + sw * 0.4, y - L * 0.58, x + f * 13 * s + sw, y - L);
    c.stroke();
  }
  if (lit > 0.05) {                                     /* 불빛 받은 잎끝 */
    c.strokeStyle = rgba(PAL.ember, lit * 0.30); c.lineWidth = 0.9 * s;
    c.beginPath(); c.moveTo(x - 5 * s, y - 4 * s);
    c.quadraticCurveTo(x - 2 * s, y - 16 * s, x + sin(t + P.ph) * 3 - 1 * s, y - 24 * s);
    c.stroke();
  }
}

function pDrift(c, P, x, y, s, t, lit, st) {
  var w = (26 + P.r * 30) * s, h = (7 + P.r2 * 9) * s;
  c.fillStyle = rgba(cmix(st.gndTop, PAL.moon, 0.14 + lit * 0.10), 1);
  c.beginPath(); c.moveTo(x - w, y + 2 * s);
  c.quadraticCurveTo(x - w * 0.45, y - h, x + w * 0.1, y - h * 0.82);
  c.quadraticCurveTo(x + w * 0.6, y - h * 0.6, x + w, y + 2 * s);
  c.closePath(); c.fill();
  c.strokeStyle = rgba(PAL.moon, 0.20);  c.lineWidth = 1.1 * s;   /* 달빛 능선 */
  c.beginPath(); c.moveTo(x - w * 0.9, y);
  c.quadraticCurveTo(x - w * 0.4, y - h * 0.95, x + w * 0.12, y - h * 0.80); c.stroke();
  if (P.v === 0) {                                      /* 언 관목 */
    c.strokeStyle = propInk(st, lit * 0.6); c.lineWidth = 1.2 * s; c.lineCap = 'round';
    for (var i = 0; i < 5; i++) {
      var a = -PI / 2 + (i - 2) * 0.34, L = (12 + P.r * 12) * s;
      c.beginPath(); c.moveTo(x + w * 0.2, y - h * 0.5);
      c.lineTo(x + w * 0.2 + cos(a) * L, y - h * 0.5 + sin(a) * L); c.stroke();
    }
  }
}

function pBone(c, P, x, y, s, t, lit, st) {
  c.fillStyle = propInk(st, lit);
  if (P.v === 0) {                                      /* 선인장 */
    var h = (22 + P.r * 26) * s, w = 3.4 * s;
    c.beginPath();
    c.moveTo(x - w, y); c.lineTo(x - w, y - h + w); c.quadraticCurveTo(x - w, y - h, x, y - h);
    c.quadraticCurveTo(x + w, y - h, x + w, y - h + w); c.lineTo(x + w, y); c.closePath(); c.fill();
    var ay = y - h * 0.62, aw = (9 + P.r2 * 7) * s;     /* 팔 */
    c.beginPath(); c.moveTo(x + w * 0.6, ay); c.lineTo(x + aw, ay);
    c.quadraticCurveTo(x + aw + w, ay, x + aw + w, ay - w * 2.4);
    c.lineTo(x + aw + w, ay - h * 0.30); c.lineTo(x + aw - w * 0.4, ay - h * 0.30);
    c.lineTo(x + aw - w * 0.4, ay - w * 1.6); c.lineTo(x + w * 0.6, ay - w * 1.6); c.closePath(); c.fill();
    if (lit > 0.05) { c.strokeStyle = rgba(PAL.ember, lit * 0.42); c.lineWidth = 1.2 * s;
      c.beginPath(); c.moveTo(x - w, y - 2 * s); c.lineTo(x - w, y - h + w); c.stroke(); }
  } else {                                              /* 갈비뼈 */
    var rw = (14 + P.r * 12) * s, rh = (11 + P.r2 * 13) * s, i;
    c.strokeStyle = rgba(cmix(PAL.night, PAL.ink, st.fore ? 0.07 : 0.09 + lit * 0.13), 1);
    c.lineWidth = 1.5 * s; c.lineCap = 'round';
    for (i = 0; i < 4; i++) {
      var k = i / 3;
      c.beginPath();
      c.moveTo(x - rw * 0.8 + k * rw * 1.5, y);
      c.quadraticCurveTo(x - rw * 0.2 + k * rw * 1.3, y - rh * (1 - k * 0.3), x + rw * 0.5 + k * rw, y - rh * 0.15);
      c.stroke();
    }
    c.lineWidth = 2.4 * s; c.beginPath();               /* 척추 */
    c.moveTo(x - rw, y - rh * 0.10); c.quadraticCurveTo(x, y - rh * 0.55, x + rw * 1.4, y - rh * 0.18); c.stroke();
  }
}

function pCoral(c, P, x, y, s, t, lit, st) {
  var sway = sin(t * 0.42 + P.ph) * 0.10;
  if (P.v === 2) {                                      /* 관벌레 */
    for (var i = 0; i < 3; i++) {
      var tx = x + (i - 1) * 6 * s, h = (14 + ((i * 37 + P.r * 91) % 13)) * s;
      c.fillStyle = propInk(st, lit);
      c.beginPath(); c.moveTo(tx - 2.2 * s, y);
      c.quadraticCurveTo(tx - 1.4 * s, y - h, tx - 2.6 * s + sway * 8, y - h);
      c.lineTo(tx + 2.6 * s + sway * 8, y - h);
      c.quadraticCurveTo(tx + 1.4 * s, y - h, tx + 2.2 * s, y); c.closePath(); c.fill();
      c.fillStyle = rgba(PAL.soul, st.fore ? 0.05 : 0.22 + lit * 0.18);
      c.beginPath(); c.ellipse(tx + sway * 8, y - h, 2.8 * s, 1.3 * s, 0, 0, TAU); c.fill();
    }
    return;
  }
  c.strokeStyle = propInk(st, lit); c.lineCap = 'round';
  (function branch(bx, by, ang, L, w, dep) {            /* 2단 가지치기 */
    c.lineWidth = w; c.beginPath(); c.moveTo(bx, by);
    var ex = bx + cos(ang) * L, ey = by + sin(ang) * L;
    c.quadraticCurveTo(bx + cos(ang) * L * 0.5 - L * 0.14, by + sin(ang) * L * 0.5, ex, ey);
    c.stroke();
    if (dep <= 0) {
      c.fillStyle = rgba(PAL.soul, st.fore ? 0.04 : 0.16 + lit * 0.14);
      c.beginPath(); c.arc(ex, ey, w * 0.9, 0, TAU); c.fill(); return;
    }
    branch(ex, ey, ang - 0.50 + sway, L * 0.62, w * 0.66, dep - 1);
    branch(ex, ey, ang + 0.46 + sway, L * 0.58, w * 0.66, dep - 1);
  })(x, y, -PI / 2 + sway, (15 + P.r * 13) * s, 3.0 * s, 2);
}

function pFern(c, P, x, y, s, t, lit, st) {
  var sway = sin(t * 0.5 + P.ph) * 0.075;
  c.strokeStyle = propInk(st, lit); c.lineCap = 'round';
  if (P.v === 2) {                                      /* 늘어진 덩굴 */
    var L = (40 + P.r * 40) * s;
    c.lineWidth = 1.5 * s;
    c.beginPath(); c.moveTo(x, y - L * 1.5);
    c.quadraticCurveTo(x + sway * 40, y - L * 0.7, x + sway * 26, y); c.stroke();
    c.fillStyle = propInk(st, lit);
    for (var k = 0; k < 5; k++) {
      var f = 0.2 + k * 0.18, vy = y - L * 1.5 + L * 1.5 * f;
      c.beginPath(); c.ellipse(x + sway * 40 * f + (k % 2 ? 3.4 : -3.4) * s, vy, 3.6 * s, 1.7 * s, k % 2 ? 0.4 : -0.4, 0, TAU); c.fill();
    }
    return;
  }
  for (var i = 0; i < 4; i++) {                         /* 큰 잎자루 4장 */
    var a = -PI / 2 + (i - 1.5) * 0.46 + sway, L2 = (26 + P.r * 20) * s;
    var ex = x + cos(a) * L2, ey = y + sin(a) * L2 * 0.92;
    c.lineWidth = 1.8 * s;
    c.beginPath(); c.moveTo(x, y);
    c.quadraticCurveTo(x + cos(a) * L2 * 0.5, y + sin(a) * L2 * 0.40, ex, ey); c.stroke();
    c.lineWidth = 1.0 * s;                              /* 작은 잎 */
    for (var j = 1; j <= 4; j++) {
      var f2 = j / 4.6, px = lerp(x, ex, f2), py = lerp(y, ey, f2 * 0.86);
      c.beginPath(); c.moveTo(px, py); c.lineTo(px - cos(a) * 5 * s + 5 * s, py - 4 * s); c.stroke();
      c.beginPath(); c.moveTo(px, py); c.lineTo(px - cos(a) * 5 * s - 5 * s, py - 4 * s); c.stroke();
    }
  }
}

function pLava(c, P, x, y, s, t, lit, st) {
  var w = (13 + P.r * 20) * s, h = (9 + P.r2 * 16) * s;
  c.fillStyle = rgba(cmix(PAL.night, PAL.soot, 0.5), 1);
  c.beginPath();                                        /* 각진 현무암 */
  c.moveTo(x - w, y); c.lineTo(x - w * 0.72, y - h * 0.64); c.lineTo(x - w * 0.14, y - h);
  c.lineTo(x + w * 0.46, y - h * 0.80); c.lineTo(x + w, y - h * 0.22); c.lineTo(x + w * 0.9, y);
  c.closePath(); c.fill();
  if (st.fore) return;                                  /* 코앞의 바위는 그냥 검다 */
  var pu = 0.5 + 0.5 * sin(t * 1.7 + P.ph);             /* 용암 균열 — 스스로 맥동 */
  c.strokeStyle = rgba(cmix(PAL.deep, PAL.ember, pu * 0.55), 0.26 + pu * 0.20);
  c.lineWidth = 1.2 * s; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - w * 0.62, y - h * 0.12);
  c.lineTo(x - w * 0.16, y - h * 0.52); c.lineTo(x + w * 0.24, y - h * 0.30);
  c.lineTo(x + w * 0.74, y - h * 0.50); c.stroke();
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.09 + pu * 0.08;
  var g = glowSprite(PAL.deep, 0.4), R = w * 1.4;
  c.drawImage(g, x - R, y - h * 0.4 - R * 0.6, R * 2, R * 1.2);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

function pCloud(c, P, x, y, s, t, lit, st) {
  if (st.fore) {                                        /* 코앞은 바위 실루엣만 */
    c.fillStyle = propInk(st, 0);
    c.beginPath(); c.moveTo(x - 13 * s, y); c.lineTo(x - 7 * s, y - 15 * s);
    c.lineTo(x + 3 * s, y - 20 * s); c.lineTo(x + 11 * s, y - 7 * s); c.lineTo(x + 14 * s, y);

function pReed(c, P, x, y, s, t, lit, st) {

  c.moveTo(x, yy - h); c.lineTo(x + w, yy - h * 0.42); c.lineTo(x + w * 0.55, yy);
  c.lineTo(x - w * 0.6, yy); c.lineTo(x - w, yy - h * 0.48); c.closePath(); c.fill();
  c.fillStyle = rgba(PAL.soul, st.fore ? 0.035 : 0.085 + lit * 0.07);   /* 안쪽 면 */
  c.beginPath(); c.moveTo(x, yy - h); c.lineTo(x + w, yy - h * 0.42); c.lineTo(x + w * 0.55, yy);
  c.lineTo(x + w * 0.06, yy - h * 0.3); c.closePath(); c.fill();

    else if (vy0 > 6)  { p.lo = -0.22; p.hi = 1.12; }      /* 하강 — 하늘에서 내린다 */
    else if (hx > 24)  { p.lo = 0.30; p.hi = 1.04; }       /* 바람 — 지면 가까이 분다 */

  /* ---- 사이즈 ---- */
  function resize() {

    var w = max(1, Math.round(rect.width));
    var h = max(1, Math.round(rect.height || w * 0.56));

    /* 채움률이 프레임을 정한다 — 품질을 내리면 해상도부터 내린다(밤 화면이라 티가 덜 난다) */

  function drawSky(c) {

  function blob(c, col, a, cx, cy, rw, rh) {

  /* ---- L1 원경 능선 ---- */

  function drawRidges(c) {
    var fogc = bc('_fog');

     * 이 둘의 명도 차가 없으면 능선이 한 겹으로 뭉쳐 장식 띠가 된다. */

    g.addColorStop(0.72, rgba(fogc, fa * 0.72));
    g.addColorStop(1, rgba(fogc, fa));
    c.fillStyle = g; c.fillRect(0, farY - Ht * 0.16, Wd, Ht * 0.19);
  }

  /* ---- L2 중경 소품 ---- */
  function propPass(c, geo, alpha) {
    if (alpha <= 0.006 || !geo) return;
    var L = geo.props.list, fn = PROPD[geo.props.kind], i;
    c.globalAlpha = alpha;
    for (i = 0; i < L.length; i++) {
      var P = L[i];
      var par = 0.24 + P.d * 0.14;
      var x = P.x * Wd + camX * par;
      if (x < -Wd * 0.12 || x > Wd * 1.12) continue;
      var y = lerp(farY + Ht * 0.006, gY - Ht * 0.004, P.d);
      var s = pw(P.s, 1.7) * (Ht / 560) * 2.35;
      fn(c, P, x, y, s, t, pw(litAt(x, y), 1.4), stEnv);
    }
    c.globalAlpha = 1;
  }
  function drawProps(c) { propPass(c, geoA, 1 - xf); propPass(c, geoB, xf); }

  /* 전경 — 전면 캔버스에, 비네트 위에. 그래서 언제나 새까만 실루엣이다. */
  var foreEnv = { gndTop: PAL.night, fore: true };
  function forePass(c, geo, alpha) {
    if (alpha <= 0.006 || !geo) return;
    var L = geo.fore, fn = PROPD[geo.props.kind], i;
    c.globalAlpha = alpha;
    for (i = 0; i < L.length; i++) {
      var P = L[i];
      var x = P.x * Wd + camX * 1.15;
      var s = P.s * (Ht / 560) * 4.3;
      fn(c, P, x, Ht + Ht * 0.05, s, t, 0, foreEnv);
    }
    c.globalAlpha = 1;
  }
  function drawFore(c) { forePass(c, geoA, 1 - xf); forePass(c, geoB, xf); }

  /* ---- L3 지면 + 불빛 풀 ---- */
  function drawGround(c) {
    var g0 = bc('_g0'), g1 = bc('_g1');
    if (mv.cool > 0.001) { g0 = cmix(g0, PAL.moon, mv.cool * 0.12); g1 = cmix(g1, PAL.night, mv.cool * 0.3); }
    var oy = camY * 0.60;
    /* 지면은 스스로 빛나지 않는다. 기본값은 거의 밤이고, 불빛 풀만이 바닥을 만든다. */
    var gFar = cmix(g0, bc('_fog'), 0.62);              /* 지평 — 원경 안개와 같은 값이라 선이 안 생긴다 */
    var gTop = cmix(g0, PAL.night, 0.44);
    var gMid = cmix(g0, PAL.night, 0.68);
    var gNear = cmix(g1, PAL.night, 0.84);              /* 카메라 앞 — 빛이 없으면 아무것도 없다 */
    var g = c.createLinearGradient(0, farY + oy, 0, Ht);
    g.addColorStop(0, rgba(gFar, 1));
    g.addColorStop(0.09, rgba(gTop, 1));
    g.addColorStop(0.34, rgba(gMid, 1));
    g.addColorStop(1, rgba(gNear, 1));
    c.fillStyle = g; c.fillRect(0, farY + oy - 1, Wd, Ht - farY - oy + 2);
    stEnv.gndTop = g0;

    /* 불빛 풀 — 지면에 눕는 타원. 이게 무대의 유일한 따뜻한 바닥이다.
     * 지면 밖으로 새면 능선까지 노랗게 물든다. 반드시 클립한다. */
    var px = fireX + camX * 0.60, py = gY + Ht * 0.026 + oy;
    var rx = R * 1.48, ry = R * 0.34;
    c.save();
    c.beginPath(); c.rect(0, farY + oy - 1, Wd, Ht - farY - oy + 2); c.clip();
    c.globalCompositeOperation = 'lighter';
    c.translate(px, py); c.scale(1, ry / rx);
    var pg = c.createRadialGradient(0, 0, 0, 0, 0, rx);
    pg.addColorStop(0,    rgba(PAL.ember, 0.30 * strength));
    pg.addColorStop(0.07, rgba(PAL.ember, 0.19 * strength));
    pg.addColorStop(0.20, rgba(PAL.ember, 0.115 * strength));
    pg.addColorStop(0.42, rgba(PAL.ember, 0.055 * strength));
    pg.addColorStop(0.70, rgba(PAL.deep,  0.022 * strength));
    pg.addColorStop(1,    rgba(PAL.deep,  0));
    c.fillStyle = pg; c.fillRect(-rx, -rx, rx * 2, rx * 2);
    var cr = R * 0.13;                                  /* 장작 바로 아래 접지광 */
    var cg2 = c.createRadialGradient(0, 0, 0, 0, 0, cr);
    cg2.addColorStop(0, rgba(PAL.core, 0.34 * strength));
    cg2.addColorStop(0.5, rgba(PAL.ember, 0.16 * strength));
    cg2.addColorStop(1, rgba(PAL.ember, 0));
    c.fillStyle = cg2; c.fillRect(-cr, -cr, cr * 2, cr * 2);
    c.restore();

    /* 지면 결 — 불빛 안에서만 보인다 */
    var ox = camX * 0.60;
    for (var i = 0; i < gtex.length; i++) {
      var T = gtex[i];
      var x = T.x * Wd + ox, y = farY + oy + (Ht - farY) * T.d * 0.92;
      var l = pw(litAt(x, y), 1.35) * T.a;
      if (l < 0.030) continue;
      var w = T.w * Wd * (0.35 + T.d * 0.9);
      if (T.k) {                                        /* 돌 — 불 쪽 면이 빛난다 */
        var rr = w * 0.22;
        c.fillStyle = rgba(cmix(PAL.night, PAL.soot, 0.5), min(0.85, 0.3 + l));
        c.beginPath(); c.ellipse(x, y, rr, rr * 0.62, 0, 0, TAU); c.fill();
        c.fillStyle = rgba(PAL.ember, l * 0.45);
        c.beginPath(); c.ellipse(x - rr * 0.28, y - rr * 0.18, rr * 0.55, rr * 0.32, -0.3, 0, TAU); c.fill();
      } else {
        c.strokeStyle = rgba(PAL.ember, l * 0.22);
        c.lineWidth = max(0.7, Ht * 0.0016 * (0.4 + T.d));
        c.beginPath(); c.moveTo(x - w * 0.5, y); c.lineTo(x + w * 0.5, y + w * 0.03); c.stroke();
      }
    }
  }

  /* ---- 지면 그림자 — 불 반대 방향으로 늘어난다 ---- */
  function drawShadows(c) {
    var sp = shadowSprite(), ox = camX * 0.60, oy = camY * 0.60, rows = ['back', 'air', 'front', 'foe'], k, i;
    for (k = 0; k < rows.length; k++) {
      var L = occ[rows[k]], air = rows[k] === 'air';
      for (i = 0; i < L.length; i++) {
        var o = L[i];
        var x = o.x + ox, y = (air ? gY : o.y) + oy;
        var l = litAt(x, gY);
        if (l < 0.02) continue;
        var dx = x - (fireX + ox);
        var dir = dx >= 0 ? 1 : -1;
        var far = clamp(abs(dx) / (R * 1.2), 0, 1.4);
        var stretch = 0.55 + far * 1.85;                /* 멀수록 길게 눕는다 */
        var w = Ht * 0.055 * o.scale * (air ? 0.7 : 1);
        var h = Ht * 0.017 * o.scale * (air ? 0.8 : 1);
        var lw = w * stretch;
        var a = l * (air ? 0.26 : 0.52) * strength;
        c.save();
        c.globalAlpha = a;
        c.translate(x, y);
        c.transform(1, 0, dir * 0.30 * (stretch - 0.5), 1, 0, 0);   /* 불 반대쪽으로 기울임 */
        c.drawImage(sp, -w * 0.7 + dir * lw * 0.30, -h, w * 0.7 * 2 + lw * 0.6, h * 2);
        c.restore();
      }
    }
    c.globalAlpha = 1;
  }

  /* ---- L4 모닥불 ---- */
  var TB = new Float32Array(96);
  function tongue(c, x, y, w, h, col, a, sd) {
    var N = 8, i, n = 0, f, taper, wob;
    for (i = 0; i <= N; i++) {                          /* 왼쪽 모서리 아래→위 */
      f = i / N;
      taper = (1 - f) * (1 - f * 0.52) + 0.055;
      wob = nz(t * 3.2 + sd + f * 2.6) * w * 0.44 * f + nz2(t * 1.25 + sd * 2.3) * w * 0.22 * f * f;
      TB[n++] = x - w * taper + wob; TB[n++] = y - h * f;
    }
    for (i = N; i >= 0; i--) {                          /* 오른쪽 모서리 위→아래 */
      f = i / N;
      taper = (1 - f) * (1 - f * 0.52) + 0.055;
      wob = nz(t * 3.2 + sd + f * 2.6) * w * 0.44 * f + nz2(t * 1.25 + sd * 2.3) * w * 0.22 * f * f;
      TB[n++] = x + w * taper + wob; TB[n++] = y - h * f;
    }
    c.beginPath(); c.moveTo(TB[0], TB[1]); smoothPath(c, TB, n >> 1); c.closePath();
    c.fillStyle = rgba(col, a); c.fill();
  }

  function log(c, x, y, L, ang, th, lit) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.fillStyle = rgba(cmix(PAL.night, PAL.soot, 0.62), 1);
    c.beginPath();
    c.moveTo(-L, -th); c.lineTo(L * 0.86, -th * 0.82);
    c.quadraticCurveTo(L, -th * 0.82, L, 0);
    c.quadraticCurveTo(L, th * 0.82, L * 0.86, th * 0.82);
    c.lineTo(-L, th); c.quadraticCurveTo(-L - th * 0.6, 0, -L, -th);
    c.closePath(); c.fill();
    c.strokeStyle = rgba(PAL.ember, 0.34 * lit); c.lineWidth = max(0.8, th * 0.26);
    c.beginPath(); c.moveTo(-L * 0.9, -th * 0.72); c.lineTo(L * 0.8, -th * 0.6); c.stroke();
    c.fillStyle = rgba(PAL.deep, 0.5 * lit);            /* 숯이 된 끝 */
    c.beginPath(); c.ellipse(L * 0.86, 0, th * 0.5, th * 0.72, 0, 0, TAU); c.fill();
    c.restore();
  }

  function drawFire(c) {
    var x = fireX + camX * 0.60, y = gY + camY * 0.60;
    var sc = Ht / 560;
    var fh = Ht * 0.152 * strength * (0.88 + (pulse - 1) * 1.8);
    var fw = Wd * 0.034 * (0.55 + strength * 0.45);
    fw = min(fw, Ht * 0.070);
    var lit = strength * pulse;

    /* 잉걸 바닥 */
    c.save(); c.globalCompositeOperation = 'lighter';
    c.translate(x, y); c.scale(1, 0.34);
    var cg = c.createRadialGradient(0, 0, 0, 0, 0, fw * 2.6);
    cg.addColorStop(0, rgba(PAL.core, 0.55 * lit));
    cg.addColorStop(0.35, rgba(PAL.ember, 0.34 * lit));
    cg.addColorStop(1, rgba(PAL.deep, 0));
    c.fillStyle = cg; c.fillRect(-fw * 2.6, -fw * 2.6, fw * 5.2, fw * 5.2);
    c.restore();

    /* 장작 3개 */
    var lg = fw * 1.42, th = max(2.6, sc * 5.6);
    log(c, x - fw * 0.30, y - th * 0.35, lg, -0.13, th, lit);
    log(c, x + fw * 0.26, y - th * 1.05, lg * 0.92, 0.17, th * 0.92, lit);
    log(c, x - fw * 0.04, y - th * 1.85, lg * 0.74, -0.46, th * 0.80, lit);

    /* 후광 */
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.30 * lit;
    var hs = glowSprite(PAL.ember, 0.30), HR = fh * 1.45;
    c.drawImage(hs, x - HR, y - fh * 0.52 - HR, HR * 2, HR * 2);
    c.globalAlpha = 1;

    /* 불꽃 3겹 + 심지 — 가산 합성으로 뜨겁게 */
    tongue(c, x, y - th * 0.5, fw * 1.12, fh * 1.00, PAL.deep,  0.46, 11.3);
    tongue(c, x, y - th * 0.5, fw * 0.95, fh * 0.84, PAL.ember, 0.52, 27.9);
    tongue(c, x, y - th * 0.5, fw * 0.58, fh * 0.56, PAL.core,  0.60, 43.1);
    tongue(c, x, y - th * 0.5, fw * 0.30, fh * 0.31, PAL.white, 0.78, 61.7);
    c.globalCompositeOperation = 'source-over';
  }

  /* ---- 불씨 ---- */
  var embAcc = 0;
  function updEmbers(dt) {
    var x = fireX, y = gY, fh = Ht * 0.15 * strength;
    embAcc += dt * (13 * mv.emb * strength + 3) * (reduced ? 0.4 : 1);
    var i, e;
    while (embAcc >= 1) {
      embAcc -= 1;
      for (i = 0; i < EN; i++) if (embs[i].life < 0) {
        e = embs[i];
        e.life = 0; e.ttl = 1.1 + Math.random() * 2.2;
        e.x = x + (Math.random() - 0.5) * Wd * 0.028;
        e.y = y - Ht * 0.012 - Math.random() * fh * 0.4;
        e.vx = (Math.random() - 0.5) * Ht * 0.05;
        e.vy = -Ht * (0.09 + Math.random() * 0.16);
        e.sz = (0.9 + Math.random() * 2.0) * (Ht / 560);
        e.ph = Math.random() * TAU;
        e.hot = Math.random();
        break;
      }
    }
    for (i = 0; i < EN; i++) {
      e = embs[i]; if (e.life < 0) continue;
      e.life += dt;
      if (e.life >= e.ttl) { e.life = -1; continue; }
      var k = e.life / e.ttl;
      e.vy += Ht * 0.030 * dt;                          /* 위로 갈수록 느려진다 */
      e.x += (e.vx + sin(t * 1.9 + e.ph) * Ht * 0.045) * dt;
      e.y += e.vy * dt;
    }
  }
  function drawEmbers(c) {
    c.globalCompositeOperation = 'lighter';
    var ox = camX * 0.60, oy = camY * 0.60;
    for (var i = 0; i < EN; i++) {
      var e = embs[i]; if (e.life < 0) continue;
      var k = e.life / e.ttl;
      var a = (1 - k) * (0.55 + e.hot * 0.45) * strength;
      a *= ss(0, 0.08, k);
      if (a < 0.02) continue;
      var col = e.hot > 0.55 ? PAL.core : PAL.ember;
      if (k > 0.55) col = cmix(col, PAL.deep, (k - 0.55) * 2.2);   /* 식으면서 붉어진다 */
      var rr = (1.7 + e.sz * 1.05) * (1 - k * 0.28);
      c.globalAlpha = min(1, a * 0.85);
      c.drawImage(glowSprite(col, 0.24), e.x + ox - rr, e.y + oy - rr, rr * 2, rr * 2);
      c.globalAlpha = min(1, a);                        /* 단단한 심 — 이게 있어야 불똥이다 */
      c.fillStyle = rgba(cmix(col, PAL.white, 0.5), 1);
      c.beginPath(); c.arc(e.x + ox, e.y + oy, max(0.45, e.sz * 0.34), 0, TAU); c.fill();
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }

  /* ---- 연기 ---- */
  var smkAcc = 0;
  function updSmoke(dt) {
    smkAcc += dt * (2.4 * mv.smk) * (reduced ? 0.5 : 1);
    var i, s;
    while (smkAcc >= 1) {
      smkAcc -= 1;
      for (i = 0; i < SN; i++) if (smks[i].life < 0) {
        s = smks[i];
        s.life = 0; s.ttl = 4.5 + Math.random() * 3.5;
        s.x = fireX + (Math.random() - 0.5) * Wd * 0.018;
        s.y = gY - Ht * 0.14 * strength;
        s.vx = Ht * (0.035 + Math.random() * 0.055);    /* 바람은 오른쪽으로 */
        s.vy = -Ht * (0.055 + Math.random() * 0.045);
        s.sz = Ht * (0.055 + Math.random() * 0.06);
        s.rot = Math.random() * TAU; s.rv = (Math.random() - 0.5) * 0.5;
        break;
      }
    }
    for (i = 0; i < SN; i++) {
      s = smks[i]; if (s.life < 0) continue;
      s.life += dt;
      if (s.life >= s.ttl) { s.life = -1; continue; }
      s.x += (s.vx + sin(t * 0.5 + s.rot) * Ht * 0.02) * dt;
      s.y += s.vy * dt; s.vy *= (1 - dt * 0.25);
      s.rot += s.rv * dt;
    }
  }
  function drawSmoke(c) {
    var sp = softSprite(cmix(PAL.ash, PAL.moon, 0.22), 0.55);
    var ox = camX * 0.35, oy = camY * 0.35;
    for (var i = 0; i < SN; i++) {
      var s = smks[i]; if (s.life < 0) continue;
      var k = s.life / s.ttl;
      var a = ss(0, 0.18, k) * (1 - ss(0.45, 1, k)) * 0.30 * mv.smk;
      if (a < 0.012) continue;
      var r2 = s.sz * (0.5 + k * 2.4);
      c.globalAlpha = a;
      c.save(); c.translate(s.x + ox, s.y + oy); c.rotate(s.rot);
      c.drawImage(sp, -r2, -r2 * 0.82, r2 * 2, r2 * 1.64);
      c.restore();
    }
    c.globalAlpha = 1;
  }

  /* ---- 지역 파티클 ---- */
  function partSpec(gen) { return (gen === 1 ? BA : BB).part; }
  function updParts(dt) {
    var sp = mv.spd * (reduced ? 0.45 : 1);
    for (var i = 0; i < PN; i++) {
      var p = parts[i];
      var spec = partSpec(p.g);
      /* 지역 전환: 입자마다 제 차례에 갈아탄다 */
      if (xf < 1) {
        var fade = clamp((xf - p.sw) / 0.16, 0, 1);
        if (fade >= 0.5 && p.g === 1) { p.g = 2; respawn(p, BB.part, true); spec = BB.part; }
      } else if (p.g === 1 && BA !== BB) { p.g = 2; }
      var sc = Ht / 560;
      p.x += (p.vx * sp * dt) / Wd + sin(t * spec.wob + p.ph) * 0.00035 * sp;
      p.y += (p.vy * sp * dt) / Ht;
      p.rot += p.rv * dt * sp;
      if (p.x < -0.16 || p.x > 1.16 || p.y < p.lo - 0.14 || p.y > p.hi + 0.14) respawn(p, spec, true);
    }
  }
  function drawParts(c, front) {
    var i, p, spec, sc = Ht / 560;
    for (i = 0; i < PN; i++) {
      p = parts[i];
      if ((p.z > 0.42) !== front) continue;
      spec = partSpec(p.g);
      var a = p.a;
      if (xf < 1) {                                     /* 개별 디졸브 */
        var fade = clamp((xf - p.sw) / 0.16, 0, 1);
        a *= p.g === 1 ? (1 - fade * 2) : clamp((fade - 0.5) * 2, 0, 1);
        if (a <= 0.01) continue;
      }
      var x = p.x * Wd + camX * (front ? 1.0 : 0.45);
      var y = p.y * Ht + camY * (front ? 1.0 : 0.45);
      var s = p.sz * sc * (front ? 1.25 : 0.8);
      var l = spec.glow > 0.3 ? 1 : lerp(0.35, 1, pw(litAt(x, y), 1.2));
      a *= l;
      var col = spec._c;
      switch (spec.shape) {
        case 'streak':
          c.globalAlpha = a; c.strokeStyle = rgba(col, 1); c.lineWidth = max(0.6, s * 0.5);
          c.beginPath(); c.moveTo(x, y); c.lineTo(x - s * 7, y - s * 0.5); c.stroke();
          break;
        case 'leaf':
          c.globalAlpha = a; c.fillStyle = rgba(col, 1);
          c.save(); c.translate(x, y); c.rotate(p.rot);
          c.beginPath(); c.ellipse(0, 0, s, s * (0.30 + 0.3 * abs(sin(p.rot))), 0, 0, TAU); c.fill();
          c.restore();
          break;
        case 'bubble':
          c.globalAlpha = a * 0.8; c.strokeStyle = rgba(col, 1); c.lineWidth = max(0.6, s * 0.22);
          c.beginPath(); c.arc(x, y, s, 0, TAU); c.stroke();
          c.globalAlpha = a * 0.5; c.fillStyle = rgba(PAL.white, 1);
          c.beginPath(); c.arc(x - s * 0.34, y - s * 0.34, max(0.5, s * 0.18), 0, TAU); c.fill();
          break;
        case 'mist':
          c.globalAlpha = a;
          c.drawImage(softSprite(col, 0.5), x - s * 4, y - s * 1.4, s * 8, s * 2.8);
          break;
        default:
          if (spec.glow > 0.45) {
            c.globalCompositeOperation = 'lighter';
            c.globalAlpha = min(1, a * (0.62 + 0.38 * sin(t * 1.6 + p.ph)));
            var g = glowSprite(col, 0.22), rr = s * 1.85;
            c.drawImage(g, x - rr, y - rr, rr * 2, rr * 2);
            /* 글로우만 있으면 솜뭉치다. 가운데 단단한 심을 하나 박는다. */
            c.globalAlpha = min(1, a * 1.1);
            c.fillStyle = rgba(cmix(col, PAL.white, 0.4), 1);
            c.beginPath(); c.arc(x, y, max(0.45, s * 0.42), 0, TAU); c.fill();
            c.globalCompositeOperation = 'source-over';
          } else {
            c.globalAlpha = a; c.fillStyle = rgba(col, 1);
            c.beginPath(); c.arc(x, y, max(0.5, s), 0, TAU); c.fill();
          }
      }
    }
    c.globalAlpha = 1;
  }

  /* ---- 반딧불 — 어느 지역에도 있다. 무대가 죽지 않게 하는 최후의 보험. ---- */
  function drawFlies(c, front) {
    var col = bc('_fly'), sc = Ht / 560;
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < FN; i++) {
      var f = flies[i];

  var pCon = Pool(30, function () { return { x:0,y:0,vx:0,vy:0,tx:0,ty:0,px:0,py:0,cx:0,cy:0,age:0,ttl:1,dly:0,ph:0,rot:0,rv:0,sz:8,sz2:1,t1:0,el:null }; });
  var pShf = Pool(6,  function () { return { x:0,y:0,w:10,h:40,age:0,ttl:1,ci:0,a0:1 }; });
  var POOLS = [pNum, pSpk, pPuf, pRng, pClw, pStr, pCon, pShf];

  /* 계수정렬 버킷 — 스파크를 색×투명도×굵기로 뭉쳐 stroke 를 수십 번으로 줄인다 */
  var skCnt = new Int32Array(NKEY + 1), skOrd = new Int32Array(pSpk.cap);

  /* 숫자 분산용 최근 위치 링 */
  var RC = 16, recent = [], rci = 0, _pt = { x: 0, y: 0 };
  (function () { for (var i = 0; i < RC; i++) recent.push({ x: -1e5, y: -1e5, t: -99 }); })();

  /* 자동터치 집계 */
  var MERGE_RATE = 8;
  var atBuf = new Float32Array(48), atI = 0;
  (function () { for (var i = 0; i < 48; i++) atBuf[i] = -99; })();
  var merged = false;
  var acc = { sum: 0, n: 0, x: 0, y: 0, crit: false, boss: false, t0: 0, last: -99 };

  var refLog = 0, refInit = false;

  /* ---- 치수 ---- */
  function resize() {
    var rect = host.getBoundingClientRect();
    var w = max(1, Math.round(rect.width));
    var h = max(1, Math.round(rect.height || w * 0.56));
    mobile = w < 560;
    var d = min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
    if (w === Wd && h === Ht && d === dpr) return;
    Wd = w; Ht = h; dpr = d;
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    U = clamp(Ht * 0.036, 11, 25);
  }

  function numLimit() { return RM ? 10 : mobile ? 14 : 24; }
  function budget() {
    var l = pSpk.load();
    var b = l > 0.84 ? 0.30 : l > 0.62 ? 0.62 : 1;
    return b * (mobile ? 0.70 : 1);
  }
  function fireV() { return (W.Scene && W.Scene.fire) ? W.Scene.fire() : 1; }
  function after(sec, fn) { timers.push({ t: sec, fn: fn }); wake(); }

  /* ─────────────────── 8. 생성기 ─────────────────── */

  function spark(x, y, ang, spd, life, ci, wi, grav, tl) {
    var s = pSpk.get();
    s.x = x; s.y = y;
    s.vx = cos(ang) * spd; s.vy = sin(ang) * spd;
    s.ttl = life; s.g = grav; s.ci = ci; s.wi = wi;
    s.tl = tl; s.drag = 0.10; s.wob = 0; s.wph = rnd() * TAU; s.a0 = 1;
    return s;
  }
  function puff(x, y, sz, ci, a0, ttl, vy) {
    var p = pPuf.get();
    p.x = x; p.y = y; p.sz = sz; p.ci = ci; p.a0 = a0; p.ttl = ttl;
    p.vx = rr(-1, 1) * Ht * 0.05; p.vy = vy;
    return p;
  }
  function ring(x, y, r0, r1, ttl, ci, w, flat, a0) {
    var r = pRng.get();
    r.x = x; r.y = y; r.r0 = r0; r.r1 = r1; r.ttl = RM ? ttl * 0.7 : ttl;
    r.ci = ci; r.w = w; r.flat = flat == null ? 1 : flat; r.a0 = a0 == null ? 1 : a0;
    return r;
  }
  function shaft(x, y, w, h, ttl, ci, a0) {
    var s = pShf.get();
    s.x = x; s.y = y; s.w = w; s.h = h; s.ttl = ttl; s.ci = ci; s.a0 = a0 == null ? 1 : a0;
    return s;
  }
  function clawMark(x, y, ang, len, n, wid, ci, ttl) {
    var k = pClw.get(), i;
    k.x = x; k.y = y; k.ang = ang; k.len = len; k.n = n; k.w = wid; k.ci = ci;
    k.ttl = RM ? ttl * 0.7 : ttl;
    k.gap = wid * 2.5 + len * 0.055;
    k.bow = len * rr(0.05, 0.12) * sgn();
    k.rev = RM ? 0.02 : 0.105;
    for (i = 0; i < 6; i++) k.jit[i] = rnd();
    return k;
  }

  /* 숫자를 겹치지 않게 놓는다. 최근 0.42초 안에 뜬 숫자들과 거리를 재고
   * 가로 레인을 한 칸씩 밀어본다. 자리가 없으면 제일 덜 겹치는 칸에 둔다. */
  var OFFS = [0, -1, 1, -0.55, 0.55, -1.55, 1.55, -2.1, 2.1, -2.65, 2.65];
  function place(x, y, w, h) {
    var bx = x, by = y, bs = -1, k, j;
    for (k = 0; k < OFFS.length; k++) {
      var cx = x + OFFS[k] * w * 0.80;
      var cy = y - abs(OFFS[k]) * h * 0.34;
      var s = 1e9;
      for (j = 0; j < RC; j++) {
        var r = recent[j];
        if (t - r.t > 0.42) continue;
        var dx = (cx - r.x) / w, dy = (cy - r.y) / h;
        var d = dx * dx + dy * dy;
        if (d < s) s = d;
      }
      if (s >= 1) { bx = cx; by = cy; bs = s; break; }
      if (s > bs) { bs = s; bx = cx; by = cy; }
    }
    var rc = recent[rci]; rci = (rci + 1) % RC;
    rc.x = bx; rc.y = by; rc.t = t;
    var hw = w * 0.5 + U * 0.25;
    _pt.x = Wd > hw * 2 ? clamp(bx, hw, Wd - hw) : Wd * 0.5;
    _pt.y = clamp(by, h * 0.7, Ht - h * 0.35);
  }

  function magFactor(a) {
    if (!(a > 0)) return 1;
    var L = lg(a + 1) / Math.LN10;
    if (!refInit) { refLog = L; refInit = true; }
    var f = clamp(1 + (L - refLog) * 0.34, 0.80, 1.48);
    refLog += (L - refLog) * 0.055;
    return f;
  }
  function reapNum() {
    var a = pNum.a, b = -1, ba = -1;
    for (var i = 0; i < a.length; i++) if (a[i].on && a[i].age > ba) { ba = a[i].age; b = i; }
    if (b >= 0) pNum.put(a[b]);
  }

  function spawnNum(x, y, txt, style, amount, mult) {
    var st = NST[style];
    if (pNum.live >= numLimit()) reapNum();
    var n = pNum.get();
    var f = magFactor(amount);
    n.size = U * st.sz * (style === S_STREAM || style === S_AUTO ? 1 : f);
    /* 실제 글자 폭을 여기서 한 번만 잰다. 배치·클램프·장식이 전부 이 값을 쓰고,
     * 매 프레임 measureText 하던 것도 없어진다. */
    ctx.font = st.wt + ' ' + r3(n.size) + 'px ' + F_MONO;
    n.tw = ctx.measureText(txt).width;
    var boxW = n.tw + (mult > 1 ? n.size * 0.9 : 0) + n.size * 0.45;
    place(x, y, boxW, n.size * 1.5);
    n.x = _pt.x; n.y = _pt.y;
    n.vx = rr(-1, 1) * Ht * st.dx;
    n.vy = Ht * st.vy * rr(0.92, 1.08);
    n.g = Ht * st.g;
    n.ttl = st.ttl * (RM ? 0.74 : 1);
    n.txt = txt; n.st = style; n.ci = st.col; n.glow = st.glow;
    n.pop = RM ? st.pop * 0.28 : st.pop;
    n.rot = 0; n.rv = RM ? 0 : rr(-1, 1) * st.rot;
    n.mult = mult || 0; n.wt = st.wt;
    wake();
    return n;
  }

  /* 타격 스파크 — 종류마다 형태가 다르다 */
  function emit(x, y, kn, power, crit) {
    var K = KINDS[kn] || KINDS.claw, i, a, sp, wi;
    var bq = budget();
    var n = Math.round(rr(K.n[0], K.n[1]) * power * (crit ? 1.7 : 1) * (RM ? 0.38 : 1) * bq);
    var base = K.dir != null ? K.dir : rr(0, TAU);
    var fv = 0.86 + fireV() * 0.14;

    for (i = 0; i < n; i++) {
      if (K.cone) a = base + rr(-1, 1) * K.cone;
      else if (K.low) a = -PI * 0.5 + rr(-1, 1) * 1.18;           /* 지면 타격은 위로 낮게 퍼진다 */
      else a = rr(0, TAU);
      sp = rr(K.spd[0], K.spd[1]) * Ht * (crit ? 1.28 : 1);
      wi = K.wi[0] + ((rnd() * (K.wi[1] - K.wi[0] + 1)) | 0);
      var s = spark(x + rr(-1, 1) * U * 0.55, y + rr(-1, 1) * U * 0.55, a, sp,
        rr(K.life[0], K.life[1]) * (RM ? 0.7 : 1),
        crit && i % 4 === 0 ? C_CORE : K.col[(rnd() * K.col.length) | 0],
        min(wi, NW - 1), Ht * K.grav, rr(K.tl[0], K.tl[1]));
      s.a0 = fv;
    }

    /* 발톱 — 짧은 자상 3줄 */
    if (K.marks) {
      var ma = rr(-0.95, -0.42) * (rnd() < 0.5 ? 1 : -1);
      clawMark(x, y, ma, U * rr(1.5, 2.1) * (crit ? 1.35 : 1), crit ? 4 : 3,
        U * 0.10 * (crit ? 1.3 : 1), crit ? C_CORE : C_EMBER, 0.34);
    }
    /* 이빨 — 맞물리는 턱 두 짝 */
    if (K.jaw && !RM) {
      var ja = rr(0, TAU);
      ring(x, y, U * 1.5, U * 0.45, 0.28, C_DEEP, U * 0.30, 1, 0.8);
      for (i = 0; i < 2; i++) {
        clawMark(x + cos(ja + i * PI) * U * 0.75, y + sin(ja + i * PI) * U * 0.75,
          ja + i * PI + PI * 0.5, U * 1.25, 2, U * 0.13, C_CORE, 0.26);
      }
    }
    /* 밟기 — 지면에 납작한 고리 + 먼지 기둥 */
    if (K.dust) {
      var dn = Math.round(K.dust * bq * (RM ? 0.4 : 1) * (mobile ? 0.6 : 1));
      for (i = 0; i < dn; i++) {
        puff(x + rr(-1, 1) * U * 1.6, y + rr(-0.2, 0.5) * U, U * rr(1.1, 2.0),
          rnd() < 0.4 ? C_EMBER : C_INK, rr(0.10, 0.20), rr(0.5, 0.95), -Ht * rr(0.04, 0.11));
      }
    }
    if (K.ring) {
      ring(x, y, U * 0.4, U * K.ring * 3.2 * (crit ? 1.35 : 1), K.flat ? 0.46 : 0.36,
        crit ? C_CORE : C_EMBER, U * 0.16, K.flat || 1, 0.9);
    }
    if (crit) ring(x, y, U * 0.3, U * 3.4, 0.34, C_CORE, U * 0.14, 1, 0.80);
    var sk = K.shake * (crit ? 1.9 : 1) * clamp(power, 0.6, 1.6);
    if (sk > 0.02) F.shake(sk);
  }

  /* ─────────────────── 9. 자동터치 합산 ─────────────────── */
  /* 초당 15~25 발이 꽂히는데 숫자를 하나씩 띄우면 화면이 숫자 죽이 된다.
   * 초당 8발을 넘는 순간 개별 숫자를 끄고, 0.4초치를 모아 하나로 터뜨린다.
   * 그동안 손맛은 밀도 높은 스파크가 책임진다. */
  function autoRate() {
    var c = 0;
    for (var i = 0; i < 48; i++) if (t - atBuf[i] < 0.70) c++;
    return c / 0.70;
  }
  function flushAcc() {
    if (acc.n <= 0) { acc.t0 = t; return; }
    var n = spawnNum(acc.x, acc.y, fmt(acc.sum), acc.crit ? S_CRIT : S_STREAM, acc.sum, acc.n);
    if (acc.boss) n.ci = C_EMBER;
    ring(acc.x, acc.y, U * 0.4, U * 2.7, 0.34, C_FLY, U * 0.12, 1, 0.65);
    acc.sum = 0; acc.n = 0; acc.crit = false; acc.boss = false; acc.t0 = t;
  }
  function emitAutoDense(x, y, crit) {
    var bq = budget(), i;
    var n = Math.round((crit ? 7 : 3) * bq * (RM ? 0.4 : 1));
    for (i = 0; i < n; i++) {
      var s = spark(x + rr(-1, 1) * U * 0.6, y + rr(-1, 1) * U * 0.6, rr(0, TAU),
        rr(0.10, 0.38) * Ht, rr(0.07, 0.18) * (RM ? 0.7 : 1),
        rnd() < 0.22 ? C_CORE : C_FLY, 0, Ht * 0.5, rr(0.010, 0.021));
      s.a0 = 0.92;
    }
    if (t - autoPulse > 0.11 && !RM) {
      autoPulse = t;
      ring(x, y, U * 0.25, U * rr(1.0, 1.8), 0.20, C_FLY, U * 0.075, 1, 0.45);
    }
  }
  function autoHit(x, y, amount, crit, boss) {
    atBuf[atI] = t; atI = (atI + 1) % 48;
    autoX = autoX ? lerp(autoX, x, 0.40) : x;
    autoY = autoY ? lerp(autoY, y, 0.40) : y;
    autoHeat = min(1, autoHeat + 0.10);

    if (autoRate() >= MERGE_RATE) {
      if (!merged) { merged = true; acc.t0 = t; }
      acc.sum += amount; acc.n++; acc.last = t;
      acc.x = acc.n === 1 ? x : lerp(acc.x, x, 0.40);
      acc.y = acc.n === 1 ? y : lerp(acc.y, y, 0.40);
      if (crit) acc.crit = true;
      if (boss) acc.boss = true;
      emitAutoDense(x, y, crit);
      if (t - acc.t0 >= 0.40 || acc.n >= 28) flushAcc();
      if (crit) F.shake(0.06);
    } else {
      if (merged) { merged = false; flushAcc(); }
      spawnNum(x, y, fmt(amount), crit ? S_CRIT : S_AUTO, amount, 0);
      emit(x, y, 'auto', 1, crit);
    }
    wake();
  }

  /* ─────────────────── 10. 공개 이펙트 ─────────────────── */

  F.hit = function (x, y, o) {
    o = o || {};
    x = +x || 0; y = +y || 0;
    var amount = +o.amount || 0, crit = !!o.crit, boss = !!o.boss;
    var kind = KINDS[o.kind] ? o.kind : 'claw';
    if (kind === 'auto') { autoHit(x, y, amount, crit, boss); return F; }

    spawnNum(x, y, fmt(amount), crit ? S_CRIT : boss ? S_BOSS : S_NORM, amount, 0);
    emit(x, y, kind, boss ? 1.3 : 1, crit);
    if (boss) ring(x, y, U * 0.5, U * 3.4, 0.36, C_DEEP, U * 0.11, 1, 0.42);
    if (crit) autoFlash(boss ? PAL.deep : PAL.core, 100, boss ? 0.22 : 0.18);
    return F;
  };

  F.tap = function (x, y, o) {
    o = o || {};
    x = +x || 0; y = +y || 0;
    var crit = !!o.crit, i;
    var n = crit ? 5 : 3 + ((rnd() * 2) | 0);
    var ang = rr(-1.05, -0.50) * sgn();
    var len = U * rr(2.6, 3.5) * (crit ? 1.28 : 1);
    clawMark(x, y, ang, len, n, U * 0.115 * (crit ? 1.30 : 1),
      crit ? C_CORE : C_EMBER, crit ? 0.46 : 0.38);
    var bq = budget(), m = Math.round((crit ? 13 : 7) * bq * (RM ? 0.4 : 1));
    for (i = 0; i < m; i++) {
      spark(x + rr(-1, 1) * len * 0.34, y + rr(-1, 1) * len * 0.30,
        ang + PI * 0.5 * sgn() + rr(-0.5, 0.5), rr(0.16, 0.54) * Ht,
        rr(0.13, 0.30) * (RM ? 0.7 : 1), rnd() < 0.30 ? C_CORE : C_EMBER,
        rnd() < 0.5 ? 0 : 1, Ht * 1.0, rr(0.026, 0.046));
    }
    ring(x, y, U * 0.3, U * (crit ? 2.7 : 1.8), crit ? 0.34 : 0.26,
      crit ? C_CORE : C_EMBER, U * 0.10, 1, crit ? 0.9 : 0.5);
    F.shake(crit ? 0.20 : 0.09);
    wake();
    return F;
  };

  F.poof = function (x, y, palette) {
    x = +x || 0; y = +y || 0;
    var opt = (palette && typeof palette === 'object' && !palette.length) ? palette : null;
    var cols = normPal(opt ? opt.colors : palette);
    var hh = opt && opt.h ? +opt.h : U * 4.4;
    var ww = opt && opt.w ? +opt.w : hh * 0.70;
    var N = RM ? 7 : mobile ? 9 : 13;
    var y0 = y + hh * 0.5, i, s;
    for (i = 0; i < N; i++) {
      var f = i / (N - 1);
      s = pStr.get();
      s.h = hh / N * 1.08;
      s.w = ww * silW(f) * rr(0.90, 1.08);
      s.x = x + rr(-1, 1) * ww * 0.04;
      s.y = y0 - f * hh - s.h * 0.5;
      s.vy = -(0.13 + f * 0.27) * Ht * (RM ? 0.42 : 1);
      s.vx = (i % 2 ? 1 : -1) * rr(0.018, 0.090) * Ht * (RM ? 0.3 : 1);
      s.dly = (1 - f) * 0.055 + rr(0, 0.035);
      s.ttl = rr(0.62, 0.94) * (RM ? 0.68 : 1);
      s.col = cmix(cols[i % cols.length], PAL.soot, 0.34);
      s.rim = cmix(PAL.ember, PAL.core, rnd() * 0.55);
      s.flash = 1; s.sx = 1; s.rot = 0;
      s.rv = RM ? 0 : rr(-1, 1) * 0.9;
    }
    var bq = budget(), m = RM ? 4 : Math.round(11 * bq);
    for (i = 0; i < m; i++) {
      var sp = spark(x + rr(-1, 1) * ww * 0.45, y0 - rnd() * hh, -PI * 0.5 + rr(-0.45, 0.45),
        rr(0.08, 0.26) * Ht, rr(0.55, 1.05) * (RM ? 0.55 : 1), C_SOUL, 0, -Ht * 0.06, rr(0.030, 0.060));
      sp.wob = Ht * 0.05; sp.drag = 0.5;
    }
    ring(x, y, U * 0.5, U * 3.2, 0.42, C_SOUL, U * 0.13, 1.25, 0.70);
    if (!RM) puff(x, y0 - hh * 0.3, ww * 1.1, C_SOUL, 0.12, 0.75, -Ht * 0.05);
    F.shake(0.16);
    autoFlash(PAL.soul, 110, 0.13);
    wake();
    return F;
  };

  F.coins = function (fx, fy, toEl, n) {
    fx = +fx || 0; fy = +fy || 0;
    var r = rectIn(toEl);
    var tx = r ? r.x : Wd * 0.5, ty = r ? r.y : Ht * 0.05;
    n = clamp(n | 0 || 8, 1, 60);
    var m = min(n, RM ? 5 : mobile ? 9 : 14), i;
    for (i = 0; i < m; i++) {
      var c = pCon.get();
      c.x = c.px = fx; c.y = c.py = fy;
      c.tx = tx; c.ty = ty;
      c.vx = rr(-1, 1) * Ht * 0.30;
      c.vy = -rr(0.22, 0.48) * Ht;
      c.dly = i * 0.042 + rr(0, 0.03);
      c.ph = 0; c.t1 = 0; c.sz2 = 1;
      c.ttl = RM ? 0.40 : rr(0.50, 0.64);
      c.rot = rr(0, TAU); c.rv = RM ? 0 : rr(-1, 1) * 3.0;
      c.sz = U * rr(0.48, 0.66);
      c.el = toEl || null;
    }
    wake();
    return F;
  };

  F.levelUp = function (el) {
    var r = rectIn(el);
    var x = r ? r.x : Wd * 0.5, y = r ? r.y : Ht * 0.62;
    var rad = r ? max(U * 1.6, max(r.w, r.h) * 0.5) : U * 2.4;
    ring(x, y, rad * 0.35, rad * 2.1, 0.52, C_EMBER, U * 0.18, 1, 0.95);
    after(0.09, function () { ring(x, y, rad * 0.25, rad * 2.9, 0.62, C_CORE, U * 0.11, 1, 0.65); });
    shaft(x, y + rad * 0.6, rad * 1.6, rad * 4.2, 0.62, C_EMBER, 0.55);
    var bq = budget(), m = RM ? 5 : Math.round(15 * bq), i;
    for (i = 0; i < m; i++) {
      var s = spark(x + rr(-1, 1) * rad * 0.85, y + rr(-0.2, 0.9) * rad,
        -PI * 0.5 + rr(-0.35, 0.35), rr(0.10, 0.30) * Ht,
        rr(0.45, 0.85) * (RM ? 0.55 : 1), rnd() < 0.3 ? C_CORE : C_FLY, 0, -Ht * 0.04, rr(0.025, 0.05));
      s.wob = Ht * 0.045; s.drag = 0.45;
    }
    autoFlash(PAL.ember, 130, 0.15);
    F.shake(0.10);
    wake();
    return F;
  };

  F.milestone = function (el, text) {
    var r = rectIn(el);
    var x = r ? r.x : Wd * 0.5, y = r ? r.y - r.h * 0.46 : Ht * 0.42, i;
    var tag = mk('div', 'wl-fx-tag', null);

  function step(dt) {
    t += dt;
    var i, k;

    /* 타이머 */
    for (i = timers.length - 1; i >= 0; i--) {
      timers[i].t -= dt;
      if (timers[i].t <= 0) { var fn = timers[i].fn; timers.splice(i, 1); fn(); }
    }

    /* 카메라 충격 — 무대를 안 움직이고 FX 만 흔든다(Scene 이 있으면 그쪽에도 전달됨) */
    camX = camY = 0;

    if (flashT > 0) flashT = max(0, flashT - dt);
    if (autoHeat > 0) autoHeat = max(0, autoHeat - dt * 1.30);
    if (warnPulse > 0) warnPulse = max(0, warnPulse - dt * 3.0);

    /* 자동터치가 멎으면 남은 누적을 털고 개별 숫자로 돌아간다 */

    else if (merged && t - acc.last > 0.34) merged = false;

    /* 제한시간 */
    if (warnLeft > 0) {
      warnLeft = max(0, warnLeft - dt);
      var frac = warnTot > 0 ? warnLeft / warnTot : 0;
      var str = mmss(warnLeft);
      if (str !== warnStr) { warnStr = str; if (elWarn) elWarn._n.textContent = str; }
      var hot = frac < 0.34;
      if (hot !== warnHot) { warnHot = hot; if (elWarn) elWarn.classList.toggle('hot', hot); }

    /* 숫자 */
    var a = pNum.a, o;
    for (i = 0; i < a.length; i++) {
      o = a[i]; if (!o.on) continue;
      o.age += dt;
      if (o.age >= o.ttl) { pNum.put(o); continue; }
      o.vy += o.g * dt;
      o.vx *= pw(0.30, dt);
      o.x += o.vx * dt; o.y += o.vy * dt;
      o.rot += o.rv * dt;
    }
    /* 스파크 */
    a = pSpk.a;
    for (i = 0; i < a.length; i++) {
      o = a[i]; if (!o.on) continue;

      o.vy += o.g * dt;
      k = pw(o.drag, dt);

    a = pPuf.a;
    for (i = 0; i < a.length; i++) {
      o = a[i]; if (!o.on) continue;
      o.age += dt;
      if (o.age >= o.ttl) { pPuf.put(o); continue; }

      o.vy *= pw(0.35, dt); o.vx *= pw(0.25, dt);

    /* 고리 */

      if (o.age >= o.ttl) pRng.put(o);

    /* 발톱자국 */

    /* 실루엣 스트립 */

  S.tapAcc += fireRate * dt;
  var n = flr(S.tapAcc);
  S.tapAcc -= n;
  S.liveRate = lerp(S.liveRate, fireRate, min(1, dt * 5));

  if (n > 0) {
    S.fired += n; S.firedAuto += n;
    S.dmgAuto += n * power * p.tv;
    /* 프레임당 배치 — core.tap 은 40회 초과분을 비례 환산한다. 그래도 덩어리로 끊어 넘긴다. */
    var left = n;
    while (left > 0) {
      var k = min(left, 40);
      try {
        if (scaled) ctx.tapScaled(k, power);
        else ctx.tap(k);
      } catch (e) {}
      left -= k;
    }
  }
}

/* ─────────────────── 11. 시전 ─────────────────── */
function condOk(def) {
  if (def.cond === 'boss') return safeB(ctx.isBoss);
  if (def.cond === 'enemy') return true;
  return true;
}
function canCast(id) {
  var d = BY[id], s = S.sk[id];
  if (!d || !s || !ctx) return false;
  if (!s.u) return false;
  if (s.cd > 0) return false;
  if (d.auto && s.left > 0) return false;          // 자동터치는 겹쳐 쏘지 않는다
  return condOk(d);
}
function cast(id) {
  if (!canCast(id)) return false;
  var d = BY[id], s = S.sk[id], lv = s.lv, v = derive(d, lv).v;
  var boss = safeB(ctx.isBoss);

  s.cd = cdOf(d, lv);
  s.left = durOf(d, lv);
  s.used++;
  ver++; dirty = true;

  switch (id) {
    case 'thunder': {
      var dmg = boom(v.burst, 'stomp');
      ribbon('⚡ 뇌전 일격 — ' + fmt(dmg), 'gold');
      break;
    }
    case 'execute': {
      if (boss) {
        var mx = safe(ctx.enemyMax);
        var pct = v.bossPct + (synOn('gravekeep') ? 0.03 : 0);
        var dd = mx > 0 ? mx * pct : 0;
        if (dd <= 0) dd = boom(CAPS.burstSec * 0.5, 'stomp');
        else { if (ctx.hurt) { try { ctx.hurt(dd); } catch (e) {} } fxBurst(dd, true); }
        ribbon('✂ 목줄 끊기 — 보스 ' + Math.round(pct * 100) + '% (' + fmt(dd) + ')', 'gold');
      } else {
        killOne('✂ 목줄 끊기 — 숨통을 끊었다');
        S.execMark = 8;
      }
      break;
    }
    case 'stampede': {
      var wv = Math.round(v.waves) + (synOn('cullchain') ? 2 : 0);
      S.execMark = 0;
      S.chain = { left: wv, t: 0 };
      ribbon('≫ 질풍 연쇄 — ' + wv + '웨이브', 'good');
      break;
    }
    case 'emberlife': {
      var add = v.time + (synOn('gravekeep') ? 4 : 0);
      add = min(add, CAPS.bossTime);
      if (ctx.bossTimeAdd) { try { ctx.bossTimeAdd(add); } catch (e) {} }
      var f = FX(); if (f && f.flash) f.flash('#FF9333', 200, 0.42);
      ribbon('🜂 불씨 연명 — 제한시간 +' + Math.round(add) + '초', 'gold');
      break;
    }
    case 'bosshunt': {
      if (boss) { var b = boom(v.burst, 'stomp'); ribbon('✦ 거수 토벌 — 급소 ' + fmt(b), 'gold'); }
      else ribbon('✦ 거수 토벌 — 무리가 숨을 죽인다', 'good');
      break;
    }
    case 'breath': {
      var cut = v.instant;
      for (var i = 0; i < CATALOG.length; i++) {
        var o = CATALOG[i];
        if (o.id === 'breath') continue;
        var os = S.sk[o.id];
        if (os.cd > 0) os.cd = max(0, os.cd - pick(o.cd, os.lv) * cut);
      }
      ribbon('◎ 숨고르기 — 재사용 −' + Math.round(cut * 100) + '%', 'good');
      break;
    }
    case 'intrude': {
      var aoe = v.aoe * (safe(ctx.enemyCount, 1) > 1 ? 1.35 : 1);
      var dm = boom(aoe, 'stomp');
      ribbon('☾ 어둠 난입 — ' + Math.round(v.beasts) + '마리 (' + fmt(dm) + ')', 'good');
      break;
    }
    default:
      ribbon('✦ ' + d.n + ' 발동', d.tone === 'core' ? 'gold' : 'good');
  }
  return true;
}

/** 눈앞의 일반 적 하나를 처치한다. 피해가 아니라 "처치"다 — 적 체력에 비례한다.
 *  체력을 알 수 없을 때만 폭발 예산에서 꺼내 쓴다. 폴백이 무한 화력이 되면 안 되니까. */
function killOne(msg) {
  var mx = safe(ctx.enemyMax), hp = safe(ctx.enemyHp);
  var d;
  if (mx > 0 || hp > 0) {
    d = max(mx, hp) * 1.02;
    if (ctx.hurt) { try { ctx.hurt(d); } catch (e) {} }
    fxBurst(d, false);
  } else {
    d = boom(CAPS.burstSec, 'stomp');                // 체력 미상 — 예산을 통과한다
  }
  if (msg) ribbon(msg, 'good');
  return d;
}

/* ─────────────────── 12. 틱 ─────────────────── */
function tick(dt) {
  if (!ctx) return;
  dt = clamp(dt || 0, 0, 0.5);
  if (dt <= 0) return;

  S.bank = min(CAPS.burstBank, S.bank + CAPS.burstRefill * dt);
  if (S.execMark > 0) S.execMark = max(0, S.execMark - dt);

  scanUnlocks();

  var i, d, s;
  for (i = 0; i < CATALOG.length; i++) {
    d = CATALOG[i]; s = S.sk[d.id];
    if (s.cd > 0) { s.cd = max(0, s.cd - dt); if (s.cd === 0) dirty = true; }
    if (s.left > 0) { s.left = max(0, s.left - dt); if (s.left === 0) { ver++; dirty = true; } }
  }
  /* 자동 시전 — 해금 + 토글 + 조건이 맞을 때만 */
  for (i = 0; i < CATALOG.length; i++) {
    d = CATALOG[i]; s = S.sk[d.id];
    if (!s.auto || !s.u || s.cd > 0) continue;
    if (!autoWorth(d)) continue;
    cast(d.id);
  }
  /* 연쇄 처치 — 0.32초 간격으로 한 마리씩 */
  if (S.chain && S.chain.left > 0) {
    S.chain.t -= dt;
    if (S.chain.t <= 0) {
      S.chain.t = 0.32;
      if (safeB(ctx.isBoss)) { S.chain = null; ribbon('≫ 연쇄가 보스 앞에서 멎었다', 'bad'); }
      else {
        killOne(null);
        if (ctx.advance) { try { ctx.advance(1); } catch (e) {} }
        S.chain.left--;
        if (S.chain.left <= 0) S.chain = null;
      }
    }
  }
  autoStep(dt);

  /* 방치 피해 누적 — 기여율 표시용 (게임 피해와 무관, 계측만) */
  S.dmgIdle += safe(ctx.dps) * dt;
}
/** 자동 시전이 지금 의미가 있나 */
function autoWorth(d) {
  if (!condOk(d)) return false;
  if (d.auto && S.sk[d.id].left > 0) return false;
  if (d.id === 'emberlife') {
    var t = ctx.bossTime ? safe(ctx.bossTime, 99) : 99;
    return safeB(ctx.isBoss) && t > 0 && t < 12;         // 위기일 때만
  }
  if (d.id === 'execute' || d.id === 'stampede') return !safeB(ctx.isBoss);
  if (d.id === 'thunder') return true;
  return true;
}

/* ─────────────────── 13. 배율 (상한 적용) ─────────────────── */
var _m = null, _mk = '';
function mult() {
  var boss = safeB(ctx && ctx.isBoss);
  var key = ver + '|' + (boss ? 1 : 0);
  if (_m && _mk === key) return _m;

  var dps = 1, click = 1, gold = 1, bt = 0;
  var i, d, s, v;
  for (i = 0; i < CATALOG.length; i++) {
    d = CATALOG[i]; s = S.sk[d.id];
    if (!s.u || !d.v) continue;
    /* 해금만으로 늘 붙는 몫 — 보스 제한시간은 스폰 시점에 읽히므로 지속시간에 묶을 수 없다 */
    if (d.passiveBossTime) bt += pick(d.v.keep, s.lv);
    if (s.left <= 0) continue;
    v = derive(d, s.lv).v;
    if (d.id === 'bosshunt') {
      if (boss) {
        var bonus = synOn('gravekeep') ? 0.30 : 0;
        dps *= (v.dps + bonus);
        click *= v.click;
      }
      continue;
    }
    if (d.id === 'intrude') {
      dps *= (v.dps + (synOn('nightraid') ? 0.45 : 0));
      continue;
    }
    if (v.dps) dps *= v.dps;
    if (v.gold) gold *= v.gold;
    if (v.click) click *= v.click;
  }
  if (synOn('scent')) gold *= 1.35;

  _mk = key;
  _m = {
    dpsMult:       min(dps, CAPS.dpsMult),
    clickMult:     min(click, CAPS.clickMult),
    goldMult:      min(gold, CAPS.goldMult),
    bossTimeBonus: min(bt, CAPS.bossTime),
    cdrMult:       cdrNow(),
    /* 참고용 원값 — 패널의 "상한에 걸렸다" 표시에 쓴다 */
    raw:           { dps: dps, click: click, gold: gold }
  };
  return _m;
}

/* ─────────────────── 14. 통계 ─────────────────── */
function stats() {
  var p = autoPlan();
  var tot = S.dmgAuto + S.dmgIdle;
  return {
    rate:      S.liveRate,                       // 초당 실제 발사수
    nominal:   p ? p.nominal : 0,
    capRate:   p ? p.capRate : 0,
    power:     p ? p.power : 0,
    share:     p ? p.share : 0,
    tiers:     p ? p.tiers : 0,
    fired:     S.firedAuto,
    realShare: tot > 0 ? S.dmgAuto / tot : 0,    // 누적 실측 기여율
    bank:      S.bank,
    bankPct:   S.bank / CAPS.burstBank,
    scaled:    !!(ctx && ctx.tapScaled)
  };
}

].join('');

function ensureCss() {
  if (doc.getElementById(CSS_ID)) return;
  var s = doc.createElement('style');
  s.id = CSS_ID;
  s.textContent = CSS;
  (doc.head || doc.documentElement).appendChild(s);
}

var barRoot = null, barTiles = null, panelRoot = null, panelRows = null, panelMeters = null, panelSyn = null;
var dirty = true;

function bar() {
  ensureCss();
  if (barRoot) return barRoot;
  barRoot = el('div', 'wl-sk-bar');
  barTiles = {};
  for (var i = 0; i < CATALOG.length; i++) {
    (function (d) {
      var b = el('button', 'wl-sk t-' + d.tone);
      b.type = 'button';
      b.title = d.n + ' — ' + d.role;
      var fill = el('i', 'f');
      var adot = el('i', 'a'); adot.style.display = 'none';
      var k = el('i', 'k', d.hot ? String(d.hot) : '·');
      var n = el('b', 'n', d.n);
      var c = el('i', 'c', '—');
      b.appendChild(fill); b.appendChild(adot);
      b.appendChild(k); b.appendChild(n); b.appendChild(c);
      b.onclick = function () { cast(d.id); refresh(); };
      barRoot.appendChild(b);
      barTiles[d.id] = { b: b, fill: fill, a: adot, n: n, c: c };
    })(CATALOG[i]);
  }
  dirty = true;
  refresh();
  return barRoot;
}

function meterRow(label, klass) {
  var s = el('s', null, label), u = el('u'), i = el('i', klass || ''), b = el('b', null, '—');
  u.appendChild(i);
  return { s: s, u: u, i: i, b: b };
}

function panel() {
  ensureCss();
  if (panelRoot) return panelRoot;
  panelRoot = el('div', 'wl-sp');

  /* 상한 계기판 */
  var cap = el('div', 'cap');

  };
  ['dps', 'click', 'gold', 'auto', 'bank', 'cdr'].forEach(function (k) {
    var m = panelMeters[k];
    mtr.appendChild(m.s); mtr.appendChild(m.u); mtr.appendChild(m.b);
  });
  cap.appendChild(mtr);
  panelRoot.appendChild(cap);

  /* 스킬 행 */
  panelRows = {};
  for (var i = 0; i < CATALOG.length; i++) {
    (function (d) {

      ct.appendChild(cb); ct.appendChild(ub); ct.appendChild(tb);
      r.appendChild(hd); r.appendChild(fl); r.appendChild(ef); r.appendChild(nx); r.appendChild(lk); r.appendChild(ct);

      panelRows[d.id] = { r: r, lv: lv, ef: ef, nx: nx, lk: lk, lkt: lkt, lki: lki, ct: ct, cb: cb, ub: ub, tb: tb };

/* ── 갱신 ── (rAF 마다 불려도 문자열이 같으면 DOM 을 안 건드린다) */
function refresh() {
  if (!barRoot && !panelRoot) return;
  var m = mult(), sx = stats(), i, d, s, t;

  if (barRoot) {
    for (i = 0; i < CATALOG.length; i++) {
      d = CATALOG[i]; s = S.sk[d.id]; t = barTiles[d.id];
      if (!t) continue;
      var k = 'wl-sk t-' + d.tone, sub, w = 0;
      if (!s.u) {
        k += ' lock';
        sub = unlockText(d).replace(' 도달', '').replace('회 토벌', ' 보스').replace('종 영입', ' 동료');
        t.b.disabled = true;
        w = unlockProgress(d);                       // 해금까지 얼마나 왔나
      } else if (s.left > 0) {
        k += ' on';
        sub = secs(s.left);
        t.b.disabled = !canCast(d.id);
        w = s.left / max(0.01, durOf(d, s.lv));      // 남은 지속 — 빠져나간다
      } else if (s.cd > 0) {
        k += ' cool';
        sub = Math.ceil(s.cd) + '초';
        t.b.disabled = true;
        w = 1 - s.cd / max(1, cdOf(d, s.lv));        // 충전 — 차오른다
      } else {
        var ok = canCast(d.id);
        k += ok ? ' rdy' : ' cool';
        sub = ok ? '준비' : (d.cond === 'boss' ? '보스 전용' : '대기');
        t.b.disabled = !ok;
        w = ok ? 1 : 0;
      }
      cls(t.b, k);
      sty(t.fill, 'width', (clamp(w, 0, 1) * 100).toFixed(1) + '%');
      txt(t.c, sub);
      sty(t.a, 'display', s.auto && s.u ? 'block' : 'none');
    }
  }

  if (!panelRoot) return;

  /* 계기판 */
  meter(panelMeters.dps,   m.dpsMult,   CAPS.dpsMult,
        '×' + m.dpsMult.toFixed(2) + ' / ' + CAPS.dpsMult.toFixed(2), m.raw.dps > CAPS.dpsMult + 1e-6);
  meter(panelMeters.click, m.clickMult, CAPS.clickMult,
        '×' + m.clickMult.toFixed(2) + ' / ' + CAPS.clickMult.toFixed(2), m.raw.click > CAPS.clickMult + 1e-6);
  meter(panelMeters.gold,  m.goldMult,  CAPS.goldMult,
        '×' + m.goldMult.toFixed(2) + ' / ' + CAPS.goldMult.toFixed(2), m.raw.gold > CAPS.goldMult + 1e-6);
  meter(panelMeters.auto,  sx.share,    CAPS.autoShare,
        sx.tiers ? Math.round(sx.share * 100) + '% / ' + Math.round(CAPS.autoShare * 100) + '%  ·  '
                   + sx.rate.toFixed(1) + '회/초'
                 : '꺼짐',
        sx.tiers > 0 && sx.share >= CAPS.autoShare - 1e-6);
  meter(panelMeters.bank,  sx.bank,     CAPS.burstBank,
        sx.bank.toFixed(1) + ' / ' + CAPS.burstBank + ' dps초', false);
  meter(panelMeters.cdr,   1 - m.cdrMult, 1 - CAPS.cdrMult,
        '×' + m.cdrMult.toFixed(2) + ' / ' + CAPS.cdrMult.toFixed(2), m.cdrMult <= CAPS.cdrMult + 1e-6);

  /* 행 */
  for (i = 0; i < CATALOG.length; i++) {
    d = CATALOG[i]; s = S.sk[d.id];
    var p = panelRows[d.id];
    if (!p) continue;
    var dv = derive(d, s.lv);
    cls(p.r, 'r' + (s.u ? '' : ' lock'));
    txt(p.lv, 'Lv.' + s.lv + (s.lv >= LVMAX ? ' MAX' : ''));

    var line = d.desc(dv.v, dv);
    if (!d.auto && dv.dur > 0) line += ' · 재사용 ' + Math.round(cdOf(d, s.lv)) + '초';
    else if (d.auto) line += ' · 재사용 ' + Math.round(cdOf(d, s.lv)) + '초';
    else line += ' · 재사용 ' + Math.round(cdOf(d, s.lv)) + '초';
    txt(p.ef, line);

    if (s.lv >= LVMAX) { sty(p.nx, 'display', 'none'); }
    else {
      sty(p.nx, 'display', 'block');
      var nv = derive(d, s.lv + 1);
      txt(p.nx, '다음 → ' + d.desc(nv.v, nv));
    }

    if (s.u) {
      sty(p.lk, 'display', 'none');
      sty(p.ct, 'display', 'flex');
      var c = costOf(d.id);
      var afford = isFinite(c) && safe(ctx && ctx.gold) >= c;
      cls(p.ub, 'bt' + (afford ? ' ok' : ''));
      txt(p.ub, isFinite(c) ? '강화 ' + fmt(c) : '강화 완료');
      p.ub.disabled = !afford;
      cls(p.tb, 'tg' + (s.auto ? ' on' : ''));
      txt(p.tb, s.auto ? '자동 시전 ●' : '자동 시전 ○');
      p.tb.disabled = false;
      p.cb.disabled = !canCast(d.id);
      txt(p.cb, s.left > 0 ? '유지 ' + secs(s.left) : s.cd > 0 ? Math.ceil(s.cd) + '초' : '시전');
    } else {
      sty(p.lk, 'display', 'block');
      sty(p.ct, 'display', 'none');
      txt(p.lkt, '잠김 — ' + unlockText(d));
      sty(p.lki, 'width', (unlockProgress(d) * 100).toFixed(0) + '%');
    }
  }

  /* 시너지 */
  for (var j = 0; j < SYNERGY.length; j++) {
    var g = SYNERGY[j], ps = panelSyn[g.id];
    if (!ps) continue;
    var on = false;
    try { on = !!g.test(); } catch (e) {}
    var owned = 0;
    for (var q = 0; q < g.need.length; q++) if (has(g.need[q])) owned++;
    cls(ps.box, 'sy' + (on ? ' on' : ''));
    txt(ps.em, on ? '발동 중' : owned >= 2 ? '대기' : '미해금 ' + (g.need.length - owned));
  }
  dirty = false;
}

function meter(m, v, cap, label, hot) {
  if (!m) return;
  sty(m.i, 'width', clamp(cap > 0 ? v / cap : 0, 0, 1) * 100 + '%');
  /* 상한에 걸린 건 경고가 아니라 설계다. 바는 제 색을 지키고 숫자 색만 바뀐다. */
  txt(m.b, label);
  cls(m.b, hot ? 'max' : '');
}

/* ─────────────────── 16. 나머지 API ─────────────────── */
function setAuto(id, v) {
  var s = S.sk[id];
  if (!s || !s.u) return false;
  s.auto = !!v;
  dirty = true;
  return true;
}
function autoOn(id) { var s = S.sk[id]; return !!(s && s.auto); }

function init(saved, c) {
  ctx = c || null;
  S = blankState();
  try {
    reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  } catch (e) { reduced = false; }

  if (saved && saved.sk) {
    for (var id in saved.sk) {
      if (!S.sk[id]) continue;
      var a = saved.sk[id], b = S.sk[id];
      b.lv   = clamp(a.lv | 0 || 1, 1, LVMAX);
      b.cd   = max(0, +a.cd || 0);
      b.left = max(0, +a.left || 0);
      b.auto = !!a.auto;
      b.u    = !!a.u;
      b.used = a.used | 0;
    }
    if (isFinite(saved.bank)) S.bank = clamp(+saved.bank, 0, CAPS.burstBank);
  }
  ver++;
  scanUnlocks();
  dirty = true;
  if (barRoot || panelRoot) refresh();
  return W.Skills;
}
function serialize() {
  var out = { v: 1, sk: {}, bank: r2(S.bank) };
  for (var id in S.sk) {
    var s = S.sk[id];
    out.sk[id] = { lv: s.lv, cd: r2(s.cd), left: r2(s.left), auto: s.auto, u: s.u, used: s.used };
  }
  return out;
}
function reset() { S = blankState(); ver++; dirty = true; if (barRoot || panelRoot) refresh(); }

/* ─────────────────── 17. 파사드 ─────────────────── */
W.Skills = {
  CATALOG:  CATALOG,
  SYNERGY:  SYNERGY,
  LVMAX:    LVMAX,
  init:     init,
  serialize: serialize,
  tick:     tick,
  cast:     cast,
  canCast:  canCast,
  levelUp:  levelUp,
  costOf:   costOf,
  setAuto:  setAuto,
  autoOn:   autoOn,
  mult:     mult,
  bar:      bar,
  panel:    panel,
  refresh:  refresh,
  /* 부가 */
  state:    function (id) { return S.sk[id]; },
  unlocked: has,
  stats:    stats,
  caps:     function () { var o = {}; for (var k in CAPS) o[k] = CAPS[k]; return o; },
  derive:   function (id, lv) { var d = BY[id]; return d ? derive(d, clamp(lv | 0 || S.sk[id].lv, 1, LVMAX)) : null; },
  cdOf:     function (id) { var d = BY[id]; return d ? cdOf(d, S.sk[id].lv) : 0; },
  durOf:    function (id) { var d = BY[id]; return d ? durOf(d, S.sk[id].lv) : 0; },
  reset:    reset
};

})();

function save() {
  S.last = Date.now();
  if (Sk && Sk.serialize) S.skills = Sk.serialize();
  if (Nu) S.nurture = Nu.serialize();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  var raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); } catch (e) {}
  if (!raw) return false;
  var d;
  try { d = JSON.parse(raw); } catch (e) { return false; }
  var s = blank();
  for (var k in d) if (d[k] !== undefined && d[k] !== null) s[k] = d[k];
  s.pets = new Array(PET_N).fill(0);
  if (Array.isArray(d.pets)) for (var i = 0; i < PET_N && i < d.pets.length; i++) s.pets[i] = d.pets[i] || 0;
  UPS.forEach(function (u) { s.ups[u.k] = (d.ups && d.ups[u.k]) || 0; });
  SOULS.forEach(function (u) { s.sls[u.k] = (d.sls && d.sls[u.k]) || 0; });
  s.v = 2;
  S = s;
  if (D) D.migrate(S);
  if (typeof S.snack !== 'number' || !isFinite(S.snack)) S.snack = 0;
  return true;
}
function offline() {
  var dt = Math.min(maxOffline(), (Date.now() - (S.last || Date.now())) / 1000);
  if (dt < 90) return null;
  var dps = totalDps();
  if (dps <= 0) return null;
  var probe = makeEnemy(S.zone, 1);
  var per = Math.max(0.35, probe.max / dps);
  var kills = Math.floor(dt / per * 0.6);
  if (kills < 1) return null;
  var p = passives();
  var rw = D ? D.rewardFor({ zone: S.zone, wave: 1, kind: 'mob', tier: S.tier, seed: seedOf(),
                             goldMult: goldMultiplier(), snackBonus: p.snackAdd })
             : { gold: 1, snack: 0 };
  var gold = kills * rw.gold, snack = kills * (rw.snack || 0);
  S.gold += gold; S.snack += snack; S.kills += kills; S.played += dt;
  if (Nu) Nu.tick(Math.min(dt, 7200), { owned: ownedList() });
  return { dt: dt, kills: kills, gold: gold, snack: snack };
}

var AIR = { hawk: 1, dragon: 1, condor: 1, quetzal: 1, samjogo: 1, peng: 1 };

  body.querySelectorAll('[data-u]').forEach(function (b) { b.onclick = function () { buyUp(b.dataset.u); }; });
  body.querySelectorAll('[data-sl]').forEach(function (b) { b.onclick = function () { buySoul(b.dataset.sl); }; });
  body.querySelectorAll('[data-tier]').forEach(function (b) { b.onclick = function () { setTier(+b.dataset.tier); }; });
  var a = body.querySelector('#b-asc'); if (a) a.onclick = confirmAscend;
  var rs = body.querySelector('#b-reset'); if (rs) rs.onclick = confirmReset;
  var ex = body.querySelector('#b-export'); if (ex) ex.onclick = doExport;
  var im = body.querySelector('#b-import'); if (im) im.onclick = doImport;
}
function buyUp(k) {
  var u = UPS.filter(function (x) { return x.k === k; })[0], lv = S.ups[k];
  var n = qtyFor(u.c, u.g, lv), cost = geoCost(u.c, u.g, lv, n);
  if (n < 1 || cost > S.gold) return;
  S.gold -= cost; S.ups[k] += n; _ppKey = ''; renderTop(); renderTab();
}
function buySoul(k) {
  var u = SOULS.filter(function (x) { return x.k === k; })[0], lv = S.sls[k], cost = u.c * Math.pow(u.g, lv);
  if (cost > S.souls) return;
  S.souls -= cost; S.sls[k]++; _ppKey = '';
  ribbon(u.n + ' Lv.' + S.sls[k], 'soul');
  renderTop(); renderTab();
}
function setTier(t) {
  if (!D) return;
  if (!D.setTier(S, t)) { ribbon('아직 해금되지 않았다', 'bad'); return; }
  ribbon(D.tierOf(t).n + ' 난이도로 사냥한다', 'good');
  spawn(); renderTab(); paintStage();
}

function panelVisible() {
  if (document.hidden) return false;
  var b = $('#tabbody');
  if (!b) return false;
  var r = b.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight;
}

/* ══ 모달 ══════════════════════════════════════════════════════════════ */
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
function confirmAscend() {
  var gain = soulGain(), start = 1 + 4 * S.sls.path;
  openModal('<h3>환생하시겠습니까</h3><p>존·발자국·동료 레벨이 초기화됩니다. 교감과 도감은 남습니다.<br>' +
    '획득 <span class="num soul">' + fmt(gain) + '</span> 야생혼 (총 ' + fmt(S.souls + gain) + ')<br>' +
    '시작 존 <span class="num">' + start + '</span></p>' +
    '<div class="mrow"><button class="big soulb" id="m-ok">환생</button><button class="big" id="m-no">취소</button></div>');
  $('#m-ok').onclick = ascend; $('#m-no').onclick = closeModal;
}
function ascend() {
  var gain = soulGain();
  if (gain < 1) return;
  var keep = {
    souls: S.souls + gain, sls: S.sls, best: S.best, ascs: S.ascs + 1,
    kills: S.kills, bossKills: S.bossKills, played: S.played, started: S.started,
    seen: S.seen, nurture: Nu ? Nu.serialize() : null, skills: S.skills,
    tier: S.tier, affixSeed: S.affixSeed, snack: S.snack, bestBeaten: S.bestBeaten,
    tierBest: S.tierBest, wallLog: S.wallLog, quality: S.quality, auto: S.auto,
  };
  var fresh = blank();
  for (var k in keep) if (keep[k] !== undefined && keep[k] !== null) fresh[k] = keep[k];
  S = fresh;
  S.zone = 1 + 4 * S.sls.path;
  S.best = Math.max(S.best, S.zone); S.runBest = S.zone;
  _ppKey = '';
  closeModal(); Stage.sync(); spawn(); renderTop(); renderTab();
  ribbon('환생 ' + S.ascs + '회차 — 야생혼 +' + fmt(gain), 'soul');
}
function confirmReset() {
  openModal('<h3>전부 지웁니다</h3><p>야생혼·교감·기록이 모두 사라집니다. 되돌릴 수 없습니다.</p>' +
    '<div class="mrow"><button class="big danger" id="m-ok">초기화</button><button class="big" id="m-no">취소</button></div>');
  $('#m-ok').onclick = function () {
    try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
    S = blank(); if (Nu) Nu.init(null); _ppKey = '';
    closeModal(); Stage.sync(); spawn(); renderTop(); renderTab();
  };
  $('#m-no').onclick = closeModal;
}
function doExport() {
  save();
  var txt = '';
  try { txt = btoa(unescape(encodeURIComponent(localStorage.getItem(KEY) || ''))); } catch (e) {}
  openModal('<h3>저장 내보내기</h3><p>아래 문자열을 복사해 보관하세요.</p>' +
    '<textarea id="m-txt" readonly style="width:100%;height:120px;background:#0E1119;color:var(--ink);border:1px solid var(--line);' +
    'font-family:var(--num);font-size:10px;padding:8px;border-radius:2px">' + txt + '</textarea>' +
    '<button class="big" id="m-no">닫기</button>');
  $('#m-txt').select();
  $('#m-no').onclick = closeModal;
}
function doImport() {
  openModal('<h3>저장 불러오기</h3><p>내보낸 문자열을 붙여넣으세요. 현재 진행은 덮어씁니다.</p>' +
    '<textarea id="m-txt" style="width:100%;height:120px;background:#0E1119;color:var(--ink);border:1px solid var(--line);' +
    'font-family:var(--num);font-size:10px;padding:8px;border-radius:2px"></textarea>' +
    '<div class="mrow"><button class="big" id="m-ok">불러오기</button><button class="big" id="m-no">취소</button></div>');
  $('#m-no').onclick = closeModal;
  $('#m-ok').onclick = function () {
    var v = $('#m-txt').value.trim();
    try {
      var json = decodeURIComponent(escape(atob(v)));
      JSON.parse(json);
      localStorage.setItem(KEY, json);
      location.reload();
    } catch (e) { ribbon('불러오기 실패 — 문자열을 확인하세요', 'bad'); }
  };
}

/* ══ 입력 ══════════════════════════════════════════════════════════════ */
function bindInput() {
  var stage = $('#stage');
  $('#tap').addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    var r = $('#stage').getBoundingClientRect();
    tap(1, { x: e.clientX - r.left, y: e.clientY - r.top });
  });
  $('#b-auto').onclick = function () { S.auto = !S.auto; paintStage(); };
  $('#b-quality').onclick = function () {
    S.quality = (S.quality + 2) % 3;
    var names = ['연출 끔', '연출 약', '연출 강'];
    $('#b-quality').textContent = names[S.quality];
    if (Cr && Cr.quality) Cr.quality(S.quality);
    if (Sc && Sc.quality) Sc.quality(S.quality);
    if (navigator.vibrate) navigator.vibrate(8);
  };
  $('#tabs').onclick = function (e) {
    var t = e.target.closest('.tab');
    if (t) { S.tab = t.dataset.t; renderTab(); }
  };
  $('#modal').onclick = function (e) { if (e.target.id === 'modal') closeModal(); };
  addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); tap(1); }
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9 && Sk && Sk.CATALOG && Sk.CATALOG[n - 1]) Sk.cast(Sk.CATALOG[n - 1].id);
  });
  addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  addEventListener('beforeunload', save);
}

/* ══ 루프 ══════════════════════════════════════════════════════════════ */
function logic(dt) {
  S.played += dt;
  if (Sk && Sk.tick) Sk.tick(dt);
  if (Nu) Nu.tick(dt, { owned: ownedList() });
  if (S.hp > 0) hurt(totalDps() * dt, { silent: true });
  if (cur && cur.info.boss && S.bt > 0) {
    S.bt -= dt;
    if (FX && FX.bossWarn && S.bt < 8) FX.bossWarn(S.bt);
    if (S.bt <= 0 && S.hp > 0) bossFail();
  }
}
function boot() {
  if (!C || !D) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">콘텐츠 모듈을 불러오지 못했습니다.</p>'; return; }
  var had = load();
  if (Nu) Nu.init(S.nurture);
  Sk.init && Sk.init(S.skills, {
    dps: totalDps,
    clickDamage: clickDamage,
    tap: function (n) { tap(n, { auto: true }); },
    tapScaled: function (n, p) { tapScaled(n, p); },
    hurt: function (d) { hurt(d, { skill: true }); },
    zone: function () { return S.zone; },
    bestZone: function () { return S.best; },
    bossKills: function () { return S.bossKills; },
    petsOwned: function () { return passives().owned; },
    isBoss: function () { return !!(cur && cur.info.boss); },
    enemyHp: function () { return S.hp; },
    enemyMax: function () { return cur ? cur.max : 0; },
    enemyCount: function () { return cur ? (cur.mod.count || 1) : 1; },
    advance: function (n) { for (var k = 0; k < Math.max(1, n | 0) && cur; k++) { S.hp = 0; kill(); } },
    bossTimeAdd: function (sec) { if (cur && cur.info.boss) S.bt += sec; },
    bossTime: function () { return cur && cur.info.boss ? S.bt : 0; },
    critChance: function () { return passives().critChance; },
    gold: function () { return S.gold; },
    spend: function (g) { if (S.gold >= g) { S.gold -= g; _ppKey = ''; return true; } return false; },
    fx: function () { return FX; },
    foe: function () { var p = Stage.foePos(); return { x: p.x, y: p.y, w: 60, h: 60 }; },
  });
  Stage.mount();
  bindInput();
  spawn(true);
  Stage.sync();
  if (Cr && Cr.quality) Cr.quality(S.quality);
  if (Cr && Cr.autoQuality) Cr.autoQuality(true);
  var off = had ? offline() : null;
  renderTop(); renderTab(); paintStage(); renderSkills();
  if (off) {
    openModal('<h3>불은 꺼지지 않았다</h3><p>자리를 비운 시간 <span class="num">' + time(off.dt) + '</span><br>' +
      '무리가 사냥한 짐승 <span class="num">' + fmt(off.kills) + '</span>마리<br>' +
      '발자국 <span class="num">' + fmt(off.gold) + '</span>' + (off.snack > 0 ? ' · 간식 <span class="num">' + fmt(off.snack) + '</span>' : '') + '</p>' +
      '<button class="big" id="m-ok">받기</button>');
    $('#m-ok').onclick = function () { closeModal(); chatterSome('back'); };
  } else if (!had) {
    ribbon('불을 지폈다. 적을 터치해 사냥을 시작하라.', 'good');
  }

  var prev = performance.now();
  setInterval(function () {
    var now = performance.now(), dt = Math.min(0.5, (now - prev) / 1000);
    prev = now;
    logic(dt);
  }, 100);

  var vprev = performance.now(), accHud = 0, accSk = 0, accPlace = 0, accTab = 0;
  var placeStep = (isPhone() || LOWEND) ? 1 / 30 : 0;      /* 폰은 30fps 배치로 충분하다 */
  (function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.25, (t - vprev) / 1000); vprev = t;
    if (document.hidden) return;
    accPlace += dt;
    if (accPlace >= placeStep) { Stage.beat(accPlace); accPlace = 0; }
    accHud += dt;
    if (accHud >= 0.1) { accHud = 0; paintStage(); renderTop(); }      /* 10fps — 사람 눈엔 충분 */
    accSk += dt;
    if (accSk >= 0.2) { accSk = 0; renderSkills(); }
    accTab += dt;
    if (accTab >= 0.5) { accTab = 0; if (panelVisible()) renderTab(); }
  })(performance.now());
  setInterval(save, 10000);
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
