[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Original full-size photos are source files only (the pages use assets/work/*.webp).
# Don't serve them publicly.
[[redirects]]
  from = "/assets/gallery/*"
  to = "/404.html"
  status = 404
  force = true
